  const base = String(fileName || 'Imported account').replace(/\.[a-z]+$/i, '')
    .replace(/[_\-]+/g, ' ').replace(/\d{4,}/g, '').replace(/\s+/g, ' ').trim();
  if (!base) return 'Imported account';
  return base.charAt(0).toUpperCase() + base.slice(1);
}

/* ------------------------------------------------------------------ OFX */

function ofxTag(block, tag) {
  const m = block.match(new RegExp('<' + tag + '>([^<\\r\\n]*)', 'i'));
  return m ? m[1].trim() : null;
}

/** OFX/QFX/QBO are SGML, not XML — tags are frequently unclosed, so this reads
 *  by tag boundary rather than trying to build a tree. */
function parseOFXStatements(text, fileName) {
  if (!/<OFX>/i.test(text)) return [];
  const out = [];
  const blocks = text.split(/<(?=(?:STMTRS|CCSTMTRS)\b)/i).slice(1);
  const wholeIsCard = /<CREDITCARDMSGSRSV1|<CCSTMTRS/i.test(text);

  const chunks = blocks.length ? blocks : [text];
  chunks.forEach((chunk, i) => {
    const isCard = blocks.length ? /^CCSTMTRS/i.test(chunk) : wholeIsCard;
    const acctId = ofxTag(chunk, 'ACCTID') || '';
    const acctTypeRaw = (ofxTag(chunk, 'ACCTTYPE') || '').toUpperCase();
    const bal = parseAmount(ofxTag(chunk, 'BALAMT'));
    const balDn = parseDate(ofxTag(chunk, 'DTASOF'), false);
    const start = parseDate(ofxTag(chunk, 'DTSTART'), false);
    const end = parseDate(ofxTag(chunk, 'DTEND'), false);

    const txns = [];
    const trnBlocks = chunk.split(/<STMTTRN>/i).slice(1);
    for (const t of trnBlocks) {
      const body = t.split(/<\/STMTTRN>/i)[0];
      const dn = parseDate(ofxTag(body, 'DTPOSTED'), false);
      const amt = parseAmount(ofxTag(body, 'TRNAMT'));
      if (dn === null || amt === null) continue;
      const name = ofxTag(body, 'NAME') || '';
      const memo = ofxTag(body, 'MEMO') || '';
      txns.push({
        dn, amount: r2(amt),
        description: (name + (memo && memo !== name ? ' ' + memo : '')).trim(),
        type: (ofxTag(body, 'TRNTYPE') || '').toUpperCase()
      });
    }
    if (!txns.length && bal === null) return;
    txns.sort((a, b) => a.dn - b.dn);

    // On a card, OFX signs a purchase negative and a payment positive already,
    // and BALAMT is negative when you owe money. Normalise the balance to the
    // amount owed as a positive number.
    const type = isCard ? 'credit_card' : (acctTypeRaw === 'SAVINGS' ? 'savings' : 'checking');
    out.push({
      accountKey: 'ofx:' + (acctId || fileName + ':' + i),
      accountName: (isCard ? 'Card ' : acctTypeRaw === 'SAVINGS' ? 'Savings ' : 'Checking ') +
        (acctId ? '••' + acctId.slice(-4) : guessAccountName(fileName)),
      accountType: type,
      balance: bal === null ? null : (isCard ? Math.abs(bal) : bal),
      balanceDate: balDn,
      periodStart: start !== null ? start : (txns[0] || {}).dn,
      periodEnd: end !== null ? end : (txns[txns.length - 1] || {}).dn,
      transactions: txns,
      source: fileName + ' (OFX)'
    });
  });
  return out;
}

/* ------------------------------------------------------------ entry point */

function parseStatementFile(fileName, text) {
  const ofx = parseOFXStatements(text, fileName);
  if (ofx.length) return ofx;
  const csv = parseCSVStatement(text, fileName);
  return csv ? [csv] : [];
}


/* ============================================================================
   TRANSACTION ANALYSIS
   ----------------------------------------------------------------------------
   Turns parsed statements into a plan profile without anyone typing a number.

   What can honestly be derived from transactions:
     · which accounts exist, and their balances
     · every recurring deposit — its cadence, its day, and how much it varies,
       which is exactly the deposit history the income floor needs
     · recurring bills, split into fixed obligations and ordinary spending
     · card balances, and an APR estimated from the interest actually charged
     · what is left over: real discretionary spending, measured rather than guessed

   What cannot, and is therefore asked for rather than invented:
     · credit limits (never present in a transaction export)
     · loan balances and APRs, when only the payment is visible from checking
   Those come back as `needs` on the finding, and the UI makes them the only
   things left to fill in.
   ============================================================================ */

const median = a => {
  if (!a.length) return 0;
  const v = a.slice().sort((x, y) => x - y);
  const m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const stdev = a => {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
};
function modeOf(a) {
  const c = new Map();
  let best = a[0], bestN = 0;
  for (const x of a) {
    const n = (c.get(x) || 0) + 1; c.set(x, n);
    if (n > bestN) { bestN = n; best = x; }
  }
  return { value: best, share: a.length ? bestN / a.length : 0 };
}

/* ------------------------------------------------------- description keys */

const NOISE = /\b(POS|PURCHASE|DEBIT CARD|CARD PURCHASE|VISA|MASTERCARD|ACH|DIRECT DEP|DIRECT DEBIT|WEB ID|PPD ID|CCD ID|TRACE|REF|CONF|AUTH|RECURRING|ONLINE|MOBILE|TRANSACTION|PAYMENT FROM|XXXXX+)\b/gi;

/** Collapse "SQ *BLUE BOTTLE 8842 SEATTLE WA 04/12" and its siblings onto one
 *  key so the same merchant groups together across months. */
function descKey(desc) {
  let s = String(desc || '').toUpperCase();
  s = s.replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, ' ');   // embedded dates
  s = s.replace(NOISE, ' ');
  s = s.replace(/[*#]/g, ' ');
  s = s.replace(/\b[A-Z]{2}\b(?=\s*$)/, ' ');            // trailing state code
  s = s.replace(/\b\d{3,}\b/g, ' ');                     // store / ref numbers
  s = s.replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
  return s.split(' ').slice(0, 4).join(' ');
}

/** A name a person would recognise. Bank descriptions carry store numbers,
 *  posting dates, routing noise and a trailing state code; none of that helps
 *  anyone identify the line on their own plan. */
function prettyLabel(desc) {
  let s = String(desc || '').trim();
  if (!s) return 'Recurring item';
  const allCaps = s === s.toUpperCase();
  s = s.replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, ' ')      // embedded dates
       .replace(/\b(ACH|POS|DIRECT DEP|DIR DEP|DEBIT CARD|CARD PURCHASE|WEB ID|PPD ID|CCD ID|TRACE|REF|CONF|AUTH|XXXXX+)\b/gi, ' ')
       .replace(/[*#]/g, ' ')
       .replace(/\b\d{3,}\b/g, ' ')                        // store and account numbers
       .replace(/\s+[A-Z]{2}\s*$/, ' ')                     // trailing state code
       .replace(/\s+/g, ' ').trim()
       .replace(/^(CREDIT|DEBIT|PAYMENT)\s+(?=\S)/i, '');    // leading ledger word
  if (!s) return 'Recurring item';
  const words = s.split(' ').filter(Boolean).slice(0, 4);
  const out = words.join(' ');
  if (!allCaps) return out.length > 40 ? out.slice(0, 40).trim() : out;
  return words.map(w => w.length > 2 && /^[A-Z.&']+$/.test(w)
    ? w.charAt(0) + w.slice(1).toLowerCase() : w).join(' ');
}

/* ------------------------------------------------------------- recurrence */

/** Work out whether a set of dates repeats, and on what schedule.
 *  Returns null when the spacing is too irregular to commit a plan against. */
function detectCadence(dns) {
  if (dns.length < 3) return null;
  const d = dns.slice().sort((a, b) => a - b);
  const gaps = [];
  for (let i = 1; i < d.length; i++) gaps.push(d[i] - d[i - 1]);
  const med = median(gaps);
  const share = (lo, hi) => gaps.filter(g => g >= lo && g <= hi).length / gaps.length;
  const weekday = modeOf(d.map(x => dparts(x).w));
  const dom = modeOf(d.map(x => dparts(x).d));

  if (med >= 6 && med <= 8 && share(5, 9) >= 0.7) {
    return { cadence: 'weekly', weekday: weekday.value, dayOfMonth: dom.value, fit: share(5, 9) };
  }
  // Biweekly holds the same weekday; semimonthly cannot, because 15th and 30th
  // drift through the week. That is the cleanest way to tell them apart.
  if (med >= 12 && med <= 17 && share(11, 18) >= 0.7) {
    if (weekday.share >= 0.8) {
      return { cadence: 'biweekly', weekday: weekday.value, dayOfMonth: dom.value, fit: share(11, 18) };
    }
    return { cadence: 'semimonthly', weekday: weekday.value, dayOfMonth: dom.value, fit: share(11, 18) };
  }
  if (med >= 26 && med <= 35 && share(25, 36) >= 0.6) {
    return { cadence: 'monthly', dayOfMonth: dom.value, weekday: weekday.value, fit: share(25, 36) };
  }
  return null;
}

/** How steady are the amounts? This is what decides whether the plan may
 *  commit against the figure or has to fall back to a floor. */
function amountConfidence(amounts) {
  const abs = amounts.map(Math.abs);
  const m = mean(abs);
  if (!m) return { confidence: 'variable', cv: 1 };
  const cv = stdev(abs) / m;
  return { confidence: cv <= 0.02 ? 'certain' : cv <= 0.12 ? 'likely' : 'variable', cv };
}

/* --------------------------------------------------------- classification */

const PAT = {
  rent:     /\b(RENT|LANDLORD|PROPERTY MGMT|PROPERTY MANAGEMENT|APARTMENTS|LEASING|REALTY|MORTGAGE|MTG\b|LOANCARE|MR COOPER)\b/i,
  utility:  /\b(ELECTRIC|POWER|ENERGY|WATER|SEWER|GAS CO|UTILIT|INTERNET|BROADBAND|COMCAST|XFINITY|SPECTRUM|COX COMM|VERIZON|AT&T|ATT\b|T-MOBILE|TMOBILE|SPRINT|PHONE|WASTE|RECOLOGY|DUKE ENERGY|CON ED|CONED|NATIONAL GRID|PG&E|PGANDE)\b/i,
  card:     /\b(CARD\s*(PMT|PAYMENT)|CRD\s*PMT|CREDIT CRD|CREDITCARD|CC\s*PMT|PAYMENT THANK|CHASE CARD|AMEX|AMERICAN EXPRESS|DISCOVER|CAPITAL ONE|CAPITALONE|CITI CARD|CITICARD|SYNCHRONY|BARCLAYCARD|BANK OF AMERICA CC)\b/i,
  loan:     /\b(LOAN|NELNET|SALLIE|NAVIENT|FEDLOAN|MOHELA|GREAT LAKES|AIDVANTAGE|AUTO PAY|AUTOFIN|HONDA FIN|TOYOTA FIN|FORD CREDIT|ALLY AUTO|CARMAX|CAPITAL ONE AUTO|CHRYSLER CAP|SANTANDER)\b/i,
  transfer: /\b(TRANSFER|XFER|ZELLE|VENMO|CASH APP|PAYPAL TRANSFER|INTERNAL|TO SAVINGS|FROM SAVINGS|ONLINE BANKING TRANSFER)\b/i,
  interest: /\b(INTEREST CHARGE|FINANCE CHARGE|PURCHASE INTEREST|INTEREST CHARGED)\b/i,
  fee:      /\b(ANNUAL FEE|LATE FEE|OVERDRAFT|NSF|SERVICE CHARGE|MAINTENANCE FEE)\b/i,
  payroll:  /\b(PAYROLL|SALARY|DIRECT DEP|DIR DEP|PAY\s*CHECK|PAYCHECK|GUSTO|ADP|PAYCHEX|PAYCOM|WAGES|EMPLOYER)\b/i
};

const ACCOUNT_TYPE_HINTS = /\b(SAVINGS|SAV\b|MONEY MARKET)\b/i;

/* ----------------------------------------------------------- the analysis */

function analyzeStatements(statements) {
  const issues = [];
  const stmts = statements.filter(s => s && s.transactions);
  if (!stmts.length) return null;

  /* -- decide what each imported file actually is -------------------------- */
  stmts.forEach((s, i) => {
    if (!s.accountType) {
      const debits = s.transactions.filter(t => t.amount < 0).length;
      const credits = s.transactions.filter(t => t.amount > 0).length;
      // A card export is nearly all charges with a handful of payments; a
      // current account has deposits landing regularly.
      s.accountType = ACCOUNT_TYPE_HINTS.test(s.accountName + ' ' + s.source) ? 'savings'
        : (credits <= Math.max(2, debits * 0.12) && debits >= 8) ? 'credit_card' : 'checking';
    }
    s.accountId = 'acct-imp-' + i;
    if (s.balance === null) {
      issues.push('No closing balance found in ' + s.source + '. You will need to type that one figure.');
    }
  });

  const allTx = [];
  for (const s of stmts) {
    for (const t of s.transactions) allTx.push({ ...t, acct: s.accountId, stmt: s });
  }
  allTx.sort((a, b) => a.dn - b.dn);
  if (!allTx.length) return null;

  const from = allTx[0].dn, to = allTx[allTx.length - 1].dn;
  const days = Math.max(1, to - from + 1);
  const weeks = days / 7;

  /* -- drop money moving between accounts we imported ---------------------- */
  const matched = new Set();
  let transfersExcluded = 0;
  for (let i = 0; i < allTx.length; i++) {
    const a = allTx[i];
    if (matched.has(i) || a.amount >= 0) continue;
    for (let j = 0; j < allTx.length; j++) {
      if (i === j || matched.has(j)) continue;
      const b = allTx[j];
      if (b.acct === a.acct) continue;
      if (Math.abs(b.amount + a.amount) > 0.005) continue;
      if (Math.abs(b.dn - a.dn) > 3) continue;
      matched.add(i); matched.add(j); transfersExcluded += 2;
      break;
    }
  }
  allTx.forEach((t, i) => { t.internal = matched.has(i); });

  /* -- group by merchant, per direction ------------------------------------ */
  const groups = new Map();
  for (const t of allTx) {
    if (t.internal) continue;
    const key = (t.amount >= 0 ? '+' : '-') + '|' + t.acct + '|' + descKey(t.description);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }

  const findings = [];
  const consumed = new Set();
  let fid = 0;
  const push = f => { findings.push({ id: 'f' + (fid++), accept: true, needs: [], ...f }); };

  for (const [key, txs] of groups) {
    if (txs.length < 3) continue;
    const cad = detectCadence(txs.map(t => t.dn));
    if (!cad) continue;
    const amounts = txs.map(t => t.amount);
    const { confidence, cv } = amountConfidence(amounts);
    const inflow = amounts[0] > 0;
    const label = prettyLabel(txs[txs.length - 1].description);
    const typical = r2(Math.abs(median(amounts)));
    if (typical < 1) continue;
    const stmt = txs[0].stmt;
    const dates = txs.map(t => fmtD(t.dn));
    const evidence = txs.length + ' times between ' + fmtD(txs[0].dn) + ' and ' + fmtD(txs[txs.length - 1].dn) +
      ' · ' + CADENCE_WORD[cad.cadence] + ' · amounts ' +
      (confidence === 'certain' ? 'identical at ' + money(typical)
        : money(r2(Math.min(...amounts.map(Math.abs)))) + '–' + money(r2(Math.max(...amounts.map(Math.abs)))) +
          ' (±' + Math.round(cv * 100) + '%)');

    txs.forEach(t => consumed.add(t));

    if (inflow) {
      push({
        kind: 'income', label, amount: typical, cadence: cad.cadence,
        dayOfMonth: cad.dayOfMonth, weekday: cad.weekday, confidence,
        accountId: stmt.accountId,
        history: amounts.map(a => r2(Math.abs(a))).slice(-12),
        occurrences: txs.length, dates, evidence,
        floor: confidence === 'variable' ? r2(percentile(amounts.map(Math.abs), 0.25)) : null
      });
      continue;
    }

    const desc = txs[txs.length - 1].description;
    if (PAT.rent.test(desc)) {
      push({ kind: 'bill', billKind: 'rent', label, amount: typical, cadence: cad.cadence,
             dayOfMonth: cad.dayOfMonth, accountId: stmt.accountId, occurrences: txs.length, dates, evidence });
      continue;
    }
    if (PAT.utility.test(desc)) {
      push({ kind: 'bill', billKind: 'utility', label, amount: typical, cadence: cad.cadence,
             dayOfMonth: cad.dayOfMonth, accountId: stmt.accountId, occurrences: txs.length, dates, evidence });
      continue;
    }
    if (PAT.card.test(desc) || PAT.loan.test(desc)) {
      const isCard = PAT.card.test(desc);
      push({
        kind: 'debt', label, amount: r2(Math.min(...amounts.map(Math.abs))),
        cadence: cad.cadence, dayOfMonth: cad.dayOfMonth, accountId: stmt.accountId,
        debtKind: isCard ? 'credit_card' : (/AUTO|HONDA|TOYOTA|FORD|ALLY|CARMAX|SANTANDER|CHRYSLER/i.test(desc) ? 'auto_loan'
          : /NELNET|SALLIE|NAVIENT|FEDLOAN|MOHELA|GREAT LAKES|AIDVANTAGE|STUDENT/i.test(desc) ? 'student_loan' : 'personal_loan'),
        occurrences: txs.length, dates,
        evidence: evidence + ' · paid from ' + stmt.accountName,
        needs: ['balance', 'apr'].concat(isCard ? ['creditLimit'] : [])
      });
      continue;
    }
    if (PAT.fee.test(desc) || PAT.interest.test(desc)) { txs.forEach(t => consumed.delete(t)); continue; }
    push({
      kind: 'expense', label, amount: typical,
      cadence: cad.cadence === 'biweekly' || cad.cadence === 'semimonthly' ? 'monthly' : cad.cadence,
      dayOfMonth: cad.dayOfMonth, weekday: cad.weekday,
      accountId: stmt.accountId, occurrences: txs.length, dates, evidence
    });
  }

  /* -- credit card statements become liabilities directly ------------------ */
  for (const s of stmts) {
    if (s.accountType !== 'credit_card') continue;
    const interest = s.transactions.filter(t => PAT.interest.test(t.description));
    const bal = s.balance;
    let apr = null, aprBasis = '';
    if (interest.length && bal) {
      const monthly = mean(interest.map(t => Math.abs(t.amount)));
      const est = (monthly / bal) * 12;
      if (est > 0.03 && est < 0.40) {
        apr = Math.round(est * 10000) / 10000;
        aprBasis = 'estimated from ' + money(r2(monthly)) + ' of interest charged against a ' +
          money0(bal) + ' balance';
      }
    }
    const closeDn = s.periodEnd;
    // A payment posting on the card tells us when the bill is actually due.
    const payments = s.transactions.filter(t => t.amount > 0 && !PAT.interest.test(t.description));
    const dueDom = payments.length ? modeOf(payments.map(t => dparts(t.dn).d)).value
      : (closeDn ? ((dparts(closeDn).d + 21 - 1) % 28) + 1 : 15);
    const needs = ['creditLimit'].concat(apr === null ? ['apr'] : []);
    push({
      kind: 'card_account', label: s.accountName, accountId: s.accountId,
      balance: bal === null ? 0 : r2(bal), apr,
      statementCloseDay: closeDn ? dparts(closeDn).d : null,
      dayOfMonth: dueDom,
      minimumPayment: payments.length ? r2(Math.min(...payments.map(t => t.amount)))
        : r2(Math.max(35, (bal || 0) * 0.02)),
      minimumEstimated: !payments.length,
      occurrences: s.transactions.length,
      evidence: 'from ' + s.source + ' · balance ' + (bal === null ? 'not stated' : money(bal)) +
        (closeDn ? ' · statement closed ' + fmtD(closeDn) : '') +
        (aprBasis ? ' · APR ' + aprBasis : ' · APR not derivable from this file'),
      needs
    });
    if (bal === null) issues.push(s.accountName + ' has no balance in the file — enter it before trusting the payoff dates.');
  }

  /* -- what is left is real, measured, discretionary spending -------------- */
  const leftovers = allTx.filter(t =>
    !t.internal && t.amount < 0 && !consumed.has(t) &&
    !PAT.transfer.test(t.description) && !PAT.card.test(t.description) &&
    !PAT.loan.test(t.description) && !PAT.interest.test(t.description) && !PAT.fee.test(t.description));
  const spendTotal = r2(leftovers.reduce((s, t) => s + Math.abs(t.amount), 0));
  const weekly = r2(spendTotal / weeks);
  if (weekly >= 1) {
    const byMerchant = new Map();
    for (const t of leftovers) {
      const k = prettyLabel(t.description) || 'other';
      byMerchant.set(k, r2((byMerchant.get(k) || 0) + Math.abs(t.amount)));
    }
    const top = [...byMerchant.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5)
      .map(([k, v]) => k + ' ' + money0(v));
    push({
      kind: 'discretionary', label: 'Everyday spending', amount: weekly, cadence: 'weekly',
      weekday: 6, accountId: (stmts.find(s => s.accountType === 'checking') || stmts[0]).accountId,
      occurrences: leftovers.length,
      evidence: money(spendTotal) + ' across ' + leftovers.length + ' transactions over ' +
        Math.round(weeks) + ' weeks — ' + money(weekly) + ' a week. Biggest: ' + top.join(', ')
    });
  }

  const cadenceCount = findings.filter(f => f.kind === 'income').length;
  if (!cadenceCount) issues.push('No recurring deposits found. Either the export is too short, or income lands under names that never repeat.');
  if (days < 75) issues.push('Only ' + days + ' days of history here. Three months or more makes the cadence and income floor much more reliable.');

  return {
    statements: stmts.map(s => ({
      accountId: s.accountId, name: s.accountName, type: s.accountType,
      balance: s.balance, source: s.source, count: s.transactions.length,
      from: s.periodStart, to: s.periodEnd
    })),
    findings, issues,
    range: { from, to, days },
    transactions: allTx.length,
    transfersExcluded,
    spend: { weekly, total: spendTotal, count: leftovers.length }
  };
}

/** Which issuer a description belongs to, so the same card is not counted
 *  twice when both its statement and the payment out of checking are imported. */
function issuerOf(text) {
  const s = String(text || '').toUpperCase();
  const brands = ['CHASE', 'AMEX', 'AMERICAN EXPRESS', 'DISCOVER', 'CAPITAL ONE', 'CAPITALONE',
    'CITI', 'BARCLAY', 'SYNCHRONY', 'WELLS FARGO', 'BANK OF AMERICA', 'US BANK', 'APPLE CARD'];
  for (const b of brands) if (s.indexOf(b) >= 0) return b.replace('AMERICAN EXPRESS', 'AMEX').replace('CAPITALONE', 'CAPITAL ONE');
  return null;
}

const CADENCE_WORD = {
  weekly: 'every week', biweekly: 'every two weeks',
  semimonthly: 'twice a month', monthly: 'once a month'
};

/* --------------------------------------------- analysis → editable profile */

function profileFromAnalysis(a) {
  const p = blankProfile();
  p.profile.startedAt = new Date().toISOString();
  p.profile.balancesAsOf = new Date().toISOString();
  p.profile.name = '';
  p.accounts = [];
  p.liabilities = []; p.incomeStreams = []; p.expenses = []; p.depositHistory = {};

  // A card payment leaving checking and the card's own statement are the same
  // debt seen twice. Match them by issuer so importing one card of three does
  // not silently drop the other two.
  const importedIssuers = new Set(
    a.findings.filter(f => f.kind === 'card_account' && f.accept)
      .map(f => issuerOf(f.label)).filter(Boolean));

  for (const s of a.statements) {
    // A credit card statement is a debt, not somewhere money sits.
    if (s.type === 'credit_card') continue;
    p.accounts.push({ id: s.accountId, name: s.name, type: s.type, balance: s.balance == null ? 0 : Math.max(0, s.balance) });
  }
  if (!p.accounts.length) p.accounts.push({ id: uid('acct'), name: 'Checking', type: 'checking', balance: 0 });
  const fallback = p.accounts[0].id;
  const acctOr = id => p.accounts.some(x => x.id === id) ? id : fallback;

  for (const f of a.findings) {
    if (!f.accept) continue;
    if (f.kind === 'income') {
      const id = uid('inc');
      p.incomeStreams.push({
        id, label: f.label, cadence: f.cadence, amount: f.amount,
        dayOfMonth: f.dayOfMonth, weekday: f.weekday,
        confidence: f.confidence, accountId: acctOr(f.accountId)
      });
      if (f.confidence === 'variable' && f.history && f.history.length) p.depositHistory[id] = f.history;
    } else if (f.kind === 'bill') {
      p.liabilities.push({
        id: uid('liab'), name: f.label, kind: f.billKind, balance: 0, apr: null,
        minimumPayment: f.amount, dueDayOfMonth: f.dayOfMonth, statementCloseDay: null,
        creditLimit: null, autopayEnabled: true, accountId: acctOr(f.accountId)
      });
    } else if (f.kind === 'card_account') {
      p.liabilities.push({
        id: uid('liab'), name: f.label, kind: 'credit_card',
        balance: f.balance, apr: f.apr == null ? 0.2299 : f.apr,
        minimumPayment: f.minimumPayment, dueDayOfMonth: f.dayOfMonth,
        statementCloseDay: f.statementCloseDay, creditLimit: f.creditLimit || null,
        autopayEnabled: false, accountId: fallback
      });
    } else if (f.kind === 'debt') {
      // Only visible as a payment leaving checking, so the balance is unknown.
      const iss = issuerOf(f.label);
      if (f.debtKind === 'credit_card' && iss && importedIssuers.has(iss)) continue;
      p.liabilities.push({
        id: uid('liab'), name: f.label, kind: f.debtKind, balance: f.balance || 0,
        apr: f.apr == null ? (f.debtKind === 'credit_card' ? 0.2299 : 0.0699) : f.apr,
        minimumPayment: f.amount, dueDayOfMonth: f.dayOfMonth,
        statementCloseDay: f.debtKind === 'credit_card' ? ((f.dayOfMonth + 25) % 28) + 1 : null,
        creditLimit: null, autopayEnabled: true, accountId: acctOr(f.accountId)
      });
    } else if (f.kind === 'expense' || f.kind === 'discretionary') {
      p.expenses.push({
        id: uid('exp'), label: f.label, amount: f.amount,
        cadence: f.cadence === 'weekly' ? 'weekly' : 'monthly',
        dayOfMonth: f.dayOfMonth || 1, weekday: f.weekday == null ? 1 : f.weekday,
        accountId: acctOr(f.accountId), category: f.kind === 'discretionary' ? 'discretionary' : 'recurring'
      });
    }
  }

  // Half a month of measured everyday spending — fixed bills excluded, since
  // the schedule already reserves for those by date. Defensible starting point,
  // and adjustable on the What if screen.
  const monthlyEveryday = p.expenses.reduce(
    (s, e) => s + e.amount * (e.cadence === 'weekly' ? 52 / 12 : 1), 0);
  p.settings.bufferFloor = Math.max(300, Math.round(monthlyEveryday / 2 / 50) * 50);
  return p;
}

/** Everything the import could not work out, as a to-do list. */
function outstandingNeeds(a) {
  const out = [];
  for (const f of a.findings) {
    if (!f.accept || !f.needs.length) continue;
    out.push({ label: f.label, needs: f.needs.slice(), kind: f.kind });
  }
  return out;
}


/* ============================================================================
   SAMPLE STATEMENTS
   ----------------------------------------------------------------------------
   Synthetic exports in the formats real banks actually produce. They exist for
   two reasons: the test suite runs the real parsers against them on every load,
   and anyone can try the import flow before trusting it with their own files.

   Generated from a fixed anchor date so the tests are stable whatever day it
   is. Nothing here is a shortcut — the sample path goes through exactly the
   same parse-and-analyse code as a file you drop in.
   ============================================================================ */

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function usDate(dn) { const p = dparts(dn); return pad2(p.m + 1) + '/' + pad2(p.d) + '/' + p.y; }
function ukDate(dn) { const p = dparts(dn); return pad2(p.d) + '/' + pad2(p.m + 1) + '/' + p.y; }
function ofxDate(dn) { const p = dparts(dn); return '' + p.y + pad2(p.m + 1) + pad2(p.d) + '120000[-5:EST]'; }

/* A tiny deterministic jitter so amounts vary the way real ones do without
   pulling in randomness the tests could not reproduce. */
function wobble(seed, spread) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return (x - Math.floor(x) - 0.5) * 2 * spread;
}

const SAMPLE_ANCHOR = '2025-09-01';

function buildSampleFiles() {
  const start = dnFromISO(SAMPLE_ANCHOR);
  const end = start + 181;                       // six months of history
  const tx = [];
  const add = (dn, description, amount) => { if (dn >= start && dn <= end) tx.push({ dn, description, amount: r2(amount) }); };

  // Salary, every second Friday, to the cent.
  let seed = 1;
  for (let d = nextWeekday(start, 5); d <= end; d += 14) {
    add(d, 'DIRECT DEP MERIDIAN HEALTH PAYROLL PPD ID 9912', 1742.36);
  }
  // A second, irregular income: freelance invoices, once a month, swinging hard.
  for (const d of monthlyDates(start, end, 22)) {
    add(d, 'ACH CREDIT HALCYON STUDIO INVOICE', 900 + wobble(seed++, 620) + 620);
  }
  // Fixed obligations.
  for (const d of monthlyDates(start, end, 1)) add(d, 'RENT PAYMENT ARBOR COURT PROPERTY MGMT', -1495);
  for (const d of monthlyDates(start, end, 18)) add(d, 'DUKE ENERGY WEB PMT 4471', -(128 + wobble(seed++, 22)));
  for (const d of monthlyDates(start, end, 8)) add(d, 'VERIZON WIRELESS AUTOPAY', -72);
  // Debts, seen only as money leaving.
  for (const d of monthlyDates(start, end, 20)) add(d, 'CHASE CARD PMT EPAY 8842', -265);
  for (const d of monthlyDates(start, end, 12)) add(d, 'ALLY AUTO PAY LOAN 55120', -394.12);
  // Money moved to savings — should be recognised as internal, not spending.
  for (const d of monthlyDates(start, end, 5)) add(d, 'ONLINE TRANSFER TO SAVINGS XXXXX4471', -300);
  // Ordinary life.
  for (let d = nextWeekday(start, 6); d <= end; d += 7) {
    add(d, 'SAFEWAY #1428 SEATTLE WA ' + usDate(d).slice(0, 5), -(118 + wobble(seed++, 34)));
  }
  for (let d = nextWeekday(start, 1); d <= end; d += 7) {
    add(d, 'SHELL OIL 57320981 SEATTLE WA', -(44 + wobble(seed++, 13)));
  }
  // One-offs that must not be mistaken for a pattern.
  add(start + 23, 'SQ *BLUE BOTTLE COFFEE 8842', -18.4);
  add(start + 51, 'DELTA AIR 0062418833', -412.9);
  add(start + 97, 'HOME DEPOT #4471 RENTON WA', -186.22);
  add(start + 140, 'SEATTLE CITY LIGHT DEPOSIT REFUND', 64.5);

  tx.sort((a, b) => a.dn - b.dn || (a.description < b.description ? -1 : 1));
  let bal = 1284.55 - tx.reduce((s, t) => s + t.amount, 0);
  const checkingRows = ['Date,Description,Amount,Balance'];
  for (const t of tx) {
    bal = r2(bal + t.amount);
    checkingRows.push([usDate(t.dn), '"' + t.description + '"', t.amount.toFixed(2), bal.toFixed(2)].join(','));
  }

  /* -- savings: the other half of each transfer, plus a little interest ----- */
  const savRows = ['Date,Description,Amount,Balance'];
  let sbal = 2150;
  const savTx = [];
  for (const d of monthlyDates(start, end, 5)) savTx.push({ dn: d, description: 'TRANSFER FROM CHECKING XXXXX1102', amount: 300 });
  for (const d of monthlyDates(start, end, 28)) savTx.push({ dn: d, description: 'INTEREST PAID', amount: 0.62 });
  savTx.sort((a, b) => a.dn - b.dn);
  for (const t of savTx) { sbal = r2(sbal + t.amount); savRows.push([usDate(t.dn), t.description, t.amount.toFixed(2), sbal.toFixed(2)].join(',')); }

  /* -- credit card, as OFX ------------------------------------------------- */
  const cardTx = [];
  seed = 500;
  for (let d = nextWeekday(start, 3); d <= end; d += 7) {
    cardTx.push({ dn: d, name: 'TRADER JOES #182', amt: -(62 + wobble(seed++, 19)), type: 'DEBIT' });
  }
  for (const d of monthlyDates(start, end, 14)) cardTx.push({ dn: d, name: 'NETFLIX.COM', amt: -22.99, type: 'DEBIT' });
  for (const d of monthlyDates(start, end, 20)) cardTx.push({ dn: d, name: 'PAYMENT THANK YOU', amt: 265, type: 'CREDIT' });
  // 26.24% APR on $9,846.20 is $215.30 a month — the analyser reads the rate
  // back out of exactly this line.
  for (const d of monthlyDates(start, end, 26)) cardTx.push({ dn: d, name: 'INTEREST CHARGE ON PURCHASES', amt: -215.30, type: 'INT' });
  cardTx.sort((a, b) => a.dn - b.dn);

  const closeDn = monthlyDates(start, end, 26).slice(-1)[0];
  const ofx = [
    'OFXHEADER:100', 'DATA:OFXSGML', 'VERSION:102', 'SECURITY:NONE', 'ENCODING:USASCII',
    'CHARSET:1252', 'COMPRESSION:NONE', 'OLDFILEUID:NONE', 'NEWFILEUID:NONE', '',
    '<OFX><CREDITCARDMSGSRSV1><CCSTMTTRNRS><TRNUID>1<STATUS><CODE>0<SEVERITY>INFO</STATUS>',
    '<CCSTMTRS><CURDEF>USD<CCACCTFROM><ACCTID>4147202288848842</CCACCTFROM>',
    '<BANKTRANLIST><DTSTART>' + ofxDate(start) + '<DTEND>' + ofxDate(closeDn)
  ];
  cardTx.forEach((t, i) => {
    ofx.push('<STMTTRN><TRNTYPE>' + t.type + '<DTPOSTED>' + ofxDate(t.dn) +
      '<TRNAMT>' + r2(t.amt).toFixed(2) + '<FITID>' + (900000 + i) +
      '<NAME>' + t.name + '</STMTTRN>');
  });
  ofx.push('</BANKTRANLIST>');
  ofx.push('<LEDGERBAL><BALAMT>-9846.20<DTASOF>' + ofxDate(closeDn) + '</LEDGERBAL>');
  ofx.push('</CCSTMTRS></CCSTMTTRNRS></CREDITCARDMSGSRSV1></OFX>');

  return {
    'meridian-checking.csv': checkingRows.join('\n'),
    'meridian-savings.csv': savRows.join('\n'),
    'chase-freedom.qfx': ofx.join('\n')
  };
}

/** A second format, kept deliberately awkward: day-first dates, separate
 *  debit and credit columns, no signs, semicolon separated, currency symbols. */
function buildAwkwardCSV() {
  const start = dnFromISO(SAMPLE_ANCHOR);
  const rows = ['Transaction Date;Details;Money Out;Money In;Balance'];
  let bal = 900;
  const add = (dn, d, out, inn) => {
    bal = r2(bal - (out || 0) + (inn || 0));
    rows.push([ukDate(dn), d, out ? '£' + out.toFixed(2) : '', inn ? '£' + inn.toFixed(2) : '', bal.toFixed(2)].join(';'));
  };
  for (let i = 0; i < 6; i++) {
    const m = monthlyDates(start, start + 181, 25)[i];
    if (m) add(m, 'SALARY BRIGHTON LTD', 0, 2410.55);
  }
  for (let i = 0; i < 6; i++) {
    const m = monthlyDates(start, start + 181, 3)[i];
    if (m) add(m, 'BRITISH GAS DD', 88.4, 0);
  }
  return rows.join('\n');
}


/* ============================================================================
   PROFILES, STORAGE, VALIDATION, EXPORT
   ----------------------------------------------------------------------------
   A "profile" is one household's raw data. It is the only thing that persists,
   and it is the only thing the user edits.

   makeDataSource(profile) turns a profile into the DataSource the engine
   consumes. MockDataSource (demo personas) and LocalDataSource (your own data,
   from localStorage) are the same function with different inputs — which is
   the point of the adapter boundary: PlaidDataSource and MethodDataSource slot
   in beside them without the engine noticing.
   ============================================================================ */

const CADENCES = ['weekly', 'biweekly', 'semimonthly', 'monthly'];
const KINDS = ['credit_card', 'auto_loan', 'student_loan', 'mortgage', 'personal_loan', 'rent', 'utility'];
const CONFIDENCES = ['certain', 'likely', 'variable'];
const STRATEGIES = ['avalanche', 'snowball', 'hybrid'];
const NO_BALANCE_KINDS = ['rent', 'utility'];

function uid(prefix) {
  return prefix + Math.random().toString(36).slice(2, 9);
}

/* --------------------------------------------------------------- normalise */

const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : (d || 0); };
const clampInt = (v, lo, hi, d) => {
  const n = Math.round(num(v, d));
  return Math.min(hi, Math.max(lo, Number.isFinite(n) ? n : d));
};
const oneOf = (v, list, d) => list.indexOf(v) >= 0 ? v : d;

/** Coerce anything the editor can produce into something the engine can trust.
 *  The engine assumes valid ranges everywhere; this is the single place that
 *  guarantees them, so hand-entered data can never reach the solver malformed. */
function normalizeProfile(p) {
  const out = {
    profile: {
      id: (p.profile && p.profile.id) || 'mine',
      name: ((p.profile && p.profile.name) || '').trim() || 'Your plan',
      tagline: (p.profile && p.profile.tagline) || '',
      note: (p.profile && p.profile.note) || '',
      balancesAsOf: (p.profile && p.profile.balancesAsOf) || null,
      startedAt: (p.profile && p.profile.startedAt) || null
    },
    accounts: [], liabilities: [], incomeStreams: [], expenses: [],
    depositHistory: {}, settings: {}
  };

  out.accounts = (p.accounts || []).map(a => ({
    id: a.id || uid('acct'),
    name: (a.name || '').trim() || 'Account',
    type: oneOf(a.type, ['checking', 'savings'], 'checking'),
    balance: Math.max(0, num(a.balance, 0))
  }));
  // Every household needs somewhere for money to sit.
  if (out.accounts.length && !out.accounts.some(a => a.type === 'checking')) {
    out.accounts[0].type = 'checking';
  }
  const ids = out.accounts.map(a => a.id);
  const primary = (out.accounts.find(a => a.type === 'checking') || out.accounts[0] || {}).id;
  const acct = id => ids.indexOf(id) >= 0 ? id : primary;

  out.liabilities = (p.liabilities || []).map(l => {
    const kind = oneOf(l.kind, KINDS, 'credit_card');
    const noBalance = NO_BALANCE_KINDS.indexOf(kind) >= 0;
    const isCard = kind === 'credit_card';
    return {
      id: l.id || uid('liab'),
      name: (l.name || '').trim() || 'Untitled',
      kind,
      balance: noBalance ? 0 : Math.max(0, num(l.balance, 0)),
      apr: noBalance ? null : Math.max(0, Math.min(1, num(l.apr, 0))),
      minimumPayment: Math.max(0, num(l.minimumPayment, 0)),
      dueDayOfMonth: clampInt(l.dueDayOfMonth, 1, 31, 1),
      statementCloseDay: isCard && l.statementCloseDay != null && l.statementCloseDay !== ''
        ? clampInt(l.statementCloseDay, 1, 31, 1) : null,
      creditLimit: isCard && num(l.creditLimit, 0) > 0 ? num(l.creditLimit, 0) : null,
      autopayEnabled: !!l.autopayEnabled,
      accountId: acct(l.accountId)
    };
  });

  out.incomeStreams = (p.incomeStreams || []).map(s => {
    const cadence = oneOf(s.cadence, CADENCES, 'monthly');
    return {
      id: s.id || uid('inc'),
      label: (s.label || '').trim() || 'income',
      cadence,
      amount: Math.max(0, num(s.amount, 0)),
      dayOfMonth: clampInt(s.dayOfMonth, 1, 31, 1),
      weekday: clampInt(s.weekday, 0, 6, 5),
      confidence: oneOf(s.confidence, CONFIDENCES, 'certain'),
      accountId: acct(s.accountId)
    };
  });

  out.expenses = (p.expenses || []).map(e => ({
    id: e.id || uid('exp'),
    label: (e.label || '').trim() || 'Spending',
    amount: Math.max(0, num(e.amount, 0)),
    cadence: oneOf(e.cadence, ['weekly', 'monthly'], 'monthly'),
    dayOfMonth: clampInt(e.dayOfMonth, 1, 31, 1),
    weekday: clampInt(e.weekday, 0, 6, 1),
    accountId: acct(e.accountId),
    category: e.category || 'other'
  }));

  for (const s of out.incomeStreams) {
    const hist = (p.depositHistory || {})[s.id] || [];
    out.depositHistory[s.id] = hist.map(v => num(v, 0)).filter(v => v > 0);
  }

  const st = p.settings || {};
  out.settings = {
    bufferFloor: Math.max(0, num(st.bufferFloor, 500)),
    strategy: oneOf(st.strategy, STRATEGIES, 'avalanche'),
    optimizeForCreditScore: st.optimizeForCreditScore !== false,
    horizonDays: clampInt(st.horizonDays, 30, 365, 90),
    extraMonthly: Math.max(0, num(st.extraMonthly, 0))
  };
  return out;
}

/* -------------------------------------------------------------- validation */

/** Problems worth telling someone about before they trust the plan.
 *  Errors block the plan; warnings do not. */
function validateProfile(p) {
  const errors = [], warnings = [];
  const cash = p.accounts.filter(a => a.type === 'checking');
  if (!p.accounts.length) errors.push('Add at least one account — the plan needs somewhere to pay from.');
  else if (!cash.length) errors.push('Add a checking account. Savings alone cannot be scheduled against.');

  if (!p.liabilities.length) errors.push('Add at least one debt or bill. Without something to pay there is nothing to schedule.');

  const totalCash = cash.reduce((s, a) => s + a.balance, 0);
  if (p.settings.bufferFloor > totalCash && cash.length) {
    warnings.push('Your buffer floor (' + money0(p.settings.bufferFloor) + ') is above what is in checking right now (' +
      money0(totalCash) + '). The plan will draw on savings to hold the line, or flag a breach if it cannot.');
  }

  if (!p.incomeStreams.length) {
    warnings.push('No income yet. The plan will schedule from your current balance only, which will run out.');
  }

  for (const l of p.liabilities) {
    const noBal = NO_BALANCE_KINDS.indexOf(l.kind) >= 0;
    if (l.minimumPayment <= 0) warnings.push('"' + l.name + '" has no minimum payment, so nothing will be scheduled for it.');
    if (!noBal && l.balance > 0 && l.apr === 0) warnings.push('"' + l.name + '" is at 0% APR. If that is a promotional rate, remember it ends.');
    if (!noBal && l.balance > 0 && l.minimumPayment > 0 && l.apr > 0) {
      const monthlyInterest = l.balance * l.apr / 12;
      if (l.minimumPayment <= monthlyInterest) {
        errors.push('"' + l.name + '" accrues ' + money(monthlyInterest) + ' of interest a month but its minimum is only ' +
          money(l.minimumPayment) + '. That balance grows no matter what the plan does — check the numbers.');
      }
    }
    if (l.kind === 'credit_card' && !l.creditLimit) {
      warnings.push('"' + l.name + '" has no credit limit set, so utilization cannot be reported or optimised for it.');
    }
    if (l.kind === 'credit_card' && l.statementCloseDay == null) {
      warnings.push('"' + l.name + '" has no statement close day, so its payment cannot be timed ahead of the close.');
    }
  }

  for (const s of p.incomeStreams) {
    if (s.confidence === 'variable') {
      const n = (p.depositHistory[s.id] || []).length;
      if (n === 0) warnings.push('"' + s.label + '" is marked variable but has no deposit history, so the plan has to trust the figure you typed.');
      else if (n < 6) warnings.push('"' + s.label + '" has only ' + n + ' past deposits. A floor gets meaningful around 8–12.');
    }
  }

  /* The arithmetic that decides whether any of this is possible. */
  const monthlyIn = p.incomeStreams.reduce((s, x) => {
    const per = { weekly: 52 / 12, biweekly: 26 / 12, semimonthly: 2, monthly: 1 }[x.cadence];
    const amt = x.confidence === 'variable' && (p.depositHistory[x.id] || []).length
      ? percentile(p.depositHistory[x.id], 0.25) : x.amount;
    return s + amt * per;
  }, 0);
  const monthlyOut = p.liabilities.reduce((s, l) => s + l.minimumPayment, 0) +
    p.expenses.reduce((s, e) => s + e.amount * (e.cadence === 'weekly' ? 52 / 12 : 1), 0);
  if (p.incomeStreams.length && monthlyOut > monthlyIn) {
    errors.push('Your committed outgoings (' + money0(monthlyOut) + '/mo) exceed the income the plan can count on (' +
      money0(monthlyIn) + '/mo). No payment schedule fixes a gap like that — something has to change first.');
  }

  return { errors, warnings, monthlyIn, monthlyOut, slack: r2(monthlyIn - monthlyOut) };
}

/* ------------------------------------------------------------- data source */

function makeDataSource(rawProfile) {
  const p = normalizeProfile(rawProfile);

  function expandStream(s, startDn, days) {
    const endDn = startDn + days;
    const out = [];
    const hist = p.depositHistory[s.id];
    let occ = 0;
    const emit = (dn) => {
      // Variable streams draw deterministically from trailing history, so the
      // "expected" run is reproducible run to run — no randomness anywhere.
      const amount = (s.confidence === 'variable' && hist && hist.length)
        ? hist[(occ + 3) % hist.length]
        : s.amount;
      out.push({
        id: s.id + '-' + dn, streamId: s.id, label: s.label,
        amount: r2(amount), dn, confidence: s.confidence, accountId: s.accountId
      });
      occ++;
    };
    if (s.cadence === 'biweekly') {
      for (let d = nextWeekday(startDn, s.weekday); d <= endDn; d += 14) emit(d);
    } else if (s.cadence === 'weekly') {
      for (let d = nextWeekday(startDn, s.weekday); d <= endDn; d += 7) emit(d);
    } else if (s.cadence === 'semimonthly') {
      monthlyDates(startDn, endDn, 15).concat(monthlyDates(startDn, endDn, 31))
        .sort((a, b) => a - b).forEach(emit);
    } else {
      monthlyDates(startDn, endDn, s.dayOfMonth).forEach(emit);
    }
    return out;
  }

  return {
    raw: p,
    getProfile:        () => ({ ...p.profile }),
    getAccounts:       () => p.accounts.map(a => ({ ...a })),
    getLiabilities:    () => p.liabilities.map(l => ({ ...l })),
    getExpenses:       () => p.expenses.map(e => ({ ...e })),
    getSettings:       () => ({ ...p.settings }),
    getDepositHistory: (streamId) => (p.depositHistory[streamId] || []).slice(),
    getIncomeStreams:  () => p.incomeStreams.map(s => ({ ...s })),
    getIncomeEvents:   (startDn, days) => {
      const out = [];
      for (const s of p.incomeStreams) out.push(...expandStream(s, startDn, days));
      out.sort((a, b) => a.dn - b.dn || (a.id < b.id ? -1 : 1));
      return out;
    }
  };
}

const clone = o => JSON.parse(JSON.stringify(o));
function MockDataSource(personaId) {
  const p = PERSONAS[personaId];
  if (!p) throw new Error('unknown persona: ' + personaId);
  return makeDataSource(clone(p));
}
const PERSONA_IDS = ['steady', 'freelance', 'household'];

/* ------------------------------------------------------------------ storage */

const STORE_KEY = 'debt-scheduler.profile.v1';

function blankProfile() {
  const chk = uid('acct');
  return {
    profile: { id: 'mine', name: '', tagline: '', note: '', balancesAsOf: null, startedAt: null },
    settings: { bufferFloor: 500, strategy: 'avalanche', optimizeForCreditScore: true, horizonDays: 90, extraMonthly: 0 },
    accounts: [{ id: chk, name: 'Checking', type: 'checking', balance: 0 }],
    incomeStreams: [], depositHistory: {}, liabilities: [], expenses: []
  };
}

function loadProfile() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.data) return null;
    return parsed.data;
  } catch (e) {
    return null;
  }
}

function saveProfile(data) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, savedAt: new Date().toISOString(), data }));
    return true;
  } catch (e) {
    return false;   // private browsing, quota, disabled storage
  }
}

function clearProfile() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing to do */ }
}

/** A persona, copied into an editable profile of your own. */
function profileFromPersona(personaId) {
  const p = clone(PERSONAS[personaId]);
  return {
    profile: { id: 'mine', name: '', tagline: '', note: '', balancesAsOf: new Date().toISOString() },
    settings: p.settings,
    accounts: p.accounts,
    incomeStreams: p.incomeStreams,
    depositHistory: p.depositHistory,
    liabilities: p.liabilities,
    expenses: p.expenses
  };
}

/* ------------------------------------------------------------------ exports */

function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function planToCSV(plan) {
  const name = id => (plan.accounts.find(a => a.id === id) || {}).name || '';
  const rows = [['Date', 'Type', 'Payee', 'Amount', 'From account', 'Due date', 'Conditional', 'Why']];
  plan.payments.concat(plan.sweeps).sort((a, b) => a.dn - b.dn).forEach(p => {
    rows.push([
      isoFromDn(p.dn), p.type, p.label, p.amount.toFixed(2),
      name(p.fromAccountId) + (p.toAccountId ? ' -> ' + name(p.toAccountId) : ''),
      p.dueDn ? isoFromDn(p.dueDn) : '', p.conditional ? 'yes' : 'no', p.reason
    ]);
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

/** Fold to 75 octets and escape per RFC 5545, so real calendar apps accept it. */
function icsLine(line) {
  const esc = line.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const out = [];
  let s = esc;
  while (s.length > 74) { out.push(s.slice(0, 74)); s = ' ' + s.slice(74); }
  out.push(s);
  return out.join('\r\n');
}

function planToICS(plan) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const name = id => (plan.accounts.find(a => a.id === id) || {}).name || '';
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//debt payoff scheduler//v1//EN',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    icsLine('X-WR-CALNAME:' + (plan.profile.name || 'Payment plan'))
  ];
  plan.payments.concat(plan.sweeps).sort((a, b) => a.dn - b.dn).forEach((p, i) => {
    if (p.type === 'transfer' && p.tags.indexOf('topup') < 0 && p.tags.indexOf('savings_draw') < 0) return;
    const d = isoFromDn(p.dn).replace(/-/g, '');
    const title = (p.conditional ? 'If income allows: ' : '') +
      (p.type === 'transfer' ? 'Move ' + money(p.amount) + ' to ' + name(p.toAccountId)
                             : 'Pay ' + money(p.amount) + ' — ' + p.label);
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + p.id + '-' + d + '-' + i + '@debt-scheduler');
    lines.push('DTSTAMP:' + stamp);
    lines.push('DTSTART;VALUE=DATE:' + d);
    lines.push('DTEND;VALUE=DATE:' + isoFromDn(p.dn + 1).replace(/-/g, ''));
    lines.push(icsLine('SUMMARY:' + title));
    lines.push(icsLine('DESCRIPTION:' + p.reason));
    lines.push('BEGIN:VALARM', 'TRIGGER:-PT9H', 'ACTION:DISPLAY',
               icsLine('DESCRIPTION:' + title), 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}


/* ============================================================================
   TESTS — run on load, results rendered into the app. No console-only failures.
   Every assertion is a property of the plan, not a golden value, so the suite
   still means something after the numbers change.
   ============================================================================ */

function runTests() {
  const suites = [];
  const t0 = Date.now();

  for (const pid of PERSONA_IDS) {
    const ds = MockDataSource(pid);
    const profile = ds.getProfile();
    const checks = [];
    const startDn = todayDn();
    const plan = buildPlan(ds, { startDn });
    const S = plan.settings;
    const horizonEnd = startDn + plan.horizonDays;
    const acctName = id => (plan.accounts.find(a => a.id === id) || {}).name || id;

    /* ---- 1. hard constraint: the buffer floor holds, every day ---- */
    (() => {
      const worstIdx = plan.series.total.indexOf(Math.min(...plan.series.total));
      const worst = plan.series.total[worstIdx];
      const worstExp = Math.min(...plan.expectedSeries.total);
      let overdrafts = 0, odDetail = '';
      for (const id of Object.keys(plan.series.byAccount)) {
        plan.series.byAccount[id].forEach((v, i) => {
          if (v < -0.005 && !overdrafts++) odDetail = acctName(id) + ' at ' + money(v) + ' on ' + fmtD(plan.series.dn[i]);
        });
      }
      checks.push({
        name: 'Projected balance never breaches the buffer floor',
        pass: worst >= S.bufferFloor - 0.005 && worstExp >= S.bufferFloor - 0.005 && overdrafts === 0,
        detail: 'Floor ' + money0(S.bufferFloor) + '. Lowest projected household checking over ' +
                plan.horizonDays + ' days: ' + money(worst) + ' on ' + fmtD(plan.series.dn[worstIdx]) +
                ' (conservative), ' + money(worstExp) + ' (expected). ' +
                (overdrafts ? overdrafts + ' account-level overdraft(s): ' + odDetail
                            : 'No individual account goes below zero.')
      });
    })();

    /* ---- 2. hard constraint: no minimum is ever late or short ---- */
    (() => {
      const late = plan.lates.length;
      const short = plan.shortfalls.length;
      const dueInHorizon = plan.obligations.filter(o => !o.skipped);
      let latestGap = Infinity, worstOb = null;
      for (const ob of dueInHorizon) {
        if (ob.paidDn == null) continue;
        const gap = ob.dueDn - ob.paidDn;
        if (gap < latestGap) { latestGap = gap; worstOb = ob; }
      }
      checks.push({
        name: 'Every minimum is scheduled on or before its due date',
        pass: late === 0 && short === 0 && latestGap >= 0,
        detail: dueInHorizon.length + ' obligations fall inside the horizon; ' + late + ' late, ' +
                short + ' short. Tightest margin: ' +
                (worstOb ? latestGap + ' day(s) before the ' + fmtD(worstOb.dueDn) + ' due date.' : 'n/a')
      });
    })();

    /* ---- 3. hard constraint: nothing is spent before it arrives ---- */
    (() => {
      const available = r2(plan.totals.startingCash + plan.totals.inflowPlanned);
      const out = r2(plan.totals.scheduledOutflow + plan.totals.expenses);
      const tight = out <= r2(available - S.bufferFloor) + 0.005;
      checks.push({
        name: 'Total outflow never exceeds starting balance plus inflow',
        pass: plan.totals.scheduledOutflow <= available + 0.005 && tight,
        detail: 'Scheduled payments ' + money(plan.totals.scheduledOutflow) + ' + background spending ' +
                money(plan.totals.expenses) + ' = ' + money(out) + ' against ' + money(plan.totals.startingCash) +
                ' on hand plus ' + money(plan.totals.inflowPlanned) + ' of committed income. ' +
                money(r2(available - out)) + ' left over, floor is ' + money0(S.bufferFloor) + '.'
      });
    })();

    /* ---- 4. avalanche beats snowball at the expensive debt ---- */
    (() => {
      const debts = plan.liabilities.filter(l => l.apr != null);
      const top = debts.slice().sort((a, b) => b.apr - a.apr)[0];
      const dollarsTo = (strategy) => {
        const p = buildPlan(ds, { startDn, strategy, skipProjection: true });
        return r2(p.payments.filter(x => x.liabilityId === top.id && x.type !== 'transfer')
                            .reduce((s, x) => s + x.amount, 0));
      };
      const av = dollarsTo('avalanche'), sn = dollarsTo('snowball');
      checks.push({
        name: 'Avalanche sends strictly more to the highest-APR debt than snowball',
        pass: av > sn + 0.005,
        detail: 'Highest rate is ' + top.name + ' at ' + pct1(top.apr) + '. Over ' + plan.horizonDays +
                ' days avalanche directs ' + money(av) + ' at it, snowball ' + money(sn) +
                ' — a ' + money(r2(av - sn)) + ' difference.'
      });
    })();

    /* ---- 5. statement-close timing actually moves reported utilization ---- */
    (() => {
      // Swept across strategies on purpose. The engine declines the move when
      // the card is already the surplus target — pulling the minimum forward
      // would reserve the same dollars for a later date and report the same
      // balance. So the property that must hold everywhere is "never worse",
      // and it must be strictly better wherever the move is available.
      const rows = ['avalanche', 'snowball', 'hybrid'].map(strategy => {
        const on  = buildPlan(ds, { startDn, strategy, optimizeForCreditScore: true,  skipProjection: true });
        const off = buildPlan(ds, { startDn, strategy, optimizeForCreditScore: false, skipProjection: true });
        return {
          strategy,
          on: on.peakReportedUtilization,
          off: off.peakReportedUtilization,
          moves: on.payments.filter(p => p.type === 'statement_close').length
        };
      });
      const neverWorse = rows.every(r => r.on <= r.off + 0.0001);
      const helped = rows.filter(r => r.on < r.off - 0.0001);
      const anyMoves = rows.some(r => r.moves > 0);
      checks.push({
        name: 'Statement-close timing lowers peak reported utilization',
        pass: neverWorse && helped.length > 0 && anyMoves,
        detail: rows.map(r => r.strategy + ': ' + pct1(r.on) + ' vs ' + pct1(r.off) +
          (r.moves ? ' (' + r.moves + ' move' + (r.moves > 1 ? 's' : '') + ')' : ' (declined — that card is already the surplus target)')
        ).join(' · ') + '. Best improvement ' +
        (Math.round(Math.max(...rows.map(r => r.off - r.on)) * 1000) / 10) + ' points of peak utilization.'
      });
    })();

    /* ---- 6. every payment lands inside the horizon ---- */
    (() => {
      const bad = plan.payments.filter(p => p.dn < startDn || p.dn >= horizonEnd);
      const beforeDue = plan.payments.filter(p => p.dueDn != null && p.dn > p.dueDn);
      checks.push({
        name: 'No payment is dated outside the horizon or after its due date',
        pass: bad.length === 0 && beforeDue.length === 0,
        detail: plan.payments.length + ' payments, all inside ' + fmtD(startDn) + '–' + fmtD(horizonEnd - 1) + '.'
      });
    })();

    /* ---- 7. every decision explains itself in a real sentence ---- */
    (() => {
      const all = plan.payments.concat(plan.sweeps);
      const weak = all.filter(p => !p.reason || p.reason.length < 45 ||
        !/\$/.test(p.reason) || !/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/.test(p.reason));
      const lens = all.map(p => p.reason.length);
      checks.push({
        name: 'Every scheduled payment carries a specific, generated reason',
        pass: weak.length === 0 && all.length > 0,
        detail: all.length + ' payments, all with a dated, dollar-specific sentence. Shortest ' +
                Math.min(...lens) + ' chars, longest ' + Math.max(...lens) + '. ' +
                (weak.length ? 'Weak: ' + weak[0].reason : '')
      });
    })();

    /* ---- 8. the engine is deterministic ---- */
    (() => {
      const a = buildPlan(ds, { startDn, skipProjection: true });
      const b = buildPlan(ds, { startDn, skipProjection: true });
      const key = p => p.payments.map(x => [x.dn, x.type, x.liabilityId, x.amount, x.reason].join('|')).join('\n');
      checks.push({
        name: 'Two runs of the same inputs produce an identical plan',
        pass: key(a) === key(b),
        detail: 'Same schedule, same amounts, same sentences. No randomness, no clock reads inside the solver.'
      });
    })();

    /* ---- 9. irregular income is planned against a floor, not an average ---- */
    (() => {
      const streams = ds.getIncomeStreams().filter(s => s.confidence === 'variable');
      if (!streams.length) {
        checks.push({
          name: 'Income floor logic (no variable income for this persona)',
          pass: true, skipped: true,
          detail: 'All deposits are certain, so the plan commits against the full amount.'
        });
        return;
      }
      let ok = true; const bits = [];
      for (const s of streams) {
        const hist = ds.getDepositHistory(s.id);
        const mean = hist.reduce((x, y) => x + y, 0) / hist.length;
        const p25 = r2(percentile(hist, 0.25));
        const used = plan.incomeFloors[s.id];
        if (!(used === p25 && used < mean)) ok = false;
        bits.push(s.label + ': floor ' + money0(used) + ' vs ' + money0(mean) + ' average (' +
                  Math.round((1 - used / mean) * 100) + '% haircut)');
      }
      const committed = plan.payments.filter(p => !p.conditional).length;
      checks.push({
        name: 'Variable income is committed against the 25th percentile, not the mean',
        pass: ok && plan.sweeps.length > 0,
        detail: bits.join('; ') + '. ' + committed + ' committed payments survive a floor month; ' +
                plan.sweeps.length + ' conditional sweeps totalling ' + money(plan.totals.sweepOutflow) +
                ' fire only if the deposits come in above it.'
      });
    })();

    /* ---- 10. the plan does not fall apart on awkward start dates ---- */
    (() => {
      const offsets = [0, 1, 2, 3, 5, 8, 13, 17, 21, 26, 30, 45, 60, 97, 128, 160, 200, 245];
      const bad = [];
      for (const off of offsets) {
        const p = buildPlan(ds, { startDn: startDn + off, skipProjection: true });
        if (p.breaches.length || p.lates.length || p.shortfalls.length) {
          bad.push(fmtDY(startDn + off) + ' (' + p.breaches.length + ' breach / ' +
                   p.lates.length + ' late / ' + p.shortfalls.length + ' short)');
        }
      }
      checks.push({
        name: 'Constraints hold from any start date, including month boundaries',
        pass: bad.length === 0,
        detail: offsets.length + ' start dates swept across ' +
                fmtDY(startDn) + '–' + fmtDY(startDn + 245) + ', covering month ends, short months and ' +
                'every weekday. ' + (bad.length ? 'Failed: ' + bad.join(', ') : 'All clean.')
      });
    })();

    /* ---- 11. the long projection terminates ---- */
    (() => {
      const debts = plan.liabilities.filter(l => l.apr != null);
      const unpaid = debts.filter(l => !plan.projection.perLiability[l.id].cleared);
      checks.push({
        name: 'Every interest-bearing debt is paid off inside the projection',
        pass: unpaid.length === 0 && plan.projection.debtFreeDn !== null,
        detail: unpaid.length === 0
          ? 'Debt-free ' + fmtDY(plan.projection.debtFreeDn) + ' — ' + plan.projection.monthsToDebtFree +
            ' months, ' + money(plan.projection.totalInterest) + ' of interest along the way.'
          : 'Still open after 15 years: ' + unpaid.map(l => l.name).join(', ')
      });
    })();

    suites.push({
      persona: profile,
      checks,
      passed: checks.filter(c => c.pass).length,
      total: checks.length,
      plan
    });
  }

  suites.push(runImportTests());

  const total = suites.reduce((s, x) => s + x.total, 0);
  const passed = suites.reduce((s, x) => s + x.passed, 0);
  return { suites, total, passed, failed: total - passed, ms: Date.now() - t0 };
}


/* ============================================================================
   IMPORT TESTS — the parsers and the detector, run on every load like the rest.
   Assertions are about behaviour on realistic files, not fixed output blobs.
   ============================================================================ */

function runImportTests() {
  const checks = [];
  const add = (name, pass, detail) => checks.push({ name, pass, detail });

  const files = buildSampleFiles();
  const statements = [];
  for (const [name, text] of Object.entries(files)) {
    statements.push(...parseStatementFile(name, text));
  }

  /* ---- 1. the formats parse at all ---- */
  (() => {
    const csv = statements.filter(s => /CSV/.test(s.source));
    const ofx = statements.filter(s => /OFX/.test(s.source));
    const total = statements.reduce((s, x) => s + x.transactions.length, 0);
    add('Bank CSV and card OFX both parse into one shape',
      csv.length === 2 && ofx.length === 1 && total > 150,
      statements.length + ' statements, ' + total + ' transactions. ' +
      statements.map(s => s.accountName + ' (' + s.transactions.length + ')').join(', ') + '.');
  })();

  /* ---- 2. awkward format: day-first dates, split debit/credit, currency ---- */
  (() => {
    const s = parseStatementFile('brighton.csv', buildAwkwardCSV())[0];
    const salary = s ? s.transactions.filter(t => t.amount > 0) : [];
    const gas = s ? s.transactions.filter(t => t.amount < 0) : [];
    const day25 = salary.every(t => dparts(t.dn).d === 25);
    add('Day-first dates, split debit/credit columns and currency symbols',
      !!s && salary.length === 6 && gas.length === 6 && day25 &&
      Math.abs(salary[0].amount - 2410.55) < 0.005 && Math.abs(gas[0].amount + 88.4) < 0.005,
      s ? s.transactions.length + ' rows: ' + salary.length + ' credits at ' + money(salary[0].amount) +
        ' on the 25th, ' + gas.length + ' debits at ' + money(gas[0].amount) +
        '. Semicolon separated, £ symbols, DD/MM/YYYY — all read correctly.'
      : 'failed to parse');
  })();

  /* ---- 3. amount and date edge cases ---- */
  (() => {
    const cases = [
      ['(1,234.56)', -1234.56], ['-1234.56', -1234.56], ['1,234.56', 1234.56],
      ['$1,234.56', 1234.56], ['1234.56-', -1234.56], ['12.34 CR', 12.34],
      ['45,50', 45.50], ['1.234,56', 1234.56]
    ];
    const badAmt = cases.filter(([raw, want]) => Math.abs(parseAmount(raw) - want) > 0.005);
    const dates = [
      ['2026-03-09', 2026, 2, 9], ['03/09/2026', 2026, 2, 9], ['20260309120000[-5:EST]', 2026, 2, 9],
      ['9 Mar 2026', 2026, 2, 9], ['Mar 9, 2026', 2026, 2, 9], ['09/03/2026', 2026, 2, 9]
    ];
    const badDate = dates.filter(([raw, y, m, d], i) => {
      const dn = parseDate(raw, i === 5);   // last one is explicitly day-first
      if (dn === null) return true;
      const p = dparts(dn);
      return p.y !== y || p.m !== m || p.d !== d;
    });
    add('Amount and date formats that break naive parsers',
      badAmt.length === 0 && badDate.length === 0,
      cases.length + ' amount formats (brackets for negative, trailing minus, CR suffix, ' +
      'European decimal comma) and ' + dates.length + ' date formats all read correctly.' +
      (badAmt.length ? ' Failed: ' + badAmt.map(c => c[0]).join(', ') : '') +
      (badDate.length ? ' Bad dates: ' + badDate.map(c => c[0]).join(', ') : ''));
  })();

  const a = analyzeStatements(statements);

  /* ---- 4. recurring income, with cadence and variability ---- */
  (() => {
    const income = a.findings.filter(f => f.kind === 'income');
    const salary = income.find(f => /PAYROLL|MERIDIAN/i.test(f.label));
    const gig = income.find(f => /HALCYON/i.test(f.label));
    const ok = salary && salary.cadence === 'biweekly' && salary.confidence === 'certain' &&
      Math.abs(salary.amount - 1742.36) < 0.01 && salary.weekday === 5 &&
      gig && gig.cadence === 'monthly' && gig.confidence === 'variable' && gig.floor > 0 &&
      gig.floor < gig.amount;
    add('Recurring income found, with its cadence and how much it varies',
      !!ok,
      income.length + ' streams. ' +
      (salary ? 'Salary: ' + money(salary.amount) + ' ' + CADENCE_WORD[salary.cadence] +
        ' on a ' + WEEKDAYS[salary.weekday] + ', marked "' + salary.confidence + '". ' : 'salary missed. ') +
      (gig ? 'Freelance: ' + money(gig.amount) + ' typical, marked "' + gig.confidence +
        '", income floor ' + money(gig.floor) + ' from ' + gig.history.length + ' past deposits.' : 'gig income missed.'));
  })();

  /* ---- 5. bills separated from ordinary spending ---- */
  (() => {
    const rent = a.findings.find(f => f.kind === 'bill' && f.billKind === 'rent');
    const util = a.findings.find(f => f.kind === 'bill' && f.billKind === 'utility');
    const disc = a.findings.find(f => f.kind === 'discretionary');
    const phone = a.findings.find(f => /VERIZON/i.test(f.label));
    const phoneIsBill = phone && phone.kind === 'bill' && phone.billKind === 'utility';
    add('Fixed bills told apart from everyday spending',
      !!rent && rent.dayOfMonth === 1 && Math.abs(rent.amount - 1495) < 0.01 && !!util && !!disc && phoneIsBill,
      (rent ? 'Rent ' + money(rent.amount) + ' on day ' + rent.dayOfMonth + '. ' : 'rent missed. ') +
      (util ? 'Utility "' + util.label + '" ' + money(util.amount) + '. ' : 'utility missed. ') +
      (phone ? 'A phone bill on autopay stays a phone bill (' + phone.kind + '/' +
        (phone.billKind || phone.debtKind || '-') + '), not a credit card. ' : 'phone line missed. ') +
      (disc ? 'Whatever is left after the repeating lines: ' + money(disc.amount) + '/week across ' +
        disc.occurrences + ' one-off transactions — measured, not guessed.' : 'no discretionary total.'));
  })();

  /* ---- 6. the card statement becomes a debt, APR read from interest ---- */
  (() => {
    const card = a.findings.find(f => f.kind === 'card_account');
    const aprClose = card && card.apr !== null && Math.abs(card.apr - 0.2624) < 0.01;
    add('Card balance imported and its APR derived from interest charged',
      !!card && Math.abs(card.balance - 9846.20) < 0.01 && aprClose && card.statementCloseDay === 26,
      card ? 'Balance ' + money(card.balance) + ' owed, statement closes day ' + card.statementCloseDay +
        ', APR worked back to ' + pct1(card.apr) + ' from the monthly interest line (true rate 26.24%). ' +
        'Credit limit is the one thing no export contains, so it is asked for.'
        : 'card statement not recognised');
  })();

  /* ---- 7. internal transfers are not counted as income or spending ---- */
  (() => {
    const disc = a.findings.find(f => f.kind === 'discretionary');
    const sawTransferAsIncome = a.findings.some(f => f.kind === 'income' && /TRANSFER/i.test(f.label));
    add('Money moved between your own accounts is not double counted',
      a.transfersExcluded >= 10 && !sawTransferAsIncome,
      a.transfersExcluded + ' transactions matched as internal transfers and excluded from both ' +
      'income and spending. Card payments out of checking are excluded from spending too, because ' +
      'the card purchases themselves already are the spending.');
  })();

  /* ---- 8. debts visible only as payments are flagged, not invented ---- */
  (() => {
    const auto = a.findings.find(f => f.kind === 'debt' && f.debtKind === 'auto_loan');
    const dupCard = a.findings.filter(f => f.kind === 'debt' && f.debtKind === 'credit_card');
    const needs = outstandingNeeds({ findings: a.findings });
    add('What the data cannot show is asked for, not made up',
      !!auto && auto.needs.indexOf('balance') >= 0 && auto.needs.indexOf('apr') >= 0 && needs.length > 0,
      (auto ? 'Auto loan seen only as ' + money(auto.amount) + ' leaving on day ' + auto.dayOfMonth +
        ' — payment and date known, balance and APR are not, so both are requested. ' : 'auto loan missed. ') +
      needs.length + ' items need a figure: ' + needs.map(n => n.label + ' (' + n.needs.join(', ') + ')').join('; ') + '. ' +
      (dupCard.length ? 'Note: ' + dupCard.length + ' card payment(s) not matched to an imported statement.'
        : 'The Chase card payment was matched to its statement, so it is counted once.'));
  })();

  /* ---- 9. the derived profile actually builds a plan ---- */
  (() => {
    let plan = null, err = '';
    const prof = profileFromAnalysis(a);
    try { plan = buildPlan(makeDataSource(prof), { startDn: todayDn(), skipProjection: true }); }
    catch (e) { err = e.message; }
    const v = validateProfile(makeDataSource(prof).raw);
    add('The imported profile builds a working plan end to end',
      !!plan && plan.payments.length > 0 && plan.breaches.length === 0 && plan.lates.length === 0 &&
      prof.settings.bufferFloor >= 300,
      plan ? prof.accounts.length + ' accounts, ' + prof.liabilities.length + ' debts and bills, ' +
        prof.incomeStreams.length + ' income streams, ' + prof.expenses.length + ' spending lines — ' +
        'all derived. Plan: ' + plan.payments.length + ' payments, ' + plan.breaches.length + ' breaches, ' +
        plan.lates.length + ' late. Buffer floor set to ' + money0(prof.settings.bufferFloor) +
        ' — half a month of the everyday spending actually observed. ' + v.errors.length + ' blocking issue(s).'
      : 'plan failed: ' + err);
  })();

  /* ---- 10. nothing is silently invented ---- */
  (() => {
    const prof = profileFromAnalysis(a);
    const typed = prof.liabilities.filter(l => l.balance === 0 && l.kind !== 'rent' && l.kind !== 'utility');
    const noLimit = prof.liabilities.filter(l => l.kind === 'credit_card' && !l.creditLimit);
    add('Unknown figures stay visibly unknown',
      typed.every(l => l.balance === 0) && noLimit.length >= 1,
      typed.length + ' debt(s) carry a zero balance because the statements never showed one, and ' +
      noLimit.length + ' card(s) have no credit limit. They are left blank and listed as outstanding ' +
      'rather than filled with a plausible-looking guess.');
  })();

  return {
    persona: { id: 'import', name: 'Statement import', tagline: 'parsing and inference' },
    checks, passed: checks.filter(c => c.pass).length, total: checks.length
  };
}


/* ============================================================================
   UI. Four views, in the order they matter: this week, timeline, debts,
   what-if — plus the test panel, which is always one click away and shouts
   from the top bar when anything is red.
   ============================================================================ */

const state = {
  profileId: 'mine',      // 'mine' | a demo persona id
  view: 'week',
  whatif: null,
  testResults: null,
  myProfile: null,        // raw, editable, persisted
  rev: 0,                 // bumped on every edit to bust the plan cache
  saveFailed: false,
  toast: null,
  importResult: null,
  importError: null
};

const isMine = () => state.profileId === 'mine';
/* "Set up" is an explicit act, not something inferred from whether data
   happens to exist — otherwise choosing to start from an empty plan bounces
   you straight back to the screen you just left. */
const hasOwnData = () => !!state.myProfile && (
  !!state.myProfile.profile.startedAt ||
  state.myProfile.liabilities.length > 0 || state.myProfile.accounts.length > 1 ||
  (state.myProfile.accounts[0] && state.myProfile.accounts[0].balance > 0));

function activeDataSource() {
  return isMine() ? makeDataSource(state.myProfile) : MockDataSource(state.profileId);
}

const planCache = new Map();
function planFor(overrides) {
  const key = state.profileId + '|' + state.rev + '|' + JSON.stringify(overrides || {});
  if (!planCache.has(key)) planCache.set(key, buildPlan(activeDataSource(), overrides || {}));
  return planCache.get(key);
}
const START_DN = todayDn();

/** Never let a bad profile take the whole page down — show it instead. */
function currentPlan() {
  try { return planFor({ startDn: START_DN }); }
  catch (e) { return { __error: e.message || String(e) }; }
}

function commit(touchBalances) {
  if (touchBalances) state.myProfile.profile.balancesAsOf = new Date().toISOString();
  state.rev++;
  planCache.clear();
  state.saveFailed = !saveProfile(state.myProfile);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
const nameOf = (plan, id) => (plan.accounts.find(a => a.id === id) || {}).name || id;
/* With a single checking account, stamping its name on every row is noise. */
const multiAccount = plan => plan.accounts.filter(a => a.type === 'checking').length > 1;
const acctChip = (plan, id) => multiAccount(plan) ? '<span class="chip">' + esc(nameOf(plan, id)) + '</span>' : '';

const KIND_LABEL = {
  credit_card: 'credit card', auto_loan: 'auto loan', student_loan: 'student loan',
  mortgage: 'mortgage', personal_loan: 'personal loan', rent: 'rent', utility: 'utility'
};

/* ------------------------------------------------------------------ chrome */

function renderChrome() {
  const t = state.testResults;
  const bad = t && t.failed > 0;
  document.getElementById('banner').className = 'banner' + (bad ? ' bad' : '');
  document.getElementById('banner').innerHTML = bad
    ? '<span>' + t.failed + ' of ' + t.total + ' engine checks are failing. The plan below should not be trusted until they are green.</span>' +
      '<button data-view="tests">Open the test panel</button>'
    : '<span>' + (t ? t.passed + ' of ' + t.total + ' engine checks pass across all three personas' : 'running checks…') + '</span>' +
      '<button data-view="tests">See what they cover</button>';

  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === state.view)));
  document.querySelectorAll('.person').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.profile === state.profileId)));
  const mineLabel = document.getElementById('mineLabel');
  if (mineLabel) mineLabel.textContent = hasOwnData()
    ? ((state.myProfile.profile.name || '').trim() || 'My plan') : 'My plan — not set up yet';

  const plan = currentPlan();
  const note = document.getElementById('railNote');
  if (plan.__error) { note.innerHTML = 'No plan yet. Open <b>Your money</b> to set one up.'; return; }
  const floors = Object.keys(plan.incomeFloors);
  const stale = staleDays();
  note.innerHTML =
    'Plan built ' + esc(fmtDY(plan.startDn)) + ' over ' + plan.horizonDays + ' days.<br>' +
    'Buffer floor <code>' + esc(money0(plan.settings.bufferFloor)) + '</code> across checking.<br>' +
    (floors.length
      ? 'Variable income committed at the 25th percentile of your deposit history.'
      : 'All income is fixed and dated.') +
    (stale !== null && stale > 7
      ? '<br><br>Balances last updated ' + stale + ' days ago. They drift — refresh them under Your money.'
      : '');
}

/** How long since the balances were touched, or null if unknown/not yours. */
function staleDays() {
  if (!isMine() || !state.myProfile || !state.myProfile.profile.balancesAsOf) return null;
  const then = new Date(state.myProfile.profile.balancesAsOf);
  if (isNaN(then.getTime())) return null;
  return Math.floor((Date.now() - then.getTime()) / 86400000);
}

/* -------------------------------------------------------------- components */

function chip(text, tone) { return '<span class="chip ' + (tone || '') + '">' + esc(text) + '</span>'; }

function paymentRow(plan, p) {
  let cls = 'row', chips = '';
  if (p.type === 'statement_close') { cls += ' util'; chips = chip('utilization move', 'slate'); }
  else if (p.type === 'extra')      { cls += ' move';  chips = chip('extra', 'teal'); }
  else if (p.type === 'sweep')      { cls += ' cond';  chips = chip('only if income allows'); }
  else if (p.type === 'transfer')   {
    cls += ' muted';
    chips = chip(p.tags.includes('savings_draw') ? 'from savings'
              : p.tags.includes('restore') ? 'back to savings' : 'between accounts');
  } else {
    const l = plan.liabilities.find(x => x.id === p.liabilityId);
    chips = chip(l && l.autopayEnabled ? 'autopay' : 'minimum');
  }
  const where = p.type === 'transfer'
    ? '<span class="chip">' + esc(nameOf(plan, p.fromAccountId) + ' \u2192 ' + nameOf(plan, p.toAccountId)) + '</span>'
    : acctChip(plan, p.fromAccountId);
  return '<div class="' + cls + '">' +
    '<div class="what"><b>' + esc(p.label) + '</b>' + chips + where + '</div>' +
    '<div class="amt num">' + (p.type === 'transfer' ? '' : '−') + esc(money(p.amount)) + '</div>' +
    '<div class="why">' + esc(p.reason) + '</div>' +
  '</div>';
}

function incomeRow(plan, ev) {
  const conf = ev.confidence === 'variable'
    ? chip('planned at ' + money0(ev.planAmount), 'slate') : chip('expected', 'teal');
  return '<div class="row"><div class="what"><b>' + esc(ev.label.replace(/^the /, '')) + '</b>' +
    conf + acctChip(plan, ev.accountId) + '</div>' +
    '<div class="amt num">+' + esc(money(ev.amount)) + '</div>' +
    (ev.confidence === 'variable'
      ? '<div class="why">The plan only commits ' + esc(money(ev.planAmount)) +
        ' of this. Anything above that gets swept at the target debt instead of quietly absorbed.</div>' : '') +
  '</div>';
}

function expenseRow(plan, ex) {
  return '<div class="row muted"><div class="what"><b>' + esc(ex.label) + '</b>' +
    chip('spending') + acctChip(plan, ex.accountId) + '</div>' +
    '<div class="amt num">−' + esc(money(ex.amount)) + '</div></div>';
}

/* ============================================================= 1. this week */

function viewWeek(plan) {
  const start = plan.startDn, end = start + 7;
  const inRange = d => d >= start && d < end;
  const pays = plan.payments.filter(p => inRange(p.dn));
  const sweeps = plan.sweeps.filter(p => inRange(p.dn));
  const income = plan.incomeEvents.filter(e => inRange(e.dn));
  const spend = plan.expenseEvents.filter(e => inRange(e.dn));
  const balAt = d => plan.series.total[plan.series.dn.indexOf(d)];

  const out = r2(pays.filter(p => p.type !== 'transfer').reduce((s, p) => s + p.amount, 0));
  const week = plan.series.total.slice(0, 7);
  const lowIdx = week.indexOf(Math.min(...week));
  const headroom = r2(week[lowIdx] - plan.settings.bufferFloor);

  let summary;
  if (!pays.length && !sweeps.length) {
    summary = 'Nothing is scheduled to leave in the next seven days. The next payment is ' +
      (plan.payments.length ? esc(plan.payments[0].label) + ' on ' + fmtD(plan.payments[0].dn) : 'outside this horizon') + '.';
  } else {
    const nPay = pays.filter(p => p.type !== 'transfer').length;
    summary = nPay + ' payment' + (nPay === 1 ? '' : 's') + ' totalling ' + money(out) +
      (nPay === 1 ? ' leaves' : ' leave') + ' between ' + fmtDW(start) + ' and ' + fmtDW(end - 1) +
      '. Your thinnest day is ' +
      fmtDW(plan.series.dn[lowIdx]) + ' at ' + money(week[lowIdx]) + ' — ' + money(headroom) +
      ' above the floor you set.';
  }

  let rows = '';
  let any = false;
  for (let d = start; d < end; d++) {
    const dayPays = pays.filter(p => p.dn === d);
    const daySweeps = sweeps.filter(p => p.dn === d);
    const dayIn = income.filter(e => e.dn === d);
    const daySpend = spend.filter(e => e.dn === d);
    if (!dayPays.length && !dayIn.length && !daySpend.length && !daySweeps.length) continue;
    any = true;
    rows += '<div class="day-head"><b>' + esc(fmtDW(d)) + '</b>' +
      (d === start ? '<span>today</span>' : '') +
      '<span class="bal num">' + (multiAccount(plan) ? 'all checking closes at ' : 'closes at ') +
      esc(money(balAt(d))) + '</span></div>';
    dayIn.forEach(e => rows += incomeRow(plan, e));
    dayPays.forEach(p => rows += paymentRow(plan, p));
    daySweeps.forEach(p => rows += paymentRow(plan, p));
