         { accent: st.paused ? COLORS.green : COLORS.panelEdge, size: 17 });
  x += wPlay + gap;

  [1, 2, 4].forEach(function (sp) {
    button(x, by, wSpeed, bh, sp + "×", "speed",
           { active: st.speed === sp && !st.paused,
             accent: st.speed === sp ? COLORS.amber : COLORS.panelEdge,
             color: st.speed === sp ? COLORS.amber : COLORS.dim,
             data: sp, size: 14 });
    x += wSpeed + gap;
  });

  // Reserve crews left: the resource the player is always deciding whether to
  // spend, so it lives permanently in the chrome.
  var resX = x + 4;
  var resW = L.W - L.pad - wMute - gap - resX;
  if (resW > 40) {
    text("RESERVE", resX, by + bh * 0.42, Math.round(L.font * 0.55), COLORS.dim, "700");
    for (var i = 0; i < CFG.RESERVES_PER_DAY; i++) {
      ctx.fillStyle = i < st.reservesLeft ? COLORS.green : COLORS.dimmer;
      ctx.fillRect(resX + i * 13, by + bh * 0.55, 9, 9);
    }
  }

  button(L.W - L.pad - wMute, by, wMute, bh, muted ? "✕" : "♪", "mute",
         { color: muted ? COLORS.dimmer : COLORS.head, size: 16 });
}

// --- Flight sheet ------------------------------------------------------------

function drawFlightSheet(nowMs) {
  var st = state;
  var f = flightById(st, selectedFlight);
  if (!f) { selectedFlight = null; return; }

  var sh = Math.min(L.H * 0.68, L.H - L.safeTop - 60);
  var y0 = L.H - sh;
  var actionsH = 124;

  ctx.fillStyle = "rgba(4,6,9,0.62)";
  ctx.fillRect(0, 0, L.W, L.H);
  hit(0, 0, L.W, y0, "closesheet");

  ctx.fillStyle = COLORS.panel;
  ctx.fillRect(0, y0, L.W, sh);
  ctx.fillStyle = COLORS.panelEdge;
  ctx.fillRect(0, y0, L.W, 1);

  // Grab handle.
  ctx.fillStyle = COLORS.dimmer;
  rrect(L.W / 2 - 18, y0 + 8, 36, 4, 2); ctx.fill();

  var pad = L.pad;
  var contentTop = y0 + 22;
  var contentBottom = L.H - L.safeBottom - actionsH;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, contentTop, L.W, contentBottom - contentTop);
  ctx.clip();

  var y = contentTop - sheetScroll + 8;
  var fs = L.font;

  if (sheetMode === "swap") {
    y = drawSwapPicker(f, y, fs, pad);
  } else {
    y = drawFlightDetail(f, y, fs, pad, nowMs);
  }

  sheetScrollMax = Math.max(0, (y + sheetScroll) - contentBottom + 16);
  sheetScroll = clamp(sheetScroll, 0, sheetScrollMax);
  ctx.restore();

  drawSheetActions(f, contentBottom, actionsH);
}

// The value is the thing worth reading, so it is laid out first and the label
// is clipped to whatever room is left rather than being drawn over.
function sheetRow(label, value, y, fs, pad, color) {
  var vSize = Math.round(fs * 0.72);
  var lSize = Math.round(fs * 0.68);
  ctx.font = "700 " + vSize + "px " + MONO;
  var vw = ctx.measureText(value).width;
  var room = L.W - pad * 2 - vw - 10;
  ctx.font = "500 " + lSize + "px " + MONO;
  var lw = ctx.measureText("M").width;
  var maxChars = Math.max(2, Math.floor(room / lw));
  text(label.length > maxChars ? label.slice(0, maxChars) : label, pad, y, lSize, COLORS.dim, "500");
  text(value, L.W - pad, y, vSize, color || COLORS.bone, "700", "right");
  return y + fs * 1.35;
}

function drawFlightDetail(f, y, fs, pad, nowMs) {
  var st = state;
  var ac = aircraftByTail(st, f.aircraft);
  var cr = crewById(st, f.crew);

  text(f.id, pad, y + fs, Math.round(fs * 1.2), COLORS.bone, "700");
  text(f.from + " → " + f.to, pad, y + fs * 2.05, Math.round(fs * 0.85), COLORS.head, "700");
  text(statusTextFor(f), L.W - pad, y + fs, Math.round(fs * 0.85), statusColorFor(f), "700", "right");
  y += fs * 2.9;

  y = sheetRow("SCHEDULED", hhmmColon(f.schedDep) + " – " + hhmmColon(f.schedArr), y, fs, pad);
  var expDep = f.actualDep !== null ? f.actualDep : f.plannedDep;
  var expArr = f.actualArr !== null ? f.actualArr : f.plannedArr;
  y = sheetRow(f.status === "arrived" ? "ACTUAL" : "EXPECTED",
               hhmmColon(expDep) + " – " + hhmmColon(expArr), y, fs, pad,
               f.delayMins >= CFG.ONTIME_THRESHOLD_MINS ? COLORS.amber : COLORS.bone);
  if (f.delayMins > 0) {
    y = sheetRow("DELAY", f.delayMins + "M · " + String(f.delayReason || "knock-on").toUpperCase(),
                 y, fs, pad, COLORS.amber);
  }
  y = sheetRow("A/C", ac ? (ac.tail + "  REL " + Math.round(ac.reliability * 100) + "%") : "—", y, fs, pad,
               ac && ac.reliability < 0.85 ? COLORS.amber : COLORS.bone);
  var connecting = connectingPaxOn(st, f);
  y = sheetRow("PAX", f.paxCount + "/" + f.seats +
               (connecting > 0 ? "  ·  " + connecting + " CONNECTING" : ""), y, fs, pad);

  // --- Crew duty clock ---
  y += fs * 0.4;
  text("CREW " + (cr ? cr.id : "—"), pad, y, Math.round(fs * 0.68), COLORS.dim, "700");
  if (cr) {
    var used = st.clock - cr.reportTime;
    var frac = clamp(used / cr.dutyLimit, 0, 1);
    var outAt = cr.reportTime + cr.dutyLimit;
    var col = f.crewBlocked ? COLORS.red : (frac > 0.85 ? COLORS.amber : COLORS.green);
    text("OUT OF HOURS " + hhmmColon(outAt), L.W - pad, y, Math.round(fs * 0.68), col, "700", "right");
    y += fs * 0.55;
    ctx.fillStyle = COLORS.rule;
    ctx.fillRect(pad, y, L.W - pad * 2, 6);
    ctx.fillStyle = col;
    ctx.fillRect(pad, y, (L.W - pad * 2) * frac, 6);
    y += fs * 1.1;
    if (f.crewBlocked) {
      text("CANNOT DEPART — " + String(f.crewBlockReason || "").toUpperCase(),
           pad, y, Math.round(fs * 0.62), COLORS.red, "700");
      y += fs * 1.1;
    }
  } else { y += fs * 1.1; }

  // --- The tail's remaining day, with the ground time between each leg ---
  //
  // This is the slack made visible. A 30-minute turn is where a cascade
  // survives; a 70-minute turn is where it dies. The player cannot make that
  // judgement without seeing these numbers, so they live here.
  y += fs * 0.5;
  text("TAIL " + f.aircraft + " TODAY", pad, y, Math.round(fs * 0.68), COLORS.dim, "700");
  y += fs * 1.1;

  var chain = tailFlights(state, f.aircraft);
  for (var i = 0; i < chain.length; i++) {
    var g = chain[i];
    var isThis = g.id === f.id;
    var dim = (g.status === "arrived" || g.status === "cancelled") ? 0.45 : 1;

    if (i > 0) {
      var prev = chain[i - 1];
      var prevArr = prev.actualArr !== null ? prev.actualArr : prev.plannedArr;
      var thisDep = g.actualDep !== null ? g.actualDep : g.plannedDep;
      var ground = Math.round(thisDep - prevArr);
      var tight = ground < 45;
      ctx.globalAlpha = dim;
      text("│  " + (ground >= 0 ? ground + "M ON GROUND" : "OVERLAP"),
           pad + L.charW * 1.5, y, Math.round(fs * 0.6),
           g.status === "cancelled" ? COLORS.dimmer : (tight ? COLORS.red : (ground < 60 ? COLORS.amber : COLORS.green)),
           "700");
      ctx.globalAlpha = 1;
      y += fs * 0.95;
    }

    ctx.globalAlpha = dim;
    if (isThis) {
      ctx.fillStyle = "#182130";
      ctx.fillRect(pad - 6, y - fs * 0.85, L.W - pad * 2 + 12, fs * 1.25);
    }
    text(g.id, pad, y, Math.round(fs * 0.7), isThis ? COLORS.bone : COLORS.dim, "700");
    text(g.from + "-" + g.to, pad + L.charW * 5.6, y, Math.round(fs * 0.7), COLORS.dim, "500");
    text(hhmmColon(g.actualDep !== null ? g.actualDep : g.plannedDep) + "  " + statusTextFor(g),
         L.W - pad, y, Math.round(fs * 0.7), statusColorFor(g), "700", "right");
    ctx.globalAlpha = 1;
    y += fs * 1.25;
  }

  return y + fs;
}

function connectingPaxOn(st, f) {
  var n = 0;
  st.passengers.forEach(function (p) {
    if (p.itinerary.length < 2) return;
    if (p.itinerary[p.leg] === f.id) n += p.size;
  });
  return n;
}

function drawSwapPicker(f, y, fs, pad) {
  var cands = swapCandidates(state, f);
  text("SWAP TAIL AT " + f.from, pad, y + fs, Math.round(fs * 1.0), COLORS.bone, "700");
  y += fs * 1.9;
  text("Both aircraft must be on the same apron. The donor takes this trip and",
       pad, y, Math.round(fs * 0.6), COLORS.dim, "500");
  y += fs * 0.9;
  text("everything behind it; " + f.aircraft + " inherits the donor's remaining day.",
       pad, y, Math.round(fs * 0.6), COLORS.dim, "500");
  y += fs * 1.6;

  if (!cands.length) {
    text("NO HEALTHY AIRCRAFT AT " + f.from + ".", pad, y + fs, Math.round(fs * 0.8), COLORS.red, "700");
    return y + fs * 3;
  }

  cands.forEach(function (d) {
    var remaining = state.flights.filter(function (g) {
      return g.aircraft === d.tail && notStarted(g);
    }).length;
    var h = fs * 2.6;
    ctx.fillStyle = "#161d28";
    rrect(pad, y, L.W - pad * 2, h, 8); ctx.fill();
    text(d.tail, pad + 12, y + h * 0.44, Math.round(fs * 0.85), COLORS.bone, "700");
    text("REL " + Math.round(d.reliability * 100) + "%  ·  " + remaining + " TRIPS LEFT",
         pad + 12, y + h * 0.82, Math.round(fs * 0.6), COLORS.dim, "500");
    text("SWAP", L.W - pad - 12, y + h * 0.62, Math.round(fs * 0.75), COLORS.amber, "700", "right");
    hit(pad, y, L.W - pad * 2, h, "doswap", d.tail);
    y += h + 8;
  });
  return y;
}

function drawSheetActions(f, top, h) {
  var pad = L.pad;
  ctx.fillStyle = COLORS.panel;
  ctx.fillRect(0, top, L.W, L.H - top);
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(pad, top, L.W - pad * 2, 1);

  var by = top + 12;
  var gap = 8;

  if (sheetMode === "swap") {
    button(pad, by, L.W - pad * 2, 46, "BACK", "sheetback", {});
    return;
  }

  var live = notStarted(f);
  var w2 = (L.W - pad * 2 - gap) / 2;

  button(pad, by, w2, 46, "SWAP TAIL", "swapmode",
         { enabled: live && swapCandidates(state, f).length > 0, size: 13 });
  button(pad + w2 + gap, by, w2, 46, "HOLD 30M", "hold",
         { enabled: live, size: 13 });

  by += 46 + gap;
  var canReserve = live && state.reservesLeft > 0;
  button(pad, by, w2, 46, "RESERVE CREW", "reserve",
         { enabled: canReserve, size: 12,
           accent: f.crewBlocked && canReserve ? COLORS.green : COLORS.panelEdge,
           color: f.crewBlocked && canReserve ? COLORS.green : COLORS.bone });
  button(pad + w2 + gap, by, w2, 46, "CANCEL FLIGHT", "cancel",
         { enabled: live, size: 12, color: COLORS.red, accent: "#3a1d1c" });
}

// --- The wire report ---------------------------------------------------------
//
// End of day. Cream paper on a dark game: the contrast is the beat that ends
// the shift, and it is what the screenshot is of.

function drawReport(nowMs) {
  var st = state;
  var rep = st.lastReport;
  if (!rep) return;

  ctx.fillStyle = COLORS.paper;
  ctx.fillRect(0, 0, L.W, L.H);

  var pad = Math.round(L.W * 0.075);
  var btnH = 54;
  var bottom = L.H - L.safeBottom - btnH - 16;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, L.W, bottom);
  ctx.clip();

  var y = L.safeTop + 26 - reportScroll;
  var fs = L.font;
  var ink = COLORS.ink;
  var faint = "#6b665c";

  // Masthead
  var w = tracked("THE DAILY DEPARTURE", pad, y, Math.round(fs * 0.72), ink, "700", 2.4);
  y += 10;
  ctx.fillStyle = ink; ctx.fillRect(pad, y, L.W - pad * 2, 2);
  y += 4;
  ctx.fillRect(pad, y, L.W - pad * 2, 1);
  y += fs * 1.3;
  text("DAY " + padLeft(rep.day, 2) + " OF " + CFG.SEASON_DAYS, pad, y, Math.round(fs * 0.62), faint, "700");
  text("GROUND STOP AIRWAYS", L.W - pad, y, Math.round(fs * 0.62), faint, "700", "right");
  y += 8;
  ctx.fillStyle = "#c8c2b2"; ctx.fillRect(pad, y, L.W - pad * 2, 1);
  y += fs * 1.9;

  // Headline — yesterday's, because reputation runs a day behind.
  if (rep.press) {
    y = wrapText(rep.press.headline, pad, y, L.W - pad * 2, Math.round(fs * 1.25), ink, "700", 1.15);
    y += fs * 0.5;
    text("REPUTATION " + (rep.press.delta >= 0 ? "+" : "") + rep.press.delta +
         "  →  " + Math.round(rep.reputation),
         pad, y, Math.round(fs * 0.72),
         rep.press.delta >= 0 ? "#1d6b3a" : "#8c2b23", "700");
    y += fs * 1.2;
    rep.press.lines.forEach(function (ln) {
      text("· " + ln[0], pad, y, Math.round(fs * 0.6), faint, "500");
      text(ln[1], L.W - pad, y, Math.round(fs * 0.6), faint, "700", "right");
      y += fs * 0.92;
    });
    y += fs * 0.5;
    y = wrapText("(reporting on day " + rep.press.day + " — the press is always a day behind)",
                 pad, y, L.W - pad * 2, Math.round(fs * 0.55), "#9a9386", "500", 1.25);
    y += fs * 1.1;
  } else {
    y = wrapText("NO COVERAGE YET", pad, y, L.W - pad * 2, Math.round(fs * 1.25), ink, "700", 1.15);
    y += fs * 0.4;
    y = wrapText("Reputation is judged a day late. Tomorrow they write about today.",
                 pad, y, L.W - pad * 2, Math.round(fs * 0.58), faint, "500", 1.3);
    y += fs * 1.1;
  }

  ctx.fillStyle = "#c8c2b2"; ctx.fillRect(pad, y - fs * 0.8, L.W - pad * 2, 1);

  // Today's operation
  y = paperHead("TODAY'S OPERATION", pad, y, fs, ink);
  var s = rep.stats;
  y = paperRow("ON TIME", Math.round(s.otp * 100) + "%", y, fs, pad, ink,
               s.otp >= 0.85 ? "#1d6b3a" : (s.otp >= 0.7 ? "#8a6a1c" : "#8c2b23"));
  y = paperRow("COMPLETED", s.operated + " OF " + (s.operated + s.cancelled), y, fs, pad, ink);
  y = paperRow("CANCELLED", String(s.cancelled), y, fs, pad, ink, s.cancelled ? "#8c2b23" : null);
  y = paperRow("PASSENGERS FLOWN", String(s.paxCarried), y, fs, pad, ink);
  if (s.misconnected) y = paperRow("MISCONNECTED", String(s.misconnected), y, fs, pad, ink, "#8a6a1c");
  if (s.stranded) y = paperRow("STRANDED OVERNIGHT", String(s.stranded), y, fs, pad, ink, "#8c2b23");
  if (s.delayed) y = paperRow("AVERAGE DELAY", Math.round(s.avgDelay) + "M", y, fs, pad, ink);
  y += fs * 0.6;

  // The books
  y = paperHead("THE BOOKS", pad, y, fs, ink);
  var c = rep.cash;
  y = paperRow("TICKET REVENUE", money(c.revenue), y, fs, pad, ink, "#1d6b3a");
  y = paperRow("FUEL + LANDING", money(-c.fuel), y, fs, pad, ink);
  y = paperRow("CREW", money(-c.crew), y, fs, pad, ink);
  y = paperRow("GATES + LEASES", money(-(c.gates + c.lease)), y, fs, pad, ink);
  if (c.delay) y = paperRow("DELAY COSTS", money(-c.delay), y, fs, pad, ink, "#8c2b23");
  if (c.rebook) y = paperRow("REBOOKING", money(-c.rebook), y, fs, pad, ink, "#8c2b23");
  if (c.strand) y = paperRow("HOTELS", money(-c.strand), y, fs, pad, ink, "#8c2b23");
  if (c.reserves) y = paperRow("RESERVE CREWS", money(-c.reserves), y, fs, pad, ink);
  if (c.maintenance) y = paperRow("MAINTENANCE", money(-c.maintenance), y, fs, pad, ink);
  ctx.fillStyle = "#c8c2b2"; ctx.fillRect(pad, y - fs * 0.7, L.W - pad * 2, 1);
  y += fs * 0.3;
  y = paperRow("NET", money(c.net), y, fs * 1.12, pad, ink, c.net >= 0 ? "#1d6b3a" : "#8c2b23");
  y = paperRow("BALANCE", money(rep.balance), y, fs * 1.12, pad, ink,
               rep.balance < 0 ? "#8c2b23" : ink);
  y += fs * 0.8;

  // The line players argue with.
  y = paperHead("WORST OF THE DAY", pad, y, fs, ink);
  y = wrapText(rep.worst, pad, y, L.W - pad * 2, Math.round(fs * 0.72), "#8c2b23", "700", 1.2);
  y += fs * 1.2;

  // Tomorrow, which is the only reason the forecast exists.
  var bad = st.airports.filter(function (a) { return a.forecastDelayMins > 0; })
                       .sort(function (a, b) { return b.forecastDelayMins - a.forecastDelayMins; });
  y = paperHead("TOMORROW", pad, y, fs, ink);
  if (!bad.length) {
    text("Clear across the network.", pad, y, Math.round(fs * 0.68), faint, "500");
    y += fs * 1.3;
  } else {
    bad.slice(0, 4).forEach(function (a) {
      text(a.code + "  " + WEATHER[a.forecast].label, pad, y, Math.round(fs * 0.68),
           a.forecast === "storm" ? "#8c2b23" : "#8a6a1c", "700");
      text(hhmmColon(a.fcFrom) + "–" + hhmmColon(a.fcUntil) + "  +" + a.forecastDelayMins + "M",
           L.W - pad, y, Math.round(fs * 0.6), faint, "500", "right");
      y += fs * 1.05;
    });
  }
  y += fs * 1.2;

  reportScrollMax = Math.max(0, (y + reportScroll) - bottom + 20);
  reportScroll = clamp(reportScroll, 0, reportScrollMax);
  ctx.restore();

  if (reportScroll < reportScrollMax - 2) {
    var g = ctx.createLinearGradient(0, bottom - 30, 0, bottom);
    g.addColorStop(0, "rgba(232,226,212,0)");
    g.addColorStop(1, "rgba(232,226,212,1)");
    ctx.fillStyle = g;
    ctx.fillRect(0, bottom - 30, L.W, 30);
  }

  var due = maintenanceDueList(st).length;
  button(pad, L.H - L.safeBottom - btnH - 8, L.W - pad * 2, btnH,
         due > 0 ? "MAINTENANCE — " + due + " DUE" : "BEGIN DAY " + (st.day + 1),
         "closereport",
         { fill: COLORS.ink, stroke: COLORS.ink, color: COLORS.paper, size: 15 });
}

function paperHead(label, pad, y, fs, ink) {
  tracked(label, pad, y, Math.round(fs * 0.6), ink, "700", 2);
  y += 6;
  ctx.fillStyle = "#c8c2b2";
  ctx.fillRect(pad, y, L.W - pad * 2, 1);
  return y + fs * 1.25;
}

function paperRow(label, value, y, fs, pad, ink, valueColor) {
  text(label, pad, y, Math.round(fs * 0.66), "#57534b", "500");
  text(value, L.W - pad, y, Math.round(fs * 0.72), valueColor || ink, "700", "right");
  return y + fs * 1.12;
}

function wrapText(s, x, y, maxW, size, color, weight, lineMul) {
  ctx.font = (weight || "700") + " " + size + "px " + MONO;
  var words = String(s).split(" ");
  var line = "";
  var lh = size * (lineMul || 1.2);
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      text(line, x, y, size, color, weight);
      y += lh;
      line = words[i];
    } else line = test;
  }
  if (line) { text(line, x, y, size, color, weight); y += lh; }
  return y;
}

// --- Maintenance -------------------------------------------------------------
//
// The only decision in the game that is explicitly a loan. Authorise and pay
// now; defer and pay later, at a time you will not choose.

function drawMaintenance(nowMs) {
  var st = state;
  var due = maintenanceDueList(st).filter(function (ac) { return !ac.decided; });
  if (!due.length) { advanceDay(st); return; }

  // Opaque, not a wash: this is a decision screen and the board behind it was
  // reading straight through the panel.
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, L.W, L.H);

  var pad = L.pad;
  var fs = L.font;
  var y = L.safeTop + fs * 2.6;

  tracked("MAINTENANCE", pad, y, Math.round(fs * 0.72), COLORS.amber, "700", 3);
  y += fs * 2.0;
  y = wrapText("A check has come due. The hours are real — the aeroplane has flown them.",
               pad, y, L.W - pad * 2, Math.round(fs * 0.64), COLORS.dim, "500", 1.3);
  y += fs * 1.2;

  var ac = due[0];
  ctx.fillStyle = COLORS.panel;
  rrect(pad, y, L.W - pad * 2, fs * 8.6, 10); ctx.fill();
  ctx.strokeStyle = COLORS.panelEdge; ctx.lineWidth = 1; ctx.stroke();

  var iy = y + fs * 1.6;
  text(ac.tail, pad + 16, iy, Math.round(fs * 1.2), COLORS.bone, "700");
  text(Math.round(ac.hoursSinceCheck) + " / " + Math.round(ac.maintenanceDue) + " HRS",
       L.W - pad - 16, iy, Math.round(fs * 0.75), COLORS.amber, "700", "right");
  iy += fs * 1.5;

  var relCol = ac.reliability >= 0.9 ? COLORS.green : (ac.reliability >= 0.75 ? COLORS.amber : COLORS.red);
  text("RELIABILITY", pad + 16, iy, Math.round(fs * 0.62), COLORS.dim, "500");
  text(Math.round(ac.reliability * 100) + "%", L.W - pad - 16, iy, Math.round(fs * 0.72), relCol, "700", "right");
  iy += fs * 0.6;
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(pad + 16, iy, L.W - pad * 2 - 32, 6);
  ctx.fillStyle = relCol;
  ctx.fillRect(pad + 16, iy, (L.W - pad * 2 - 32) * ac.reliability, 6);
  iy += fs * 1.5;

  text("PREVIOUS DEFERRALS", pad + 16, iy, Math.round(fs * 0.62), COLORS.dim, "500");
  text(String(ac.deferredCount), L.W - pad - 16, iy, Math.round(fs * 0.72),
       ac.deferredCount > 0 ? COLORS.red : COLORS.bone, "700", "right");
  iy += fs * 1.35;

  var breakdownPct = (CFG.MECH_BASE + CFG.MECH_PER_UNRELIABILITY * (1 - ac.reliability)) * 100;
  text("FAILURE CHANCE PER DEPARTURE", pad + 16, iy, Math.round(fs * 0.62), COLORS.dim, "500");
  text(breakdownPct.toFixed(1) + "%", L.W - pad - 16, iy, Math.round(fs * 0.72), relCol, "700", "right");

  y += fs * 9.4;

  var by = y;
  by = button(pad, by, L.W - pad * 2, 56,
              "AUTHORISE CHECK — " + money(CFG.MAINTENANCE_CHECK), "authorize",
              { accent: COLORS.green, color: COLORS.green, size: 14 }) + 8;
  by = wrapText("Out of service tomorrow. Its four trips do not fly, and you pay the lease anyway.",
                pad + 4, by + fs * 0.7, L.W - pad * 2 - 8, Math.round(fs * 0.58), COLORS.dim, "500", 1.3);
  by += fs * 0.9;

  by = button(pad, by, L.W - pad * 2, 56, "DEFER — FREE TODAY", "defer",
              { accent: COLORS.amber, color: COLORS.amber, size: 14 }) + 8;
  by = wrapText("Reliability −" + Math.round(CFG.RELIABILITY_PER_DEFERRAL * 100) +
                "%, permanently, and it asks again in about a week. Free today is the whole trap.",
                pad + 4, by + fs * 0.7, L.W - pad * 2 - 8, Math.round(fs * 0.58), COLORS.dim, "500", 1.3);

  if (due.length > 1) {
    text(due.length - 1 + " MORE AFTER THIS", L.W / 2, L.H - L.safeBottom - fs * 1.2,
         Math.round(fs * 0.6), COLORS.dim, "700", "center");
  }
}

// --- Title -------------------------------------------------------------------

function drawTitle(nowMs) {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, L.W, L.H);

  var pad = L.pad;
  var fs = L.font;
  var y = L.safeTop + L.H * 0.16;

  // The title is itself a split-flap row, so the first thing the player sees is
  // the thing the whole game looks like.
  titleFlap(nowMs, y);
  y += fs * 4.3;

  text("A 30-DAY SEASON. ONE SMALL CARRIER.", pad, y, Math.round(fs * 0.66), COLORS.head, "700");
  y += fs * 1.3;
  y = wrapText("Every decision makes you more profitable and more fragile. There are no correct answers.",
               pad, y, L.W - pad * 2, Math.round(fs * 0.66), COLORS.dim, "500", 1.35);

  y += fs * 2.2;
  [["TAP A FLIGHT", "to see its aircraft, its crew clock, and the ground time holding the day together."],
   ["PAUSE FREELY", "it costs nothing. The pressure is the clock's consequences, not the clock."],
   ["SLACK ABSORBS", "a 40-minute delay vanishes into a 70-minute turn. It lands whole on a 30-minute one."]
  ].forEach(function (row) {
    text(row[0], pad, y, Math.round(fs * 0.64), COLORS.amber, "700");
    y += fs * 1.0;
    y = wrapText(row[1], pad, y, L.W - pad * 2, Math.round(fs * 0.6), COLORS.dim, "500", 1.3);
    y += fs * 0.8;
  });

  var hist = loadHistory();
  if (hist.length) {
    y += fs * 0.4;
    text("LAST RUN", pad, y, Math.round(fs * 0.6), COLORS.dim, "700");
    var h = hist[0];
    text("DAY " + h.days + " · " + money(h.cash) + " · REP " + h.rep +
         (h.result === "bankrupt" ? " · BANKRUPT" : " · SURVIVED"),
         L.W - pad, y, Math.round(fs * 0.6),
         h.result === "bankrupt" ? COLORS.red : COLORS.green, "700", "right");
  }

  var bh = 60;
  button(pad, L.H - L.safeBottom - bh - 24, L.W - pad * 2, bh, "BEGIN SEASON", "start",
         { fill: COLORS.green, stroke: COLORS.green, color: COLORS.bg, size: 17 });
}

var titleCells = null;
function titleFlap(nowMs, y) {
  if (!titleCells) {
    titleCells = [makeCell(6), makeCell(4)];
    titleCells.startAt = nowMs + 220;
  }
  if (titleCells.startAt && nowMs >= titleCells.startAt) {
    titleCells.startAt = 0;
    setCell(titleCells[0], "GROUND", nowMs);
    setCell(titleCells[1], "STOP", nowMs);
  }
  frameFlips += tickCell(titleCells[0], nowMs);
  frameFlips += tickCell(titleCells[1], nowMs);

  var size = Math.min(Math.round(L.W / 7.2), Math.round(L.font * 2.6));
  ctx.font = "700 " + size + "px " + MONO;
  var cw = ctx.measureText("M").width;
  var x = L.pad;
  ctx.textBaseline = "alphabetic";
  for (var k = 0; k < 2; k++) {
    var cell = titleCells[k];
    for (var i = 0; i < cell.w; i++) {
      var c = cell.chars[i];
      ctx.fillStyle = c.done ? COLORS.bone : COLORS.amber;
      ctx.fillText(c.cur, x + i * cw, y + (k === 0 ? 0 : size * 1.12));
    }
  }
}

// --- End of run --------------------------------------------------------------

function drawGameOver(nowMs) {
  var st = state;
  ctx.fillStyle = COLORS.paper;
  ctx.fillRect(0, 0, L.W, L.H);

  var pad = Math.round(L.W * 0.075);
  var fs = L.font;
  var y = L.safeTop + fs * 3;
  var ink = COLORS.ink;
  var survived = st.overReason === "season";

  tracked("THE DAILY DEPARTURE", pad, y, Math.round(fs * 0.72), ink, "700", 2.4);
  y += 10;
  ctx.fillStyle = ink; ctx.fillRect(pad, y, L.W - pad * 2, 2);
  y += fs * 2.2;

  y = wrapText(survived ? "THIRTY DAYS. STILL FLYING." : "GROUND STOP AIRWAYS CEASES OPERATIONS",
               pad, y, L.W - pad * 2, Math.round(fs * 1.5), ink, "700", 1.12);
  y += fs * 1.2;

  y = wrapText(survived
      ? "The season closed with the operation intact. It was never comfortable."
      : "Two consecutive days in the red. The lessors took the aircraft back on day " + st.day + ".",
      pad, y, L.W - pad * 2, Math.round(fs * 0.7), "#57534b", "500", 1.3);
  y += fs * 1.6;

  y = paperHead("THE SEASON", pad, y, fs, ink);
  var days = st.history.length;
  var avgOtp = days ? st.history.reduce(function (s, h) { return s + h.otp; }, 0) / days : 0;
  var cancels = st.history.reduce(function (s, h) { return s + h.cancelled; }, 0);
  var best = st.history.slice().sort(function (a, b) { return b.net - a.net; })[0];
  var worst = st.history.slice().sort(function (a, b) { return a.net - b.net; })[0];

  y = paperRow("DAYS FLOWN", String(days), y, fs, pad, ink);
  y = paperRow("AVERAGE ON TIME", Math.round(avgOtp * 100) + "%", y, fs, pad, ink,
               avgOtp >= 0.82 ? "#1d6b3a" : "#8c2b23");
  y = paperRow("TOTAL CANCELLATIONS", String(cancels), y, fs, pad, ink);
  y = paperRow("FINAL BALANCE", money(st.cash), y, fs, pad, ink, st.cash >= 0 ? "#1d6b3a" : "#8c2b23");
  y = paperRow("FINAL REPUTATION", String(Math.round(st.reputation)), y, fs, pad, ink);
  if (best) y = paperRow("BEST DAY", "DAY " + best.day + "  " + money(best.net), y, fs, pad, ink, "#1d6b3a");
  if (worst) y = paperRow("WORST DAY", "DAY " + worst.day + "  " + money(worst.net), y, fs, pad, ink, "#8c2b23");
  y += fs * 1.2;

  // The balance sheet, drawn. Thirty bars is a whole run at a glance.
  if (days > 1) {
    y = paperHead("BALANCE", pad, y, fs, ink);
    var gw = L.W - pad * 2, gh = fs * 5;
    var maxAbs = 1;
    st.history.forEach(function (h) { maxAbs = Math.max(maxAbs, Math.abs(h.balance)); });
    var zero = y + gh / 2;
    ctx.fillStyle = "#c8c2b2";
    ctx.fillRect(pad, zero, gw, 1);
    var bw = Math.max(2, gw / CFG.SEASON_DAYS - 2);
    st.history.forEach(function (h, i) {
      var bx = pad + i * (gw / CFG.SEASON_DAYS);
      var bhh = (h.balance / maxAbs) * (gh / 2);
      ctx.fillStyle = h.balance >= 0 ? "#1d6b3a" : "#8c2b23";
      ctx.fillRect(bx, bhh >= 0 ? zero - bhh : zero, bw, Math.max(1, Math.abs(bhh)));
    });
    y += gh + fs * 1.2;
  }

  var bh = 56;
  button(pad, L.H - L.safeBottom - bh - 20, L.W - pad * 2, bh, "NEW SEASON", "restart",
         { fill: COLORS.ink, stroke: COLORS.ink, color: COLORS.paper, size: 15 });
}

// ---------------------------------------------------------------------------
// 11. INPUT
// ---------------------------------------------------------------------------

var touch = { down: false, x: 0, y: 0, sx: 0, sy: 0, t: 0, dragging: false, vel: 0, lastY: 0, lastT: 0 };

function scrollTargetAt(y) {
  if (state.phase === "report") return "report";
  if (state.phase === "maintenance") return null;
  if (selectedFlight) return "sheet";
  if (y >= L.boardY && y <= L.boardY + L.boardH) return "board";
  return null;
}

function onDown(x, y) {
  touch.down = true;
  touch.x = touch.sx = x;
  touch.y = touch.sy = y;
  touch.lastY = y;
  touch.t = touch.lastT = perfNow();
  touch.dragging = false;
  touch.vel = 0;
  touch.target = scrollTargetAt(y);
}

function onMove(x, y) {
  if (!touch.down) return;
  var dy = y - touch.y;
  if (!touch.dragging && Math.abs(y - touch.sy) > 8) touch.dragging = true;
  if (touch.dragging && touch.target) {
    if (touch.target === "board") boardScroll = clamp(boardScroll - dy, 0, boardScrollMax);
    else if (touch.target === "sheet") sheetScroll = clamp(sheetScroll - dy, 0, sheetScrollMax);
    else if (touch.target === "report") reportScroll = clamp(reportScroll - dy, 0, reportScrollMax);
    userScrolledAt = perfNow();
    var now = perfNow();
    var dt = Math.max(1, now - touch.lastT);
    touch.vel = (y - touch.lastY) / dt;
    touch.lastY = y; touch.lastT = now;
  }
  touch.x = x; touch.y = y;
}

function onUp(x, y) {
  if (!touch.down) return;
  touch.down = false;
  var dur = perfNow() - touch.t;
  if (touch.dragging) {
    // A little momentum, so flicking the board feels like a board.
    momentum = { target: touch.target, v: touch.vel * 16 };
    return;
  }
  if (dur > 700) return;
  resolveTap(x, y);
}

var momentum = null;

function applyMomentum() {
  if (!momentum || Math.abs(momentum.v) < 0.4) { momentum = null; return; }
  if (momentum.target === "board") boardScroll = clamp(boardScroll - momentum.v, 0, boardScrollMax);
  else if (momentum.target === "sheet") sheetScroll = clamp(sheetScroll - momentum.v, 0, sheetScrollMax);
  else if (momentum.target === "report") reportScroll = clamp(reportScroll - momentum.v, 0, reportScrollMax);
  momentum.v *= 0.92;
  userScrolledAt = perfNow();
}

function resolveTap(x, y) {
  audioResume();
  // Topmost region wins, so an overlay always beats the board behind it.
  for (var i = hits.length - 1; i >= 0; i--) {
    var r = hits[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
      handle(r.id, r.data);
      return;
    }
  }
}

function handle(id, data) {
  var st = state;
  switch (id) {
    case "start":
      audioResume();
      st.phase = "day";
      st.paused = false;
      audioTap();
      break;

    case "playpause":
      st.paused = !st.paused;
      audioTap();
      break;

    case "speed":
      st.speed = data;
      st.paused = false;
      audioTap();
      break;

    case "mute":
      toggleMute();
      break;

    case "flight":
      selectedFlight = data;
      sheetMode = null;
      sheetScroll = 0;
      audioTap();
      break;

    case "closesheet":
      selectedFlight = null;
      sheetMode = null;
      break;

    case "swapmode":
      sheetMode = "swap";
      sheetScroll = 0;
      audioTap();
      break;

    case "sheetback":
      sheetMode = null;
      sheetScroll = 0;
      break;

    case "doswap":
      var f1 = flightById(st, selectedFlight);
      if (f1 && swapAircraft(st, f1, data)) { sheetMode = null; audioTap(); }
      break;

    case "hold":
      var f2 = flightById(st, selectedFlight);
      if (f2) { holdFlight(st, f2, 30); audioTap(); }
      break;

    case "reserve":
      var f3 = flightById(st, selectedFlight);
      if (f3 && callReserve(st, f3)) audioTap();
      break;

    case "cancel":
      var f4 = flightById(st, selectedFlight);
      if (f4) { cancelFlight(st, f4, "player"); selectedFlight = null; }
      break;

    case "closereport":
      reportScroll = 0;
      selectedFlight = null;
      if (maintenanceDueList(st).filter(function (a) { return !a.decided; }).length) {
        st.phase = "maintenance";
      } else {
        advanceDay(st);
      }
      audioTap();
      break;

    case "authorize":
    case "defer":
      var dueList = maintenanceDueList(st).filter(function (a) { return !a.decided; });
      if (dueList.length) {
        if (id === "authorize") authorizeCheck(st, dueList[0]);
        else deferCheck(st, dueList[0]);
        audioTap();
      }
      if (maintenanceDueList(st).filter(function (a) { return !a.decided; }).length === 0) {
        advanceDay(st);
      }
      break;

    case "restart":
      boardReset();
      titleCells = null;
      selectedFlight = null;
      reportScroll = boardScroll = sheetScroll = 0;
      newRun(String(Date.now()));
      audioTap();
      break;
  }
}

// ---------------------------------------------------------------------------
// 12. LOOP AND BOOT
// ---------------------------------------------------------------------------

var lastTs = 0, acc = 0, lastHour = -1, humCounter = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var dt = Math.min(ts - lastTs, 250);   // a long stall must not fast-forward the day
  lastTs = ts;

  applyMomentum();

  if (state.phase === "day" && !state.paused) {
    acc += dt;
    var msPer = CFG.MS_PER_MINUTE / state.speed;
    var guard = 0;
    while (acc >= msPer && guard++ < 300) {
      acc -= msPer;
      simTick(state);
      var hr = Math.floor(state.clock / 60);
      if (hr !== lastHour) { lastHour = hr; audioTick(); }
      if (state.phase !== "day") { acc = 0; break; }
    }
  } else {
    acc = 0;
  }

  if ((humCounter++ % 30) === 0 && state.phase === "day") audioSetHum(strandedNow(state));

  drawFrame(ts);
}

function boot() {
  cv = document.getElementById("stage");
  ctx = cv.getContext("2d", { alpha: false });
  cv.style.touchAction = "none";

  layout();
  newRun(String(Date.now()));

  window.addEventListener("resize", function () { layout(); }, { passive: true });
  window.addEventListener("orientationchange", function () { setTimeout(layout, 250); }, { passive: true });

  // A phone call, an app switch, a notification — all of them arrive mid-day.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { state.paused = true; acc = 0; }
  });

  if (window.PointerEvent) {
    cv.addEventListener("pointerdown", function (e) { e.preventDefault(); onDown(e.clientX, e.clientY); }, { passive: false });
    cv.addEventListener("pointermove", function (e) { onMove(e.clientX, e.clientY); }, { passive: true });
    cv.addEventListener("pointerup", function (e) { onUp(e.clientX, e.clientY); }, { passive: true });
    cv.addEventListener("pointercancel", function () { touch.down = false; }, { passive: true });
  } else {
    cv.addEventListener("touchstart", function (e) {
      e.preventDefault(); var t = e.changedTouches[0]; onDown(t.clientX, t.clientY);
    }, { passive: false });
    cv.addEventListener("touchmove", function (e) {
      e.preventDefault(); var t = e.changedTouches[0]; onMove(t.clientX, t.clientY);
    }, { passive: false });
    cv.addEventListener("touchend", function (e) {
      var t = e.changedTouches[0]; onUp(t.clientX, t.clientY);
    }, { passive: true });
  }

  // Belt and braces against iOS rubber-banding the page behind the canvas.
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });

  requestAnimationFrame(frame);
}

if (!HEADLESS) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}

// Exposed for the headless balance harness in tools/simcheck.mjs and for
// poking at a live run from the console. Nothing in the game reads this.
var API = {
  CFG: CFG, ROUTES: function () { return ROUTES; },
  newRun: newRun, simTick: simTick, endOfDay: endOfDay, advanceDay: advanceDay,
  buildDay: buildDay, cancelFlight: cancelFlight, swapAircraft: swapAircraft,
  holdFlight: holdFlight, callReserve: callReserve, swapCandidates: swapCandidates,
  maintenanceDueList: maintenanceDueList, authorizeCheck: authorizeCheck, deferCheck: deferCheck,
  computeDayStats: computeDayStats, statusTextFor: statusTextFor,
  get state() { return state; }
};
try { if (typeof globalThis !== "undefined") globalThis.GS = API; } catch (e) {}
})();
</script>
</body>
