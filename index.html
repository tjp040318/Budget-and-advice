/* ============================================================================
   PROFILES, STORAGE, VALIDATION, EXPORT
   ----------------------------------------------------------------------------
   A "profile" is one household's raw data. It is the only thing that persists,
   and it is the only thing the user edits.

   makeDataSource(profile) turns a profile into the DataSource the engine
   consumes. MockDataSource (demo personas) and LocalDataSource (your own data,
   from localStorage) are the same function with different inputs — which is
   the point of the adapter boundary: PlaidDataSource and MethodDataSource slot
   in beside them without the engine noticing.
   ============================================================================ */

const CADENCES = ['weekly', 'biweekly', 'semimonthly', 'monthly'];
const KINDS = ['credit_card', 'auto_loan', 'student_loan', 'mortgage', 'personal_loan', 'rent', 'utility'];
const CONFIDENCES = ['certain', 'likely', 'variable'];
const STRATEGIES = ['avalanche', 'snowball', 'hybrid'];
const NO_BALANCE_KINDS = ['rent', 'utility'];

function uid(prefix) {
  return prefix + Math.random().toString(36).slice(2, 9);
}

/* --------------------------------------------------------------- normalise */

const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : (d || 0); };
const clampInt = (v, lo, hi, d) => {
  const n = Math.round(num(v, d));
  return Math.min(hi, Math.max(lo, Number.isFinite(n) ? n : d));
};
const oneOf = (v, list, d) => list.indexOf(v) >= 0 ? v : d;

/** Coerce anything the editor can produce into something the engine can trust.
 *  The engine assumes valid ranges everywhere; this is the single place that
 *  guarantees them, so hand-entered data can never reach the solver malformed. */
function normalizeProfile(p) {
  const out = {
    profile: {
      id: (p.profile && p.profile.id) || 'mine',
      name: ((p.profile && p.profile.name) || '').trim() || 'Your plan',
      tagline: (p.profile && p.profile.tagline) || '',
      note: (p.profile && p.profile.note) || '',
      balancesAsOf: (p.profile && p.profile.balancesAsOf) || null,
      startedAt: (p.profile && p.profile.startedAt) || null
    },
    accounts: [], liabilities: [], incomeStreams: [], expenses: [],
    depositHistory: {}, settings: {}
  };

  out.accounts = (p.accounts || []).map(a => ({
    id: a.id || uid('acct'),
    name: (a.name || '').trim() || 'Account',
    type: oneOf(a.type, ['checking', 'savings'], 'checking'),
    balance: Math.max(0, num(a.balance, 0))
  }));
  // Every household needs somewhere for money to sit.
  if (out.accounts.length && !out.accounts.some(a => a.type === 'checking')) {
    out.accounts[0].type = 'checking';
  }
  const ids = out.accounts.map(a => a.id);
  const primary = (out.accounts.find(a => a.type === 'checking') || out.accounts[0] || {}).id;
  const acct = id => ids.indexOf(id) >= 0 ? id : primary;

  out.liabilities = (p.liabilities || []).map(l => {
    const kind = oneOf(l.kind, KINDS, 'credit_card');
    const noBalance = NO_BALANCE_KINDS.indexOf(kind) >= 0;
    const isCard = kind === 'credit_card';
    return {
      id: l.id || uid('liab'),
      name: (l.name || '').trim() || 'Untitled',
      kind,
      balance: noBalance ? 0 : Math.max(0, num(l.balance, 0)),
      apr: noBalance ? null : Math.max(0, Math.min(1, num(l.apr, 0))),
      minimumPayment: Math.max(0, num(l.minimumPayment, 0)),
      dueDayOfMonth: clampInt(l.dueDayOfMonth, 1, 31, 1),
      statementCloseDay: isCard && l.statementCloseDay != null && l.statementCloseDay !== ''
        ? clampInt(l.statementCloseDay, 1, 31, 1) : null,
      creditLimit: isCard && num(l.creditLimit, 0) > 0 ? num(l.creditLimit, 0) : null,
      autopayEnabled: !!l.autopayEnabled,
      accountId: acct(l.accountId)
    };
  });

  out.incomeStreams = (p.incomeStreams || []).map(s => {
    const cadence = oneOf(s.cadence, CADENCES, 'monthly');
    return {
      id: s.id || uid('inc'),
      label: (s.label || '').trim() || 'income',
      cadence,
      amount: Math.max(0, num(s.amount, 0)),
      dayOfMonth: clampInt(s.dayOfMonth, 1, 31, 1),
      weekday: clampInt(s.weekday, 0, 6, 5),
      confidence: oneOf(s.confidence, CONFIDENCES, 'certain'),
      accountId: acct(s.accountId)
    };
  });

  out.expenses = (p.expenses || []).map(e => ({
    id: e.id || uid('exp'),
    label: (e.label || '').trim() || 'Spending',
    amount: Math.max(0, num(e.amount, 0)),
    cadence: oneOf(e.cadence, ['weekly', 'monthly'], 'monthly'),
    dayOfMonth: clampInt(e.dayOfMonth, 1, 31, 1),
    weekday: clampInt(e.weekday, 0, 6, 1),
    accountId: acct(e.accountId),
    category: e.category || 'other'
  }));

  for (const s of out.incomeStreams) {
    const hist = (p.depositHistory || {})[s.id] || [];
    out.depositHistory[s.id] = hist.map(v => num(v, 0)).filter(v => v > 0);
  }

  const st = p.settings || {};
  out.settings = {
    bufferFloor: Math.max(0, num(st.bufferFloor, 500)),
    strategy: oneOf(st.strategy, STRATEGIES, 'avalanche'),
    optimizeForCreditScore: st.optimizeForCreditScore !== false,
    horizonDays: clampInt(st.horizonDays, 30, 365, 90),
    extraMonthly: Math.max(0, num(st.extraMonthly, 0))
  };
  return out;
}

/* -------------------------------------------------------------- validation */

/** Problems worth telling someone about before they trust the plan.
 *  Errors block the plan; warnings do not. */
function validateProfile(p) {
  const errors = [], warnings = [];
  const cash = p.accounts.filter(a => a.type === 'checking');
  if (!p.accounts.length) errors.push('Add at least one account — the plan needs somewhere to pay from.');
  else if (!cash.length) errors.push('Add a checking account. Savings alone cannot be scheduled against.');

  if (!p.liabilities.length) errors.push('Add at least one debt or bill. Without something to pay there is nothing to schedule.');

  const totalCash = cash.reduce((s, a) => s + a.balance, 0);
  if (p.settings.bufferFloor > totalCash && cash.length) {
    warnings.push('Your buffer floor (' + money0(p.settings.bufferFloor) + ') is above what is in checking right now (' +
      money0(totalCash) + '). The plan will draw on savings to hold the line, or flag a breach if it cannot.');
  }

  if (!p.incomeStreams.length) {
    warnings.push('No income yet. The plan will schedule from your current balance only, which will run out.');
  }

  for (const l of p.liabilities) {
    const noBal = NO_BALANCE_KINDS.indexOf(l.kind) >= 0;
    if (l.minimumPayment <= 0) warnings.push('"' + l.name + '" has no minimum payment, so nothing will be scheduled for it.');
    if (!noBal && l.balance > 0 && l.apr === 0) warnings.push('"' + l.name + '" is at 0% APR. If that is a promotional rate, remember it ends.');
    if (!noBal && l.balance > 0 && l.minimumPayment > 0 && l.apr > 0) {
      const monthlyInterest = l.balance * l.apr / 12;
      if (l.minimumPayment <= monthlyInterest) {
        errors.push('"' + l.name + '" accrues ' + money(monthlyInterest) + ' of interest a month but its minimum is only ' +
          money(l.minimumPayment) + '. That balance grows no matter what the plan does — check the numbers.');
      }
    }
    if (l.kind === 'credit_card' && !l.creditLimit) {
      warnings.push('"' + l.name + '" has no credit limit set, so utilization cannot be reported or optimised for it.');
    }
    if (l.kind === 'credit_card' && l.statementCloseDay == null) {
      warnings.push('"' + l.name + '" has no statement close day, so its payment cannot be timed ahead of the close.');
    }
  }

  for (const s of p.incomeStreams) {
    if (s.confidence === 'variable') {
      const n = (p.depositHistory[s.id] || []).length;
      if (n === 0) warnings.push('"' + s.label + '" is marked variable but has no deposit history, so the plan has to trust the figure you typed.');
      else if (n < 6) warnings.push('"' + s.label + '" has only ' + n + ' past deposits. A floor gets meaningful around 8–12.');
    }
  }

  /* The arithmetic that decides whether any of this is possible. */
  const monthlyIn = p.incomeStreams.reduce((s, x) => {
    const per = { weekly: 52 / 12, biweekly: 26 / 12, semimonthly: 2, monthly: 1 }[x.cadence];
    const amt = x.confidence === 'variable' && (p.depositHistory[x.id] || []).length
      ? percentile(p.depositHistory[x.id], 0.25) : x.amount;
    return s + amt * per;
  }, 0);
  const monthlyOut = p.liabilities.reduce((s, l) => s + l.minimumPayment, 0) +
    p.expenses.reduce((s, e) => s + e.amount * (e.cadence === 'weekly' ? 52 / 12 : 1), 0);
  if (p.incomeStreams.length && monthlyOut > monthlyIn) {
    errors.push('Your committed outgoings (' + money0(monthlyOut) + '/mo) exceed the income the plan can count on (' +
      money0(monthlyIn) + '/mo). No payment schedule fixes a gap like that — something has to change first.');
  }

  return { errors, warnings, monthlyIn, monthlyOut, slack: r2(monthlyIn - monthlyOut) };
}

/* ------------------------------------------------------------- data source */

function makeDataSource(rawProfile) {
  const p = normalizeProfile(rawProfile);

  function expandStream(s, startDn, days) {
    const endDn = startDn + days;
    const out = [];
    const hist = p.depositHistory[s.id];
    let occ = 0;
    const emit = (dn) => {
      // Variable streams draw deterministically from trailing history, so the
      // "expected" run is reproducible run to run — no randomness anywhere.
      const amount = (s.confidence === 'variable' && hist && hist.length)
        ? hist[(occ + 3) % hist.length]
        : s.amount;
      out.push({
        id: s.id + '-' + dn, streamId: s.id, label: s.label,
        amount: r2(amount), dn, confidence: s.confidence, accountId: s.accountId
      });
      occ++;
    };
    if (s.cadence === 'biweekly') {
      for (let d = nextWeekday(startDn, s.weekday); d <= endDn; d += 14) emit(d);
    } else if (s.cadence === 'weekly') {
      for (let d = nextWeekday(startDn, s.weekday); d <= endDn; d += 7) emit(d);
    } else if (s.cadence === 'semimonthly') {
      monthlyDates(startDn, endDn, 15).concat(monthlyDates(startDn, endDn, 31))
        .sort((a, b) => a - b).forEach(emit);
    } else {
      monthlyDates(startDn, endDn, s.dayOfMonth).forEach(emit);
    }
    return out;
  }

  return {
    raw: p,
    getProfile:        () => ({ ...p.profile }),
    getAccounts:       () => p.accounts.map(a => ({ ...a })),
    getLiabilities:    () => p.liabilities.map(l => ({ ...l })),
    getExpenses:       () => p.expenses.map(e => ({ ...e })),
    getSettings:       () => ({ ...p.settings }),
    getDepositHistory: (streamId) => (p.depositHistory[streamId] || []).slice(),
    getIncomeStreams:  () => p.incomeStreams.map(s => ({ ...s })),
    getIncomeEvents:   (startDn, days) => {
      const out = [];
      for (const s of p.incomeStreams) out.push(...expandStream(s, startDn, days));
      out.sort((a, b) => a.dn - b.dn || (a.id < b.id ? -1 : 1));
      return out;
    }
  };
}

const clone = o => JSON.parse(JSON.stringify(o));
function MockDataSource(personaId) {
  const p = PERSONAS[personaId];
  if (!p) throw new Error('unknown persona: ' + personaId);
  return makeDataSource(clone(p));
}
const PERSONA_IDS = ['steady', 'freelance', 'household'];

/* ------------------------------------------------------------------ storage */

const STORE_KEY = 'debt-scheduler.profile.v1';

function blankProfile() {
  const chk = uid('acct');
  return {
    profile: { id: 'mine', name: '', tagline: '', note: '', balancesAsOf: null, startedAt: null },
    settings: { bufferFloor: 500, strategy: 'avalanche', optimizeForCreditScore: true, horizonDays: 90, extraMonthly: 0 },
    accounts: [{ id: chk, name: 'Checking', type: 'checking', balance: 0 }],
    incomeStreams: [], depositHistory: {}, liabilities: [], expenses: []
  };
}

function loadProfile() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.data) return null;
    return parsed.data;
  } catch (e) {
    return null;
  }
}

function saveProfile(data) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, savedAt: new Date().toISOString(), data }));
    return true;
  } catch (e) {
    return false;   // private browsing, quota, disabled storage
  }
}

function clearProfile() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing to do */ }
}

/** A persona, copied into an editable profile of your own. */
function profileFromPersona(personaId) {
  const p = clone(PERSONAS[personaId]);
  return {
    profile: { id: 'mine', name: '', tagline: '', note: '', balancesAsOf: new Date().toISOString() },
    settings: p.settings,
    accounts: p.accounts,
    incomeStreams: p.incomeStreams,
    depositHistory: p.depositHistory,
    liabilities: p.liabilities,
    expenses: p.expenses
  };
}

/* ------------------------------------------------------------------ exports */

function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function planToCSV(plan) {
  const name = id => (plan.accounts.find(a => a.id === id) || {}).name || '';
  const rows = [['Date', 'Type', 'Payee', 'Amount', 'From account', 'Due date', 'Conditional', 'Why']];
  plan.payments.concat(plan.sweeps).sort((a, b) => a.dn - b.dn).forEach(p => {
    rows.push([
      isoFromDn(p.dn), p.type, p.label, p.amount.toFixed(2),
      name(p.fromAccountId) + (p.toAccountId ? ' -> ' + name(p.toAccountId) : ''),
      p.dueDn ? isoFromDn(p.dueDn) : '', p.conditional ? 'yes' : 'no', p.reason
    ]);
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

/** Fold to 75 octets and escape per RFC 5545, so real calendar apps accept it. */
function icsLine(line) {
  const esc = line.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const out = [];
  let s = esc;
  while (s.length > 74) { out.push(s.slice(0, 74)); s = ' ' + s.slice(74); }
  out.push(s);
  return out.join('\r\n');
}

function planToICS(plan) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const name = id => (plan.accounts.find(a => a.id === id) || {}).name || '';
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//debt payoff scheduler//v1//EN',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    icsLine('X-WR-CALNAME:' + (plan.profile.name || 'Payment plan'))
  ];
  plan.payments.concat(plan.sweeps).sort((a, b) => a.dn - b.dn).forEach((p, i) => {
    if (p.type === 'transfer' && p.tags.indexOf('topup') < 0 && p.tags.indexOf('savings_draw') < 0) return;
    const d = isoFromDn(p.dn).replace(/-/g, '');
    const title = (p.conditional ? 'If income allows: ' : '') +
      (p.type === 'transfer' ? 'Move ' + money(p.amount) + ' to ' + name(p.toAccountId)
                             : 'Pay ' + money(p.amount) + ' — ' + p.label);
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + p.id + '-' + d + '-' + i + '@debt-scheduler');
    lines.push('DTSTAMP:' + stamp);
    lines.push('DTSTART;VALUE=DATE:' + d);
    lines.push('DTEND;VALUE=DATE:' + isoFromDn(p.dn + 1).replace(/-/g, ''));
    lines.push(icsLine('SUMMARY:' + title));
    lines.push(icsLine('DESCRIPTION:' + p.reason));
    lines.push('BEGIN:VALARM', 'TRIGGER:-PT9H', 'ACTION:DISPLAY',
               icsLine('DESCRIPTION:' + title), 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}


/* ============================================================================
   TESTS — run on load, results rendered into the app. No console-only failures.
   Every assertion is a property of the plan, not a golden value, so the suite
   still means something after the numbers change.
   ============================================================================ */

function runTests() {
  const suites = [];
  const t0 = Date.now();

  for (const pid of PERSONA_IDS) {
    const ds = MockDataSource(pid);
    const profile = ds.getProfile();
    const checks = [];
    const startDn = todayDn();
    const plan = buildPlan(ds, { startDn });
    const S = plan.settings;
    const horizonEnd = startDn + plan.horizonDays;
    const acctName = id => (plan.accounts.find(a => a.id === id) || {}).name || id;

    /* ---- 1. hard constraint: the buffer floor holds, every day ---- */
    (() => {
      const worstIdx = plan.series.total.indexOf(Math.min(...plan.series.total));
      const worst = plan.series.total[worstIdx];
      const worstExp = Math.min(...plan.expectedSeries.total);
      let overdrafts = 0, odDetail = '';
      for (const id of Object.keys(plan.series.byAccount)) {
        plan.series.byAccount[id].forEach((v, i) => {
          if (v < -0.005 && !overdrafts++) odDetail = acctName(id) + ' at ' + money(v) + ' on ' + fmtD(plan.series.dn[i]);
        });
      }
      checks.push({
        name: 'Projected balance never breaches the buffer floor',
        pass: worst >= S.bufferFloor - 0.005 && worstExp >= S.bufferFloor - 0.005 && overdrafts === 0,
        detail: 'Floor ' + money0(S.bufferFloor) + '. Lowest projected household checking over ' +
                plan.horizonDays + ' days: ' + money(worst) + ' on ' + fmtD(plan.series.dn[worstIdx]) +
                ' (conservative), ' + money(worstExp) + ' (expected). ' +
                (overdrafts ? overdrafts + ' account-level overdraft(s): ' + odDetail
                            : 'No individual account goes below zero.')
      });
    })();

    /* ---- 2. hard constraint: no minimum is ever late or short ---- */
    (() => {
      const late = plan.lates.length;
      const short = plan.shortfalls.length;
      const dueInHorizon = plan.obligations.filter(o => !o.skipped);
      let latestGap = Infinity, worstOb = null;
      for (const ob of dueInHorizon) {
        if (ob.paidDn == null) continue;
        const gap = ob.dueDn - ob.paidDn;
        if (gap < latestGap) { latestGap = gap; worstOb = ob; }
      }
      checks.push({
        name: 'Every minimum is scheduled on or before its due date',
        pass: late === 0 && short === 0 && latestGap >= 0,
        detail: dueInHorizon.length + ' obligations fall inside the horizon; ' + late + ' late, ' +
                short + ' short. Tightest margin: ' +
                (worstOb ? latestGap + ' day(s) before the ' + fmtD(worstOb.dueDn) + ' due date.' : 'n/a')
      });
    })();

    /* ---- 3. hard constraint: nothing is spent before it arrives ---- */
    (() => {
      const available = r2(plan.totals.startingCash + plan.totals.inflowPlanned);
      const out = r2(plan.totals.scheduledOutflow + plan.totals.expenses);
      const tight = out <= r2(available - S.bufferFloor) + 0.005;
      checks.push({
        name: 'Total outflow never exceeds starting balance plus inflow',
        pass: plan.totals.scheduledOutflow <= available + 0.005 && tight,
        detail: 'Scheduled payments ' + money(plan.totals.scheduledOutflow) + ' + background spending ' +
                money(plan.totals.expenses) + ' = ' + money(out) + ' against ' + money(plan.totals.startingCash) +
                ' on hand plus ' + money(plan.totals.inflowPlanned) + ' of committed income. ' +
                money(r2(available - out)) + ' left over, floor is ' + money0(S.bufferFloor) + '.'
      });
    })();

    /* ---- 4. avalanche beats snowball at the expensive debt ---- */
    (() => {
      const debts = plan.liabilities.filter(l => l.apr != null);
      const top = debts.slice().sort((a, b) => b.apr - a.apr)[0];
      const dollarsTo = (strategy) => {
        const p = buildPlan(ds, { startDn, strategy, skipProjection: true });
        return r2(p.payments.filter(x => x.liabilityId === top.id && x.type !== 'transfer')
                            .reduce((s, x) => s + x.amount, 0));
      };
      const av = dollarsTo('avalanche'), sn = dollarsTo('snowball');
      checks.push({
        name: 'Avalanche sends strictly more to the highest-APR debt than snowball',
        pass: av > sn + 0.005,
        detail: 'Highest rate is ' + top.name + ' at ' + pct1(top.apr) + '. Over ' + plan.horizonDays +
                ' days avalanche directs ' + money(av) + ' at it, snowball ' + money(sn) +
                ' — a ' + money(r2(av - sn)) + ' difference.'
      });
    })();

    /* ---- 5. statement-close timing actually moves reported utilization ---- */
    (() => {
      // Swept across strategies on purpose. The engine declines the move when
      // the card is already the surplus target — pulling the minimum forward
      // would reserve the same dollars for a later date and report the same
      // balance. So the property that must hold everywhere is "never worse",
      // and it must be strictly better wherever the move is available.
      const rows = ['avalanche', 'snowball', 'hybrid'].map(strategy => {
        const on  = buildPlan(ds, { startDn, strategy, optimizeForCreditScore: true,  skipProjection: true });
        const off = buildPlan(ds, { startDn, strategy, optimizeForCreditScore: false, skipProjection: true });
        return {
          strategy,
          on: on.peakReportedUtilization,
          off: off.peakReportedUtilization,
          moves: on.payments.filter(p => p.type === 'statement_close').length
        };
      });
      const neverWorse = rows.every(r => r.on <= r.off + 0.0001);
      const helped = rows.filter(r => r.on < r.off - 0.0001);
      const anyMoves = rows.some(r => r.moves > 0);
      checks.push({
        name: 'Statement-close timing lowers peak reported utilization',
        pass: neverWorse && helped.length > 0 && anyMoves,
        detail: rows.map(r => r.strategy + ': ' + pct1(r.on) + ' vs ' + pct1(r.off) +
          (r.moves ? ' (' + r.moves + ' move' + (r.moves > 1 ? 's' : '') + ')' : ' (declined — that card is already the surplus target)')
        ).join(' · ') + '. Best improvement ' +
        (Math.round(Math.max(...rows.map(r => r.off - r.on)) * 1000) / 10) + ' points of peak utilization.'
      });
    })();

    /* ---- 6. every payment lands inside the horizon ---- */
    (() => {
      const bad = plan.payments.filter(p => p.dn < startDn || p.dn >= horizonEnd);
      const beforeDue = plan.payments.filter(p => p.dueDn != null && p.dn > p.dueDn);
      checks.push({
        name: 'No payment is dated outside the horizon or after its due date',
        pass: bad.length === 0 && beforeDue.length === 0,
        detail: plan.payments.length + ' payments, all inside ' + fmtD(startDn) + '–' + fmtD(horizonEnd - 1) + '.'
      });
    })();

    /* ---- 7. every decision explains itself in a real sentence ---- */
    (() => {
      const all = plan.payments.concat(plan.sweeps);
      const weak = all.filter(p => !p.reason || p.reason.length < 45 ||
        !/\$/.test(p.reason) || !/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/.test(p.reason));
      const lens = all.map(p => p.reason.length);
      checks.push({
        name: 'Every scheduled payment carries a specific, generated reason',
        pass: weak.length === 0 && all.length > 0,
        detail: all.length + ' payments, all with a dated, dollar-specific sentence. Shortest ' +
                Math.min(...lens) + ' chars, longest ' + Math.max(...lens) + '. ' +
                (weak.length ? 'Weak: ' + weak[0].reason : '')
      });
    })();

    /* ---- 8. the engine is deterministic ---- */
    (() => {
      const a = buildPlan(ds, { startDn, skipProjection: true });
      const b = buildPlan(ds, { startDn, skipProjection: true });
      const key = p => p.payments.map(x => [x.dn, x.type, x.liabilityId, x.amount, x.reason].join('|')).join('\n');
      checks.push({
        name: 'Two runs of the same inputs produce an identical plan',
        pass: key(a) === key(b),
        detail: 'Same schedule, same amounts, same sentences. No randomness, no clock reads inside the solver.'
      });
    })();

    /* ---- 9. irregular income is planned against a floor, not an average ---- */
    (() => {
      const streams = ds.getIncomeStreams().filter(s => s.confidence === 'variable');
      if (!streams.length) {
        checks.push({
          name: 'Income floor logic (no variable income for this persona)',
          pass: true, skipped: true,
          detail: 'All deposits are certain, so the plan commits against the full amount.'
        });
        return;
      }
      let ok = true; const bits = [];
      for (const s of streams) {
        const hist = ds.getDepositHistory(s.id);
        const mean = hist.reduce((x, y) => x + y, 0) / hist.length;
        const p25 = r2(percentile(hist, 0.25));
        const used = plan.incomeFloors[s.id];
        if (!(used === p25 && used < mean)) ok = false;
        bits.push(s.label + ': floor ' + money0(used) + ' vs ' + money0(mean) + ' average (' +
                  Math.round((1 - used / mean) * 100) + '% haircut)');
      }
      const committed = plan.payments.filter(p => !p.conditional).length;
      checks.push({
        name: 'Variable income is committed against the 25th percentile, not the mean',
        pass: ok && plan.sweeps.length > 0,
        detail: bits.join('; ') + '. ' + committed + ' committed payments survive a floor month; ' +
                plan.sweeps.length + ' conditional sweeps totalling ' + money(plan.totals.sweepOutflow) +
                ' fire only if the deposits come in above it.'
      });
    })();

    /* ---- 10. the plan does not fall apart on awkward start dates ---- */
    (() => {
      const offsets = [0, 1, 2, 3, 5, 8, 13, 17, 21, 26, 30, 45, 60, 97, 128, 160, 200, 245];
      const bad = [];
      for (const off of offsets) {
        const p = buildPlan(ds, { startDn: startDn + off, skipProjection: true });
        if (p.breaches.length || p.lates.length || p.shortfalls.length) {
          bad.push(fmtDY(startDn + off) + ' (' + p.breaches.length + ' breach / ' +
                   p.lates.length + ' late / ' + p.shortfalls.length + ' short)');
        }
      }
      checks.push({
        name: 'Constraints hold from any start date, including month boundaries',
        pass: bad.length === 0,
        detail: offsets.length + ' start dates swept across ' +
                fmtDY(startDn) + '–' + fmtDY(startDn + 245) + ', covering month ends, short months and ' +
                'every weekday. ' + (bad.length ? 'Failed: ' + bad.join(', ') : 'All clean.')
      });
    })();

    /* ---- 11. the long projection terminates ---- */
    (() => {
      const debts = plan.liabilities.filter(l => l.apr != null);
      const unpaid = debts.filter(l => !plan.projection.perLiability[l.id].cleared);
      checks.push({
        name: 'Every interest-bearing debt is paid off inside the projection',
        pass: unpaid.length === 0 && plan.projection.debtFreeDn !== null,
        detail: unpaid.length === 0
          ? 'Debt-free ' + fmtDY(plan.projection.debtFreeDn) + ' — ' + plan.projection.monthsToDebtFree +
            ' months, ' + money(plan.projection.totalInterest) + ' of interest along the way.'
          : 'Still open after 15 years: ' + unpaid.map(l => l.name).join(', ')
      });
    })();

    suites.push({
      persona: profile,
      checks,
      passed: checks.filter(c => c.pass).length,
      total: checks.length,
      plan
    });
  }

  const total = suites.reduce((s, x) => s + x.total, 0);
  const passed = suites.reduce((s, x) => s + x.passed, 0);
  return { suites, total, passed, failed: total - passed, ms: Date.now() - t0 };
}


/* ============================================================================
   UI. Four views, in the order they matter: this week, timeline, debts,
   what-if — plus the test panel, which is always one click away and shouts
   from the top bar when anything is red.
   ============================================================================ */

const state = {
  profileId: 'mine',      // 'mine' | a demo persona id
  view: 'week',
  whatif: null,
  testResults: null,
  myProfile: null,        // raw, editable, persisted
  rev: 0,                 // bumped on every edit to bust the plan cache
  saveFailed: false,
  toast: null
};

const isMine = () => state.profileId === 'mine';
/* "Set up" is an explicit act, not something inferred from whether data
   happens to exist — otherwise choosing to start from an empty plan bounces
   you straight back to the screen you just left. */
const hasOwnData = () => !!state.myProfile && (
  !!state.myProfile.profile.startedAt ||
  state.myProfile.liabilities.length > 0 || state.myProfile.accounts.length > 1 ||
  (state.myProfile.accounts[0] && state.myProfile.accounts[0].balance > 0));

function activeDataSource() {
  return isMine() ? makeDataSource(state.myProfile) : MockDataSource(state.profileId);
}

const planCache = new Map();
function planFor(overrides) {
  const key = state.profileId + '|' + state.rev + '|' + JSON.stringify(overrides || {});
  if (!planCache.has(key)) planCache.set(key, buildPlan(activeDataSource(), overrides || {}));
  return planCache.get(key);
}
const START_DN = todayDn();

/** Never let a bad profile take the whole page down — show it instead. */
function currentPlan() {
  try { return planFor({ startDn: START_DN }); }
  catch (e) { return { __error: e.message || String(e) }; }
}

function commit(touchBalances) {
  if (touchBalances) state.myProfile.profile.balancesAsOf = new Date().toISOString();
  state.rev++;
  planCache.clear();
  state.saveFailed = !saveProfile(state.myProfile);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
const nameOf = (plan, id) => (plan.accounts.find(a => a.id === id) || {}).name || id;
/* With a single checking account, stamping its name on every row is noise. */
const multiAccount = plan => plan.accounts.filter(a => a.type === 'checking').length > 1;
const acctChip = (plan, id) => multiAccount(plan) ? '<span class="chip">' + esc(nameOf(plan, id)) + '</span>' : '';

const KIND_LABEL = {
  credit_card: 'credit card', auto_loan: 'auto loan', student_loan: 'student loan',
  mortgage: 'mortgage', personal_loan: 'personal loan', rent: 'rent', utility: 'utility'
};

/* ------------------------------------------------------------------ chrome */

function renderChrome() {
  const t = state.testResults;
  const bad = t && t.failed > 0;
  document.getElementById('banner').className = 'banner' + (bad ? ' bad' : '');
  document.getElementById('banner').innerHTML = bad
    ? '<span>' + t.failed + ' of ' + t.total + ' engine checks are failing. The plan below should not be trusted until they are green.</span>' +
      '<button data-view="tests">Open the test panel</button>'
    : '<span>' + (t ? t.passed + ' of ' + t.total + ' engine checks pass across all three personas' : 'running checks…') + '</span>' +
      '<button data-view="tests">See what they cover</button>';

  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === state.view)));
  document.querySelectorAll('.person').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.profile === state.profileId)));
  const mineLabel = document.getElementById('mineLabel');
  if (mineLabel) mineLabel.textContent = hasOwnData()
    ? ((state.myProfile.profile.name || '').trim() || 'My plan') : 'My plan — not set up yet';

  const plan = currentPlan();
  const note = document.getElementById('railNote');
  if (plan.__error) { note.innerHTML = 'No plan yet. Open <b>Your money</b> to set one up.'; return; }
  const floors = Object.keys(plan.incomeFloors);
  const stale = staleDays();
  note.innerHTML =
    'Plan built ' + esc(fmtDY(plan.startDn)) + ' over ' + plan.horizonDays + ' days.<br>' +
    'Buffer floor <code>' + esc(money0(plan.settings.bufferFloor)) + '</code> across checking.<br>' +
    (floors.length
      ? 'Variable income committed at the 25th percentile of your deposit history.'
      : 'All income is fixed and dated.') +
    (stale !== null && stale > 7
      ? '<br><br>Balances last updated ' + stale + ' days ago. They drift — refresh them under Your money.'
      : '');
}

/** How long since the balances were touched, or null if unknown/not yours. */
function staleDays() {
  if (!isMine() || !state.myProfile || !state.myProfile.profile.balancesAsOf) return null;
  const then = new Date(state.myProfile.profile.balancesAsOf);
  if (isNaN(then.getTime())) return null;
  return Math.floor((Date.now() - then.getTime()) / 86400000);
}

/* -------------------------------------------------------------- components */

function chip(text, tone) { return '<span class="chip ' + (tone || '') + '">' + esc(text) + '</span>'; }

function paymentRow(plan, p) {
  let cls = 'row', chips = '';
  if (p.type === 'statement_close') { cls += ' util'; chips = chip('utilization move', 'slate'); }
  else if (p.type === 'extra')      { cls += ' move';  chips = chip('extra', 'teal'); }
  else if (p.type === 'sweep')      { cls += ' cond';  chips = chip('only if income allows'); }
  else if (p.type === 'transfer')   {
    cls += ' muted';
    chips = chip(p.tags.includes('savings_draw') ? 'from savings'
              : p.tags.includes('restore') ? 'back to savings' : 'between accounts');
  } else {
    const l = plan.liabilities.find(x => x.id === p.liabilityId);
    chips = chip(l && l.autopayEnabled ? 'autopay' : 'minimum');
  }
  const where = p.type === 'transfer'
    ? '<span class="chip">' + esc(nameOf(plan, p.fromAccountId) + ' \u2192 ' + nameOf(plan, p.toAccountId)) + '</span>'
    : acctChip(plan, p.fromAccountId);
  return '<div class="' + cls + '">' +
    '<div class="what"><b>' + esc(p.label) + '</b>' + chips + where + '</div>' +
    '<div class="amt num">' + (p.type === 'transfer' ? '' : '−') + esc(money(p.amount)) + '</div>' +
    '<div class="why">' + esc(p.reason) + '</div>' +
  '</div>';
}

function incomeRow(plan, ev) {
  const conf = ev.confidence === 'variable'
    ? chip('planned at ' + money0(ev.planAmount), 'slate') : chip('expected', 'teal');
  return '<div class="row"><div class="what"><b>' + esc(ev.label.replace(/^the /, '')) + '</b>' +
    conf + acctChip(plan, ev.accountId) + '</div>' +
    '<div class="amt num">+' + esc(money(ev.amount)) + '</div>' +
    (ev.confidence === 'variable'
      ? '<div class="why">The plan only commits ' + esc(money(ev.planAmount)) +
        ' of this. Anything above that gets swept at the target debt instead of quietly absorbed.</div>' : '') +
  '</div>';
}

function expenseRow(plan, ex) {
  return '<div class="row muted"><div class="what"><b>' + esc(ex.label) + '</b>' +
    chip('spending') + acctChip(plan, ex.accountId) + '</div>' +
    '<div class="amt num">−' + esc(money(ex.amount)) + '</div></div>';
}

/* ============================================================= 1. this week */

function viewWeek(plan) {
  const start = plan.startDn, end = start + 7;
  const inRange = d => d >= start && d < end;
  const pays = plan.payments.filter(p => inRange(p.dn));
  const sweeps = plan.sweeps.filter(p => inRange(p.dn));
  const income = plan.incomeEvents.filter(e => inRange(e.dn));
  const spend = plan.expenseEvents.filter(e => inRange(e.dn));
  const balAt = d => plan.series.total[plan.series.dn.indexOf(d)];

  const out = r2(pays.filter(p => p.type !== 'transfer').reduce((s, p) => s + p.amount, 0));
  const week = plan.series.total.slice(0, 7);
  const lowIdx = week.indexOf(Math.min(...week));
  const headroom = r2(week[lowIdx] - plan.settings.bufferFloor);

  let summary;
  if (!pays.length && !sweeps.length) {
    summary = 'Nothing is scheduled to leave in the next seven days. The next payment is ' +
      (plan.payments.length ? esc(plan.payments[0].label) + ' on ' + fmtD(plan.payments[0].dn) : 'outside this horizon') + '.';
  } else {
    const nPay = pays.filter(p => p.type !== 'transfer').length;
    summary = nPay + ' payment' + (nPay === 1 ? '' : 's') + ' totalling ' + money(out) +
      (nPay === 1 ? ' leaves' : ' leave') + ' between ' + fmtDW(start) + ' and ' + fmtDW(end - 1) +
      '. Your thinnest day is ' +
      fmtDW(plan.series.dn[lowIdx]) + ' at ' + money(week[lowIdx]) + ' — ' + money(headroom) +
      ' above the floor you set.';
  }

  let rows = '';
  let any = false;
  for (let d = start; d < end; d++) {
    const dayPays = pays.filter(p => p.dn === d);
    const daySweeps = sweeps.filter(p => p.dn === d);
    const dayIn = income.filter(e => e.dn === d);
    const daySpend = spend.filter(e => e.dn === d);
    if (!dayPays.length && !dayIn.length && !daySpend.length && !daySweeps.length) continue;
    any = true;
    rows += '<div class="day-head"><b>' + esc(fmtDW(d)) + '</b>' +
      (d === start ? '<span>today</span>' : '') +
      '<span class="bal num">' + (multiAccount(plan) ? 'all checking closes at ' : 'closes at ') +
      esc(money(balAt(d))) + '</span></div>';
    dayIn.forEach(e => rows += incomeRow(plan, e));
    dayPays.forEach(p => rows += paymentRow(plan, p));
    daySweeps.forEach(p => rows += paymentRow(plan, p));
    daySpend.forEach(e => rows += expenseRow(plan, e));
  }
  if (!any) {
    rows = '<div class="empty"><b>A quiet week.</b>Nothing moves before ' + esc(fmtDW(end)) +
      '. The Timeline view shows where the plan picks back up.</div>';
  }

  /* For a variable-income persona this is the most important thing on the
     screen, and the deposits themselves often fall outside week one. */
  let floorNote = '';
  const floorIds = Object.keys(plan.incomeFloors);
  if (floorIds.length) {
    const streams = plan.incomeEvents.filter(e => e.confidence === 'variable');
    const committed = r2(streams.reduce((s, e) => s + e.planAmount, 0));
    const expected = r2(streams.reduce((s, e) => s + e.amount, 0));
    const first = plan.sweeps[0];
    floorNote = '<div class="note"><b>This plan is built on a floor, not an average.</b> ' +
      'Over the next ' + plan.horizonDays + ' days your variable work is forecast at ' + esc(money0(expected)) +
      ', but every payment here is sized against ' + esc(money0(committed)) +
      ' — roughly the 25th percentile of your last twelve deposits. A bad month does not break the schedule. ' +
      (first
        ? 'The ' + esc(money0(r2(expected - committed))) + ' difference is already earmarked: ' + plan.sweeps.length +
          ' conditional sweep' + (plan.sweeps.length === 1 ? '' : 's') + ' at ' + esc(first.label) +
          ', the first on ' + esc(fmtD(first.dn)) + ', each one firing only if that deposit clears the floor.'
        : 'Anything above the floor sweeps to the target debt as it arrives.') +
      '</div>';
  }

  const shifts = plan.payments.filter(p => p.type === 'statement_close');
  const cards = plan.liabilities.filter(l => l.kind === 'credit_card');
  let utilNote = '';
  if (plan.settings.optimizeForCreditScore && cards.length) {
    if (shifts.length) {
      const names = [...new Set(shifts.map(s => s.label))];
      utilNote = '<div class="note"><b>Credit-score timing is on.</b> ' + esc(names.join(' and ')) +
        ' gets paid before the statement closes rather than at the due date. Same money, same month — ' +
        'the difference is which balance the bureaus are shown. Peak reported utilization across the horizon is ' +
        pct1(plan.peakReportedUtilization) + '.</div>';
    } else {
      utilNote = '<div class="note"><b>Nothing worth re-timing this cycle.</b> ' +
        'Every spare dollar is already going at ' +
        esc((plan.liabilities.find(l => l.kind === 'credit_card' && l.balance > 0) || {}).name || 'your card') +
        ' on the day it lands, which is ahead of every statement close anyway. Pulling the minimum forward too ' +
        'would reserve the same money for a later date and report the same balance, so the plan leaves it alone.</div>';
    }
  }

  /* If the plan cannot satisfy its own constraints on real numbers, that is
     the first thing on the screen — not a footnote. */
  let health = '';
  const bad = plan.breaches.length + plan.lates.length + plan.shortfalls.length;
  if (bad) {
    const bits = [];
    if (plan.breaches.length) bits.push(plan.breaches.length + ' day' + (plan.breaches.length === 1 ? '' : 's') +
      ' where the balance drops below your floor');
    if (plan.lates.length) bits.push(plan.lates.length + ' payment' + (plan.lates.length === 1 ? '' : 's') + ' that would land late');
    if (plan.shortfalls.length) bits.push(plan.shortfalls.length + ' minimum' + (plan.shortfalls.length === 1 ? '' : 's') + ' the money does not cover');
    health = '<div class="note alert"><b>This plan does not hold together.</b> ' + esc(bits.join(', ')) + '. ' +
      'That is arithmetic, not scheduling — there is not enough coming in to cover what is going out. ' +
      'Lower the buffer floor, check the figures under Your money, or look at What if to see what would have to change.</div>';
  }
  const stale = staleDays();
  const staleNote = (stale !== null && stale > 7)
    ? '<div class="note"><b>These balances are ' + stale + ' days old.</b> ' +
      'The dates below are only right if the starting balances are. ' +
      '<button class="link" data-view="money">Update them</button>, it takes a minute.</div>' : '';

  return '<div class="wrap">' +
    '<div class="page-head"><p class="eyebrow">This week</p>' +
      '<h2>' + esc(plan.profile.name) + '</h2>' +
      '<p class="sub">' + summary + '</p></div>' +
    health + staleNote + floorNote + utilNote +
    '<div class="card"><header><h3>What moves, when, and why</h3>' +
      '<span class="aside">' + esc(fmtDY(start)) + ' – ' + esc(fmtDY(end - 1)) + '</span></header>' +
      '<div class="body flush">' + rows + '</div></div>' +
    upcomingCard(plan) +
    '<div class="card no-print"><header><h3>Act on it</h3>' +
      '<span class="aside">the plan is only worth anything if it reaches you on the day</span></header>' +
      '<div class="body"><div class="btnrow">' +
        '<button class="btn primary" data-action="export-ics">Add payments to my calendar</button>' +
        '<button class="btn" data-action="export-csv">Download the schedule (CSV)</button>' +
        '<button class="btn" data-action="print">Print this week</button>' +
      '</div><p class="hint" style="margin:12px 0 0">The calendar file covers all ' +
      plan.payments.filter(p => p.type !== 'transfer').length + ' payments in the horizon, each with a reminder ' +
      'the morning it is due and the reason attached. Conditional sweeps are labelled as such, so a light month ' +
      'never looks like a missed payment.</p></div></div>' +
  '</div>';
}

function upcomingCard(plan) {
  const start = plan.startDn + 7, end = plan.startDn + 21;
  const pays = plan.payments.filter(p => p.dn >= start && p.dn < end && p.type !== 'transfer');
  if (!pays.length) return '';
  let rows = '';
  pays.forEach(p => {
    rows += '<div class="row"><div class="what"><b>' + esc(fmtD(p.dn)) + ' · ' + esc(p.label) + '</b>' +
      (p.type === 'statement_close' ? chip('utilization move', 'slate') : p.type === 'extra' ? chip('extra', 'teal') : '') +
      '</div><div class="amt num">−' + esc(money(p.amount)) + '</div></div>';
  });
  return '<div class="card"><header><h3>The two weeks after that</h3>' +
    '<span class="aside">reasons on the Timeline view</span></header>' +
    '<div class="body flush">' + rows + '</div></div>';
}

/* ============================================================== 2. timeline */

function balanceChart(plan) {
  const W = 1000, H = 300, padL = 70, padR = 20, padT = 18, padB = 52;
  const s = plan.series, n = s.dn.length;
  const expected = plan.expectedSeries.total;
  const differs = expected.some((v, i) => Math.abs(v - s.total[i]) > 0.5);
  const floor = plan.settings.bufferFloor;
  const all = s.total.concat(differs ? expected : [], [floor]);
  let lo = Math.min(...all), hi = Math.max(...all);
  const span = Math.max(hi - lo, 100);
  lo = Math.max(0, lo - span * 0.16); hi = hi + span * 0.14;
  const X = i => padL + (i / Math.max(n - 1, 1)) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);

  // Red is only ever for something actually going wrong. A floor the plan
  // respects is a boundary, not an alarm.
  const breached = plan.breaches.length > 0;
  const floorColour = breached ? '#A32118' : '#7C949C';
  const line = arr => arr.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const area = line(s.total) + ' L' + X(n - 1).toFixed(1) + ' ' + Y(lo).toFixed(1) +
               ' L' + X(0).toFixed(1) + ' ' + Y(lo).toFixed(1) + ' Z';

  let g = '';
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3;
    g += '<line x1="' + padL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(v).toFixed(1) +
         '" stroke="#DCE3E5" stroke-width="1"/>' +
         '<text x="' + (padL - 10) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11.5" ' +
         'font-family="ui-monospace,monospace" fill="#7C949C">' + esc(money0(v)) + '</text>';
  }

  let months = '';
  s.dn.forEach((d, i) => {
    const p = dparts(d);
    if (p.d !== 1 && i !== 0) return;
    if (i !== 0) months += '<line x1="' + X(i).toFixed(1) + '" y1="' + padT + '" x2="' + X(i).toFixed(1) +
      '" y2="' + (H - padB) + '" stroke="#C3CFD2" stroke-width="1" stroke-dasharray="2 3"/>';
    months += '<text x="' + (X(i) + 6).toFixed(1) + '" y="' + (H - padB + 17) + '" font-size="12" ' +
      'font-family="ui-sans-serif,system-ui" fill="#43606A">' + esc(MONTHS_LONG[p.m]) + '</text>';
  });

  const idx = {}; s.dn.forEach((d, i) => idx[d] = i);
  let marks = '';
  plan.incomeEvents.forEach(e => {
    const i = idx[e.dn]; if (i === undefined) return;
    marks += '<path d="M' + (X(i) - 4).toFixed(1) + ' ' + (H - padB + 3) + ' L' + (X(i) + 4).toFixed(1) +
      ' ' + (H - padB + 3) + ' L' + X(i).toFixed(1) + ' ' + (H - padB - 3) + ' Z" fill="#0E5A61"/>' +
      '<title>' + esc(e.label + ' — ' + money(e.amount) + ' on ' + fmtD(e.dn)) + '</title>';
  });
  plan.payments.forEach(p => {
    const i = idx[p.dn]; if (i === undefined || p.type === 'transfer') return;
    const col = p.type === 'statement_close' ? '#3C5C8C' : p.type === 'extra' ? '#0E5A61' : '#43606A';
    const r = p.type === 'minimum' ? 2.4 : 3.4;
    marks += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(s.total[i]).toFixed(1) + '" r="' + r +
      '" fill="' + col + '"><title>' + esc(fmtD(p.dn) + ' · ' + p.label + ' · ' + money(p.amount)) + '</title></circle>';
  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="Projected checking balance across the horizon">' +
    '<defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">' +
      '<stop offset="0%" stop-color="#0E5A61" stop-opacity="0.13"/>' +
      '<stop offset="100%" stop-color="#0E5A61" stop-opacity="0.01"/></linearGradient></defs>' +
    g + months +
    '<path d="' + area + '" fill="url(#fade)"/>' +
    '<line x1="' + padL + '" y1="' + Y(floor).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(floor).toFixed(1) +
      '" stroke="' + floorColour + '" stroke-width="1.5" stroke-dasharray="5 4"/>' +
    '<text x="' + (W - padR) + '" y="' + (Y(floor) - 7).toFixed(1) + '" text-anchor="end" font-size="11.5" ' +
      'font-family="ui-sans-serif,system-ui" fill="' + floorColour + '">buffer floor ' + esc(money0(floor)) +
      (breached ? ' — breached' : '') + '</text>' +
    (differs ? '<path d="' + line(expected) + '" fill="none" stroke="#3C5C8C" stroke-width="1.5" stroke-dasharray="4 3"/>' : '') +
    '<path d="' + line(s.total) + '" fill="none" stroke="#0E5A61" stroke-width="2"/>' +
    marks +
  '</svg>';
}

function calendars(plan) {
  const start = plan.startDn, end = start + plan.horizonDays;
  const byDay = new Map();
  const put = (d, k) => { if (!byDay.has(d)) byDay.set(d, new Set()); byDay.get(d).add(k); };
  plan.incomeEvents.forEach(e => put(e.dn, 'in'));
  plan.payments.forEach(p => put(p.dn, p.type === 'statement_close' ? 'utl' : p.type === 'transfer' ? '' : 'out'));
  plan.sweeps.forEach(p => put(p.dn, 'swp'));
  plan.closeSnapshots.forEach(c => put(c.dn, 'cls'));

  const first = dparts(start), last = dparts(end - 1);
  let out = '';
  let y = first.y, m = first.m;
  while (y < last.y || (y === last.y && m <= last.m)) {
    const dim = daysInMonth(y, m);
    const lead = dparts(dnFromParts(y, m, 1)).w;
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="cell"></div>';
    for (let d = 1; d <= dim; d++) {
      const dn = dnFromParts(y, m, d);
      const on = dn >= start && dn < end;
      const marks = byDay.get(dn);
      let mk = '';
      if (on && marks) ['in', 'out', 'utl', 'swp', 'cls'].forEach(k => {
        if (marks.has(k)) mk += '<span class="m ' + k + '"></span>';
      });
      cells += '<div class="cell' + (on ? ' on' : '') + (dn === start ? ' today' : '') + '">' +
        d + '<span class="marks">' + mk + '</span></div>';
    }
    out += '<div class="month"><h4>' + esc(MONTHS_LONG[m] + ' ' + y) + '</h4>' +
      '<div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>' +
      '<div class="grid">' + cells + '</div></div>';
    m++; if (m > 11) { m = 0; y++; }
  }
  return '<div class="months">' + out + '</div>';
}

function viewTimeline(plan) {
  const floorLegend = plan.breaches.length ? '#A32118' : '#7C949C';
  const lowIdx = plan.series.total.indexOf(Math.min(...plan.series.total));
  const maxGap = plan.expectedSeries.total.reduce(
    (m, v, i) => Math.max(m, Math.abs(v - plan.series.total[i])), 0);
  const differs = maxGap > 25;
  let rows = '';
  plan.payments.concat(plan.sweeps).sort((a, b) => a.dn - b.dn).forEach(p => {
    rows += '<div class="day-head"><b>' + esc(fmtDW(p.dn)) + '</b></div>' + paymentRow(plan, p);
  });

  return '<div class="wrap">' +
    '<div class="page-head"><p class="eyebrow">Next ' + plan.horizonDays + ' days</p>' +
      '<h2>Timeline</h2>' +
      '<p class="sub">The line is your projected checking balance across every account. It never touches the ' +
      'floor, because keeping it off the floor is the constraint the whole engine solves for. Lowest point: ' +
      esc(money(plan.series.total[lowIdx])) + ' on ' + esc(fmtDY(plan.series.dn[lowIdx])) + '.' +
      (plan.sweeps.length && !differs
        ? ' The expected-income line sits on top of the committed one because every dollar above the floor ' +
          'is swept at the debt as it arrives, rather than piling up in checking.'
        : '') + '</p></div>' +
    '<div class="card"><header><h3>Projected balance</h3>' +
      '<span class="aside">' + esc(fmtDY(plan.startDn)) + ' – ' + esc(fmtDY(plan.startDn + plan.horizonDays - 1)) + '</span></header>' +
      balanceChart(plan) +
      '<div class="legend">' +
        '<span><i style="border-color:#0E5A61"></i>committed plan (built on income you can count on)</span>' +
        (differs ? '<span><i style="border-color:#3C5C8C;border-top-style:dashed"></i>expected, if deposits land as forecast</span>' : '') +
        '<span><i style="border-color:' + floorLegend + ';border-top-style:dashed"></i>buffer floor</span>' +
        '<span><span class="dot" style="background:#0E5A61"></span>income / extra payment</span>' +
        '<span><span class="dot" style="background:#3C5C8C"></span>statement-close move</span>' +
      '</div></div>' +
    '<div class="card"><header><h3>Calendar</h3><span class="aside">' +
      'deposits · payments · statement closes</span></header>' + calendars(plan) + '</div>' +
    '<div class="card"><header><h3>Every scheduled payment</h3>' +
      '<span class="aside">' + plan.payments.length + ' committed, ' + plan.sweeps.length + ' conditional</span></header>' +
      '<div class="body flush">' + rows + '</div></div>' +
  '</div>';
}

/* ================================================================= 3. debts */

function viewDebts(plan) {
  const debts = plan.liabilities.filter(l => l.apr != null);
  const bills = plan.liabilities.filter(l => l.apr == null);
  const proj = plan.projection;
  const target = debts.slice().sort((a, b) =>
    plan.settings.strategy === 'snowball' ? a.balance - b.balance : b.apr - a.apr)[0];

  let rows = '';
  debts.slice().sort((a, b) => b.apr - a.apr).forEach(l => {
    const pl = proj.perLiability[l.id] || {};
    const util = l.creditLimit ? l.balance / l.creditLimit : null;
    rows += '<tr><td><b>' + esc(l.name) + '</b><br>' +
        '<span style="color:var(--ink-3);font-size:12.5px">' + esc(KIND_LABEL[l.kind]) +
        (l.id === target.id ? ' · <span style="color:var(--teal)">where extra money goes</span>' : '') + '</span>' +
        (util !== null ? '<div class="meter' + (util < 0.3 ? ' low' : '') + '"><i style="width:' +
          Math.min(100, util * 100).toFixed(0) + '%"></i></div>' +
          '<span style="font-size:11.5px;color:var(--ink-3)" class="num">' + esc(pct1(util)) + ' of ' +
          esc(money0(l.creditLimit)) + '</span>' : '') +
      '</td>' +
      '<td class="r num">' + esc(money(l.balance)) + '</td>' +
      '<td class="r num">' + esc(pct1(l.apr)) + '</td>' +
      '<td class="r num">' + esc(money(l.minimumPayment)) + '</td>' +
      '<td class="r num">' + (pl.payoffDn ? esc(fmtDY(pl.payoffDn)) : 'beyond 15 yrs') + '</td>' +
      '<td class="r num">' + esc(money(pl.lifetimeInterest || 0)) + '</td></tr>';
  });

  const totBal = r2(debts.reduce((s, l) => s + l.balance, 0));
  const totMin = r2(plan.liabilities.reduce((s, l) => s + l.minimumPayment, 0));

  let billRows = '';
  bills.forEach(l => {
    billRows += '<tr><td><b>' + esc(l.name) + '</b> <span style="color:var(--ink-3);font-size:12.5px">' +
      esc(KIND_LABEL[l.kind]) + '</span></td>' +
      '<td class="r num">' + esc(money(l.minimumPayment)) + '</td>' +
      '<td class="r num">day ' + l.dueDayOfMonth + '</td>' +
      '<td class="r">' + (l.autopayEnabled ? chip('autopay') : chip('scheduled')) + '</td></tr>';
  });

  const strategyCopy = {
    avalanche: 'Avalanche: every spare dollar goes at the highest rate first. Cheapest in total interest.',
    snowball: 'Snowball: smallest balance first. Costs more in interest, closes accounts sooner.',
    hybrid: 'Hybrid: smallest balance first only when it can be cleared inside 60 days, then highest rate.'
  }[plan.settings.strategy];

  return '<div class="wrap">' +
    '<div class="page-head"><p class="eyebrow">Under the current plan</p><h2>Debts</h2>' +
      '<p class="sub">' + esc(money(totBal)) + ' across ' + debts.length + ' balances. ' +
      (proj.debtFreeDn
        ? 'Clear on ' + esc(fmtDY(proj.debtFreeDn)) + ' — ' + proj.monthsToDebtFree + ' months — paying ' +
          esc(money(proj.totalInterest)) + ' of interest on the way. '
        : 'Not cleared inside the 15-year projection at these amounts. ') +
      'Payoff dates assume income at the level the plan commits against, so they are a floor, not a hope.</p></div>' +
    '<div class="note">' + esc(strategyCopy) + '</div>' +
    '<div class="card"><header><h3>Interest-bearing balances</h3>' +
      '<span class="aside">sorted by rate</span></header><div class="tbl-scroll"><table>' +
      '<thead><tr><th>Debt</th><th class="r">Balance</th><th class="r">APR</th>' +
      '<th class="r">Minimum</th><th class="r">Paid off</th><th class="r">Interest to come</th></tr></thead>' +
      '<tbody>' + rows +
      '<tr class="total"><td>Total</td><td class="r num">' + esc(money(totBal)) + '</td><td></td>' +
      '<td class="r num">' + esc(money(r2(debts.reduce((s, l) => s + l.minimumPayment, 0)))) + '</td>' +
      '<td class="r num">' + (proj.debtFreeDn ? esc(fmtDY(proj.debtFreeDn)) : '—') + '</td>' +
      '<td class="r num">' + esc(money(proj.totalInterest)) + '</td></tr>' +
      '</tbody></table></div></div>' +
    (billRows ? '<div class="card"><header><h3>Fixed obligations</h3>' +
      '<span class="aside">no balance to pay down — they just have to clear on time</span></header>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Bill</th><th class="r">Monthly</th>' +
      '<th class="r">Due</th><th>How</th></tr></thead><tbody>' + billRows + '</tbody></table></div></div>' : '') +
    '<div class="card"><header><h3>Committed every month</h3></header><div class="body">' +
      '<span class="num" style="font-size:19px;font-weight:600">' + esc(money(totMin)) + '</span> ' +
      'of minimums and fixed bills, against roughly <span class="num">' +
      esc(money0(plan.monthlySurplusEstimate)) + '</span> a month of genuine slack after everyday spending. ' +
      'That slack is what the schedule has to work with.</div></div>' +
  '</div>';
}

/* =============================================================== 4. what-if */

function whatifState(plan) {
  if (!state.whatif || state.whatif.persona !== state.profileId) {
    state.whatif = {
      persona: state.profileId,
      extraMonthly: 0,
      bufferFloor: plan.settings.bufferFloor,
      strategy: plan.settings.strategy,
      optimizeForCreditScore: plan.settings.optimizeForCreditScore
    };
  }
  return state.whatif;
}

function deltaBlock(k, value, delta, betterWhenNegative) {
  let d = '';
  if (delta !== null && Math.abs(delta.n) > 0.004) {
    const better = betterWhenNegative ? delta.n < 0 : delta.n > 0;
    d = '<div class="d ' + (better ? 'better' : 'worse') + '">' + esc(delta.text) + '</div>';
  } else if (delta !== null) {
    d = '<div class="d">no change</div>';
  }
  return '<div class="delta"><div class="k">' + esc(k) + '</div>' +
    '<div class="v">' + esc(value) + '</div>' + d + '</div>';
}

function viewWhatIf(plan) {
  const w = whatifState(plan);
  const alt = planFor({
    startDn: START_DN,
    extraMonthly: w.extraMonthly,
    bufferFloor: w.bufferFloor,
    strategy: w.strategy,
    optimizeForCreditScore: w.optimizeForCreditScore
  });
  const base = plan;

  const months = alt.projection.monthsToDebtFree, bMonths = base.projection.monthsToDebtFree;
  const mDelta = (months !== null && bMonths !== null)
    ? { n: months - bMonths, text: months === bMonths ? '' : Math.abs(months - bMonths) + ' month' +
        (Math.abs(months - bMonths) === 1 ? '' : 's') + (months < bMonths ? ' sooner' : ' later') } : null;
  const iDelta = { n: alt.projection.totalInterest - base.projection.totalInterest,
    text: money(Math.abs(r2(alt.projection.totalInterest - base.projection.totalInterest))) +
      (alt.projection.totalInterest < base.projection.totalInterest ? ' less interest' : ' more interest') };
  const lowAlt = Math.min(...alt.series.total), lowBase = Math.min(...base.series.total);
  const uDelta = { n: alt.peakReportedUtilization - base.peakReportedUtilization,
    text: (Math.round(Math.abs(alt.peakReportedUtilization - base.peakReportedUtilization) * 1000) / 10) +
      ' points ' + (alt.peakReportedUtilization < base.peakReportedUtilization ? 'lower' : 'higher') };

  let cmp = '';
  alt.liabilities.filter(l => l.apr != null).sort((a, b) => b.apr - a.apr).forEach(l => {
    const a = alt.projection.perLiability[l.id] || {}, b = base.projection.perLiability[l.id] || {};
    const shift = (a.payoffDn && b.payoffDn) ? Math.round((b.payoffDn - a.payoffDn) / 30.44) : null;
    cmp += '<tr><td><b>' + esc(l.name) + '</b></td>' +
      '<td class="r num">' + esc(pct1(l.apr)) + '</td>' +
      '<td class="r num">' + (b.payoffDn ? esc(fmtDY(b.payoffDn)) : '—') + '</td>' +
      '<td class="r num">' + (a.payoffDn ? esc(fmtDY(a.payoffDn)) : '—') + '</td>' +
      '<td class="r num" style="color:' + (shift > 0 ? 'var(--moss)' : 'var(--ink-2)') + '">' +
        (shift === null ? '—' : shift === 0 ? 'same' : (shift > 0 ? shift + ' mo sooner' : Math.abs(shift) + ' mo later')) +
      '</td></tr>';
  });

  const warn = alt.breaches.length || alt.lates.length || alt.shortfalls.length;

  return '<div class="wrap">' +
    '<div class="page-head"><p class="eyebrow">Move the inputs, watch the plan</p><h2>What if</h2>' +
      '<p class="sub">Everything below is recomputed by the same engine that builds the real schedule — ' +
      'no shortcuts, no separate math. Numbers compare against ' + esc(plan.profile.name) + '&rsquo;s current settings.</p></div>' +

    (warn ? '<div class="note" style="border-left-color:var(--alert);background:var(--alert-soft)">' +
      '<b>These settings break the plan.</b> ' + alt.breaches.length + ' day(s) below the floor, ' +
      alt.lates.length + ' late payment(s), ' + alt.shortfalls.length + ' underpaid minimum(s). ' +
      'Lower the buffer floor or free up more each month.</div>' : '') +

    '<div class="card"><header><h3>Inputs</h3></header><div class="controls">' +
      '<div class="ctl"><label for="wExtra">Free up extra each month</label>' +
        '<p class="hint">Money you stop spending elsewhere. It behaves like certain income.</p>' +

/* ============================================================ edit plumbing */

const ENT_LIST = { account: 'accounts', liability: 'liabilities', income: 'incomeStreams', expense: 'expenses' };

function findEntity(ent, id) {
  if (ent === 'settings') return state.myProfile.settings;
  if (ent === 'meta') return state.myProfile.profile;
  const list = state.myProfile[ENT_LIST[ent]];
  return list && list.find(x => x.id === id);
}

/** Apply one field edit. Numbers stay as typed rather than being clamped on
 *  the spot — normalizeProfile() enforces ranges on the way into the engine,
 *  so the editor never fights the person typing. */
function applyEdit(ent, id, f, el) {
  const obj = findEntity(ent, id);
  if (!obj) return false;
  let touchesBalance = false;

  if (f === 'history') {
    const nums = el.value.split(/[\s,;]+/).map(x => parseFloat(x)).filter(x => Number.isFinite(x) && x > 0);
    state.myProfile.depositHistory[id] = nums;
    return false;
  }
  if (el.type === 'checkbox') { obj[f] = el.checked; return false; }

  if (f === 'aprPct') {
    obj.apr = el.value === '' ? null : Math.max(0, parseFloat(el.value) || 0) / 100;
    return false;
  }
  if (el.type === 'number') {
    if (el.value === '') {
      obj[f] = (f === 'statementCloseDay' || f === 'creditLimit') ? null : 0;
    } else {
      obj[f] = parseFloat(el.value);
      if (!Number.isFinite(obj[f])) obj[f] = 0;
    }
    if (f === 'balance' && ent === 'account') touchesBalance = true;
  } else {
    obj[f] = el.value;
  }

  // Switching a debt to rent/utility drops the fields that no longer apply.
  if (ent === 'liability' && f === 'kind') {
    if (NO_BALANCE_KINDS.indexOf(obj.kind) >= 0) { obj.balance = 0; obj.apr = null; }
    else if (obj.apr == null) obj.apr = 0;
    if (obj.kind !== 'credit_card') { obj.statementCloseDay = null; obj.creditLimit = null; }
  }
  return touchesBalance;
}

function addEntity(ent) {
  const p = state.myProfile;
  const firstChk = (p.accounts.find(a => a.type === 'checking') || p.accounts[0] || {}).id;
  if (ent === 'account') p.accounts.push({ id: uid('acct'), name: '', type: 'checking', balance: 0 });
  if (ent === 'liability') p.liabilities.push({
    id: uid('liab'), name: '', kind: 'credit_card', balance: 0, apr: 0.2299,
    minimumPayment: 0, dueDayOfMonth: 15, statementCloseDay: 19, creditLimit: null,
    autopayEnabled: false, accountId: firstChk
  });
  if (ent === 'income') p.incomeStreams.push({
    id: uid('inc'), label: '', cadence: 'biweekly', amount: 0, dayOfMonth: 1,
    weekday: 5, confidence: 'certain', accountId: firstChk
  });
  if (ent === 'expense') p.expenses.push({
    id: uid('exp'), label: '', amount: 0, cadence: 'monthly', dayOfMonth: 1,
    weekday: 1, accountId: firstChk, category: 'other'
  });
}

function removeEntity(ent, id) {
  const p = state.myProfile;
  const key = ENT_LIST[ent];
  p[key] = p[key].filter(x => x.id !== id);
  if (ent === 'income') delete p.depositHistory[id];
  if (ent === 'account') {
    // Anything pointing at a deleted account falls back to the first one left.
    const fallback = (p.accounts.find(a => a.type === 'checking') || p.accounts[0] || {}).id;
    ['liabilities', 'incomeStreams', 'expenses'].forEach(k =>
      p[k].forEach(x => { if (x.accountId === id) x.accountId = fallback; }));
  }
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const data = parsed && parsed.data ? parsed.data : parsed;
        if (!data || !Array.isArray(data.accounts)) throw new Error('not a plan backup');
        state.myProfile = data;
        ['accounts', 'liabilities', 'incomeStreams', 'expenses'].forEach(k => {
          if (!Array.isArray(state.myProfile[k])) state.myProfile[k] = [];
        });
        if (!state.myProfile.depositHistory) state.myProfile.depositHistory = {};
        if (!state.myProfile.profile) state.myProfile.profile = { id: 'mine', name: '' };
        if (!state.myProfile.settings) state.myProfile.settings = blankProfile().settings;
        state.profileId = 'mine';
        commit(false);
        toast('Backup loaded.');
        render();
      } catch (err) {
        toast('That file is not a plan backup.', true);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function toast(msg, bad) {
  state.toast = { msg, bad };
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; state.toast = null; }, 3200);
}

function fileStem() {
  const plan = currentPlan();
  const base = (isMine() ? (state.myProfile.profile.name || 'my-plan') : plan.profile.name || 'plan');
  return base.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + isoFromDn(START_DN);
}

function doExport(kind) {
  const plan = currentPlan();
  if (plan.__error) { toast('Nothing to export yet.', true); return; }
  if (kind === 'json') {
    download(fileStem() + '.json',
      JSON.stringify({ version: 1, savedAt: new Date().toISOString(), data: state.myProfile }, null, 2),
      'application/json');
    toast('Backup downloaded.');
  } else if (kind === 'csv') {
    download(fileStem() + '-schedule.csv', planToCSV(plan), 'text/csv');
    toast('Schedule downloaded.');
  } else if (kind === 'ics') {
    download(fileStem() + '.ics', planToICS(plan), 'text/calendar');
    toast('Calendar file downloaded — open it to add the payments to your calendar.');
  }
}

    (o.disabled ? ' disabled' : '') +
    ' value="' + esc(v == null ? '' : v) + '">';
}
function sel(ent, id, f, v, options, disabled) {
  return '<select class="fi" ' + fld(ent, id, f) + (disabled ? ' disabled' : '') + '>' +
    options.map(([val, label]) =>
      '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' +
      esc(label) + '</option>').join('') + '</select>';

function chk(ent, id, f, v, disabled) {
  return '<input type="checkbox" ' + fld(ent, id, f) + (v ? ' checked' : '') + (disabled ? ' disabled' : '') + '>';

        inp('settings', 'settings', 'bufferFloor', st.bufferFloor, { type: 'number', step: '25', min: 0, cls: 'fi num', disabled: ro }) + '</div>' +
      '<div class="ctl"><label>Order to attack debt</label>' +
        '<p class="hint">Avalanche is cheapest. Snowball closes accounts sooner.</p>' +
        sel('settings', 'settings', 'strategy', st.strategy,
            [['avalanche', 'Avalanche — highest rate first'], ['snowball', 'Snowball — smallest balance first'],
             ['hybrid', 'Hybrid — quick wins, then rate']], ro) + '</div>' +
      '<div class="ctl"><label>Statement timing</label>' +
        '<p class="hint">Pay cards before the statement closes so a lower balance gets reported.</p>' +
        '<label class="toggle" style="font-weight:400">' + chk('settings', 'settings', 'optimizeForCreditScore', st.optimizeForCreditScore, ro) +
        'Optimise for reported utilization</label></div>' +
      '<div class="ctl"><label for="sHorizon">How far ahead to plan</label>' +
        '<p class="hint">Days. 90 is the sweet spot; longer gets speculative.</p>' +
        inp('settings', 'settings', 'horizonDays', st.horizonDays, { type: 'number', min: 30, max: 365, cls: 'fi num', disabled: ro }) + '</div>' +
    '</div></div>' +

    (editable ? '<div class="card"><header><h3>Start over</h3>' +
      '<span class="aside">both of these replace what is here — export a backup first if you want one</span></header>' +
      '<div class="body">' +
      '<p class="hint" style="margin:0 0 10px">Replace my plan with a worked example, then edit it:</p>' +
      '<div class="btnrow" style="margin-bottom:16px">' +
        PERSONA_IDS.map(id => '<button class="btn" data-copy-persona="' + id + '">' +
          esc(PERSONAS[id].profile.name) + '</button>').join('') +
      '</div>' +
      '<button class="btn danger" data-action="reset">Erase everything and start again</button>' +
      '</div></div>' : '') +
  '</div>';
}

function onboarding() {
  return '<div class="wrap">' +
    '<div class="page-head"><p class="eyebrow">Nothing saved yet</p><h2>Set up your plan</h2>' +
    '<p class="sub">Two ways in. Either works — you can change everything afterwards, and nothing you type ' +
    'leaves this browser.</p></div>' +
    '<div class="card"><header><h3>Start from scratch</h3></header><div class="body">' +
      '<p style="margin:0 0 14px;max-width:64ch;color:var(--ink-2)">You will need, roughly in this order: your ' +
      'checking balance, each debt with its balance, APR, minimum and due day, your income and when it lands, ' +
      'and what you actually spend in a normal month. Ten minutes, once.</p>' +
      '<button class="btn primary" data-action="start-blank">Start with an empty plan</button></div></div>' +
    '<div class="card"><header><h3>Start from an example and edit it</h3>' +
      '<span class="aside">faster if your situation resembles one of them</span></header><div class="body flush">' +
      PERSONA_IDS.map(id => {
        const pr = PERSONAS[id].profile;
        return '<div class="row"><div class="what"><b>' + esc(pr.name) + '</b>' +
          '<span class="chip">' + esc(pr.tagline) + '</span></div>' +
          '<div class="amt"><button class="btn" data-copy-persona="' + id + '">Use as a starting point</button></div>' +
          '<div class="why">' + esc(pr.note) + '</div></div>';
      }).join('') +
    '</div></div>' +
    '<div class="card"><header><h3>Already have a backup</h3></header><div class="body">' +
      '<button class="btn" data-action="import-json">Load a backup file</button></div></div>' +
  '</div>';
}

/* ================================================================== render */

function render() {
  renderChrome();
  const el = document.getElementById('view');
  if (state.view === 'money')  { el.innerHTML = viewMoney(); window.scrollTo(0, 0); return; }
  if (state.view === 'tests')  { el.innerHTML = viewTests(); window.scrollTo(0, 0); return; }

  const plan = currentPlan();
  if (plan.__error) {
    el.innerHTML = '<div class="wrap"><div class="page-head"><h2>No plan yet</h2>' +
      '<p class="sub">' + esc(plan.__error) + '</p></div>' +
      '<div class="card"><div class="empty"><b>Set your money up first.</b>' +
      'Once there is an account and something to pay, this fills in on its own.<br><br>' +
      '<button class="btn primary" data-view="money">Open Your money</button></div></div></div>';
    window.scrollTo(0, 0);
    return;
  }
  el.innerHTML =
    state.view === 'week' ? viewWeek(plan) :
    state.view === 'timeline' ? viewTimeline(plan) :
    state.view === 'debts' ? viewDebts(plan) : viewWhatIf(plan);
  window.scrollTo(0, 0);
}

function rerenderWhatIf() {
  document.getElementById('view').innerHTML = viewWhatIf(currentPlan());
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if (nav) { state.view = nav.dataset.view; render(); return; }
  const per = e.target.closest('[data-profile]');
  if (per) { state.profileId = per.dataset.profile; state.whatif = null; render(); return; }
  const strat = e.target.closest('[data-strategy]');
  if (strat) { state.whatif.strategy = strat.dataset.strategy; rerenderWhatIf(); return; }

  const copy = e.target.closest('[data-copy-persona]');
  if (copy) {
    if (hasOwnData() && !confirm('This replaces everything currently in your plan. Export a backup first if you need one.\n\nReplace it?')) return;
    state.myProfile = profileFromPersona(copy.dataset.copyPersona);
    state.myProfile.profile.startedAt = new Date().toISOString();
    state.profileId = 'mine'; state.view = 'money'; state.whatif = null;
    commit(true); toast('Copied. Edit anything you like.'); render(); return;
  }

  const add = e.target.closest('[data-add]');
  if (add) { addEntity(add.dataset.add); commit(false); render(); return; }

  const del = e.target.closest('[data-del-ent]');
  if (del) { removeEntity(del.dataset.delEnt, del.dataset.delId); commit(false); render(); return; }

  const act = e.target.closest('[data-action]');
  if (act) {
    const a = act.dataset.action;
    if (a === 'start-blank') {
      state.myProfile = blankProfile();
      state.myProfile.profile.startedAt = new Date().toISOString();
      commit(true); render();
    }
    else if (a === 'stamp') { commit(true); toast('Balances marked as current.'); render(); }
    else if (a === 'export-json') doExport('json');
    else if (a === 'export-csv') doExport('csv');
    else if (a === 'export-ics') doExport('ics');
    else if (a === 'import-json') importBackup();
    else if (a === 'print') window.print();
    else if (a === 'reset') {
      if (confirm('Erase everything saved in this browser and start again?')) {
        clearProfile(); state.myProfile = blankProfile(); state.whatif = null;
        commit(false); state.myProfile.profile.balancesAsOf = null; render();
      }
    }
    return;
  }
});

/* Field edits commit on change (blur / select / checkbox), not per keystroke:
   the plan rebuild is too expensive to run on every character, and re-rendering
   mid-word would steal the caret. */
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.ent || !isMine()) return;
  const touched = applyEdit(el.dataset.ent, el.dataset.id, el.dataset.f, el);
  commit(touched);
  const focusKey = el.dataset.ent + '|' + el.dataset.id + '|' + el.dataset.f;
  render();
  const back = document.querySelector('[data-ent="' + el.dataset.ent + '"][data-id="' + el.dataset.id +
    '"][data-f="' + el.dataset.f + '"]');
  if (back && focusKey) back.focus();
});

document.addEventListener('input', e => {
  if (e.target.id === 'wExtra') {
    state.whatif.extraMonthly = +e.target.value;
    document.getElementById('wExtraOut').textContent = money0(state.whatif.extraMonthly);
    scheduleWhatIf();
  } else if (e.target.id === 'wFloor') {
    state.whatif.bufferFloor = +e.target.value;
    document.getElementById('wFloorOut').textContent = money0(state.whatif.bufferFloor);
    scheduleWhatIf();
  } else if (e.target.id === 'wUtil') {
    state.whatif.optimizeForCreditScore = e.target.checked;
    rerenderWhatIf();
  }
});

let whatIfPending = false;
function scheduleWhatIf() {
  if (whatIfPending) return;
  whatIfPending = true;
  requestAnimationFrame(() => {
    whatIfPending = false;
    const focus = document.activeElement && document.activeElement.id;
    rerenderWhatIf();
    if (focus) { const n = document.getElementById(focus); if (n) n.focus(); }
  });
}

/* Tests run before the first paint. If the engine is wrong, the user is told
   at the top of the screen, not in a console they will never open. */
state.testResults = runTests();

state.myProfile = loadProfile() || blankProfile();
['accounts', 'liabilities', 'incomeStreams', 'expenses'].forEach(k => {
  if (!Array.isArray(state.myProfile[k])) state.myProfile[k] = [];
});
if (!state.myProfile.depositHistory) state.myProfile.depositHistory = {};
if (!state.myProfile.settings) state.myProfile.settings = blankProfile().settings;
if (!state.myProfile.profile) state.myProfile.profile = { id: 'mine', name: '', balancesAsOf: null };

// First run lands on setup; a returning user lands on their week.
if (!hasOwnData()) state.view = 'money';
render();

</script>
</body>
</html>
