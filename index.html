<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090c">
<meta name="color-scheme" content="dark">
<title>Ground Stop</title>
<style>
  /* Everything is drawn on the canvas. The DOM exists only to host it and to
     hold the safe-area insets, which CSS can read and JS cannot. */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #07090c;
    overflow: hidden;
    /* No double-tap zoom, no pull-to-refresh, no text selection, no callout. */
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  #stage { position: fixed; inset: 0; display: block; }
  /* Probe element: JS reads its computed padding to learn the safe-area insets. */
  #insets {
    position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden;
    padding: var(--sat) var(--sar) var(--sab) var(--sal);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="insets"></div>
<script>
"use strict";
(function () {
// ===========================================================================
//  GROUND STOP
//  A 2D airline crisis-management game. One file, no dependencies, canvas 2D.
//
//  Structure, top to bottom:
//    1. Config          — every tunable number, in one place
//    2. Utilities       — rng, time and money formatting
//    3. Network         — the airports and the fixed daily schedule
//    4. World gen       — starting a run, building a day
//    5. Simulation      — the tick: transitions, disruption, cascade, crew
//    6. Economy         — settling a day, reputation, the wire report
//    7. Actions         — what the player can actually do
//    8. Audio           — synthesized, no files
//    9. Board           — the split-flap model
//   10. Render          — all of it
//   11. Input           — taps and drags
//   12. Loop            — rAF, visibility, boot
//
//  The simulation never touches the canvas or the audio context, so it can be
//  run headless. See tools/simcheck.mjs.
// ===========================================================================

var HEADLESS = (typeof document === "undefined");

// ---------------------------------------------------------------------------
// 1. CONFIG
//
// First-pass numbers. Expect to change all of them after playing. The ones
// that matter most for feel are marked.
// ---------------------------------------------------------------------------

var CFG = {
  // --- Time ---
  DAY_START: 360,          // 06:00, in minutes since midnight
  DAY_END: 1440,           // 24:00
  AUTO_CANCEL_AT: 1380,    // 23:00 — anything still stuck is written off
  MS_PER_MINUTE: 100,      // at 1x speed. A day is 108s at 1x, 54s at 2x.

  // --- Season ---
  SEASON_DAYS: 30,
  CALM_DAYS: 3,            // no weather at all for this long — a place to learn
  WINTER_FROM: 20,         // weather gets meaner from here
  BANKRUPT_DAYS: 2,        // consecutive days at cash < 0

  // --- Fleet ---
  SEATS: 150,
  MAINTENANCE_DUE_HOURS: 400,
  RELIABILITY_PER_DEFERRAL: 0.08,

  // --- Crew ---
  DUTY_LIMIT: 840,         // 14h from report
  FLIGHT_LIMIT: 540,       // 9h of block time
  REPORT_BEFORE: 60,       // report this long before first departure
  DEBRIEF_AFTER: 15,
  REST_MINS: 600,          // 10h between duty periods
  RESERVES_PER_DAY: 2,

  // --- Passengers ---
  MISCONNECT_MINS: 45,     // less than this between legs and they miss it
  CONNECT_SHARE: 0.55,     // share of hub-inbound traffic that is connecting

  // --- Economy (tune these first) ---
  //
  // Calibrated so a PERFECT day at the starting reputation of 70 breaks exactly
  // even. Everything above 70 is profit, everything below bleeds, and the whole
  // season is the fight to stay on the right side of that line. Break-even
  // lands at roughly 82% on time, which is where it should be.
  START_CASH: 250000,
  REVENUE_PER_PAX_LEG: 120,
  FUEL_PER_FLIGHT: 8200,
  CREW_PER_FLIGHT: 3500,
  // A late aeroplane costs money even when it eventually goes: crew on the
  // clock, fuel burnt holding, and the recovery downline. Without this line
  // punctuality has no price, the second half of the season is more profitable
  // than the first, and "break-even at 82% on time" is not true of anything.
  // Charged per minute of arrival delay beyond the on-time threshold.
  DELAY_COST_PER_MIN: 80,
  GATE_LEASE_PER_AIRPORT: 2200,
  AIRCRAFT_LEASE_PER_DAY: 5200,
  CANCEL_REBOOK_PER_PAX: 40,
  STRAND_PER_PAX: 180,
  RESERVE_ACTIVATION: 5000,
  MAINTENANCE_CHECK: 28000,

  // --- Reputation ---
  //
  // Reputation drives the load factor, which drives everything. It has to be
  // slow to earn and quick to lose, or the up-spiral runs away as badly as the
  // down-spiral does. The daily drift is the market forgetting you: standing
  // still costs half a point a day.
  START_REP: 70,
  REP_ONTIME_BONUS: 2,
  REP_ONTIME_THRESHOLD: 0.90,
  REP_PER_CANCELLATION: -3,
  REP_PER_100_MISCONNECT: -1,
  REP_PER_100_STRANDED: -4,
  REP_CLEAN_DAY: 1,        // zero cancellations AND nobody left overnight
  // The drift is regression to the mean, and it is steeper the higher you
  // climb: a good reputation is expensive to hold and cheap to slide from.
  REP_DRIFT: -0.4,
  REP_DRIFT_ABOVE: -0.035, // per point of reputation above the starting 70
  ONTIME_THRESHOLD_MINS: 15, // "on time" means within this of schedule

  // --- Disruption (tuned for 2-4 on a normal day, 8+ on a bad one) ---
  // The three chances below scale with the season alongside the weather, so
  // week four is a different game from week one.
  MECH_BASE: 0.018,        // chance per departure at reliability 1.0
  MECH_SEASON: 0.012,      // added at full season severity
  MECH_PER_UNRELIABILITY: 0.15,
  MECH_REPAIR_MIN: 45,
  MECH_REPAIR_MAX: 180,
  SICK_CHANCE_PER_DAY: 0.15,
  SICK_SEASON: 0.15,
  GROUNDSTOP_CHANCE_PER_DAY: 0.45,
  GROUNDSTOP_SEASON: 0.35,
  GROUNDSTOP_MIN: 30,
  GROUNDSTOP_MAX: 90,
  GATE_HOLD_STEP: 10,      // taxiway hold, retried in these increments
  GATE_HOLD_MAX: 60,       // after this it parks on a remote stand instead

  // --- Presentation ---
  CASCADE_STEP_MS: 380,    // beat between rows as a cascade spreads
  FLAP_CHAR_MS: 300,       // budget for one character to reach its target
  FLAP_STAGGER_MS: 26,     // extra budget per character, left to right
  MAX_CLICKS_PER_FRAME: 8
};

// The split-flap wheel. Order matters: characters flip forward through this
// sequence, exactly like the real thing.
var FLAP = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:+-/%$.";
var FLAP_INDEX = {};
for (var fi = 0; fi < FLAP.length; fi++) FLAP_INDEX[FLAP[fi]] = fi;

var COLORS = {
  bg: "#07090c",
  board: "#0a0e13",
  rowAlt: "#0c1117",
  rule: "#161d26",
  bone: "#e8e4d9",
  dim: "#5c6572",
  dimmer: "#3a424e",
  head: "#8fa3b8",
  green: "#4ee38a",
  amber: "#f2b544",
  red: "#ff5a4e",
  blue: "#5fa8d8",
  paper: "#e8e2d4",
  ink: "#14161a",
  panel: "#111720",
  panelEdge: "#232c39"
};

// ---------------------------------------------------------------------------
// 2. UTILITIES
// ---------------------------------------------------------------------------

// Mulberry32. Small, fast, good enough, and seedable — which matters because a
// run should be reproducible from its seed for debugging and for sharing.
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashSeed(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function randInt(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }

// Minutes since midnight to HHMM. Wraps past 24:00 so a 01:20 arrival on a
// flight that left at 23:40 still reads sensibly.
function hhmm(mins) {
  var m = ((Math.round(mins) % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  return (h < 10 ? "0" : "") + h + (mm < 10 ? "0" : "") + mm;
}

function hhmmColon(mins) {
  var s = hhmm(mins);
  return s.slice(0, 2) + ":" + s.slice(2);
}

function durStr(mins) {
  var m = Math.max(0, Math.round(mins));
  var h = Math.floor(m / 60);
  return h > 0 ? (h + "h" + (m % 60 < 10 ? "0" : "") + (m % 60)) : (m + "m");
}

function money(n) {
  var neg = n < 0;
  var v = Math.abs(Math.round(n));
  var s = "";
  while (v >= 1000) { s = "," + String(v % 1000).padStart(3, "0") + s; v = Math.floor(v / 1000); }
  s = String(v) + s;
  return (neg ? "-$" : "$") + s;
}

function moneyShort(n) {
  var v = Math.abs(Math.round(n));
  var sign = n < 0 ? "-" : "";
  if (v >= 1000000) return sign + "$" + (v / 1000000).toFixed(2) + "M";
  if (v >= 10000) return sign + "$" + Math.round(v / 1000) + "K";
  return sign + money(v).replace("$", "$");
}

function padRight(s, n) { s = String(s); return s.length >= n ? s.slice(0, n) : s + " ".repeat(n - s.length); }
function padLeft(s, n) { s = String(s); return s.length >= n ? s.slice(0, n) : " ".repeat(n - s.length) + s; }

// ---------------------------------------------------------------------------
// 3. NETWORK
//
// One hub, eight spokes, six aircraft. The schedule is FIXED for the whole
// season and generated once at run start: the player is meant to learn this
// network — which turns are tight, which crews have no duty margin — and that
// only works if it stops moving.
// ---------------------------------------------------------------------------

var HUB = "DEN";

var AIRPORT_DEFS = [
  // code, name, x, y (normalized map position), gates
  ["DEN", "DENVER",      0.36, 0.40, 5],
  ["SEA", "SEATTLE",     0.10, 0.10, 2],
  ["LAX", "LOS ANGELES", 0.09, 0.55, 2],
  ["SLC", "SALT LAKE",   0.24, 0.30, 2],
  ["PHX", "PHOENIX",     0.22, 0.62, 2],
  ["MSP", "MINNEAPOLIS", 0.58, 0.20, 2],
  ["DFW", "DALLAS",      0.55, 0.72, 2],
  ["AUS", "AUSTIN",      0.54, 0.82, 2],
  ["ORD", "CHICAGO",     0.68, 0.32, 3]
];

// Each rotation is one aircraft's whole day: out and back to two spokes.
//
// The two numbers that matter are hidden in here. `turns` is ground slack —
// how much cascade a turnaround can absorb. Duty slack is what is left of the
// 14-hour clock after the rotation's block time and turns, and it decides
// whether a delay becomes a cancellation. They pull in opposite directions:
// generous turns absorb delays but eat the duty clock. Every rotation sits
// somewhere different on that line, and the player has to read which.
var ROTATION_DEFS = [
  { spokes: ["SEA", "SLC"], turns: [50, 50, 45], firstDep: 370, prefix: 1 },
  { spokes: ["AUS", "SLC"], turns: [65, 70, 65], firstDep: 400, prefix: 2 },
  { spokes: ["DFW", "PHX"], turns: [55, 65, 55], firstDep: 445, prefix: 3 },
  { spokes: ["ORD", "MSP"], turns: [30, 35, 30], firstDep: 540, prefix: 4 },
  { spokes: ["LAX", "PHX"], turns: [55, 60, 58], firstDep: 660, prefix: 5 },
  { spokes: ["LAX", "SLC"], turns: [40, 45, 44], firstDep: 740, prefix: 6 }
];

var TAILS = ["N412GS", "N118GS", "N207GS", "N340GS", "N561GS", "N688GS"];

// Staggered so maintenance checks come due roughly every five days rather than
// all at once. Deferring one shifts the whole rhythm, which is the point.
var START_HOURS_SINCE_CHECK = [341, 302, 256, 214, 173, 121];

function airportDistance(a, b) {
  var dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// Block time in minutes. Tuned so no rotation exceeds the 9-hour flight-time
// limit while still spanning enough of the day for the duty limit to bite.
function blockMinutes(a, b) {
  return Math.round((55 + airportDistance(a, b) * 230) / 5) * 5;
}

// ---------------------------------------------------------------------------
// 4. WORLD GENERATION
// ---------------------------------------------------------------------------

// Weather is a WINDOW, not a tax. A storm that adds ninety minutes to every
// departure from the hub for eighteen hours is not a bad day, it is an
// unplayable one — and it makes the forecast useless, because there is nothing
// to plan around. A front that sits over the field from 10:00 to 14:00 is
// something you can schedule against, cancel into, and recover from.
var WEATHER = {
  clear: { label: "CLEAR", min: 0,  max: 0,  spanMin: 0,   spanMax: 0 },
  rain:  { label: "RAIN",  min: 8,  max: 20, spanMin: 120, spanMax: 240 },
  snow:  { label: "SNOW",  min: 15, max: 40, spanMin: 180, spanMax: 360 },
  storm: { label: "STORM", min: 30, max: 75, spanMin: 120, spanMax: 300 }
};

var state = null;

function newRun(seedStr) {
  var seed = hashSeed(seedStr || String(Date.now()));
  var rng = makeRng(seed);

  var airports = AIRPORT_DEFS.map(function (d) {
    return {
      code: d[0], name: d[1], x: d[2], y: d[3],
      isHub: d[0] === HUB,
      gates: d[4],
      weather: "clear",
      weatherDelayMins: 0,
      wxFrom: 0, wxUntil: 0,
      // Tomorrow's forecast, visible today. Storms are announced a day out so
      // that a bad day is something you prepare for, not something you're told.
      forecast: "clear",
      forecastDelayMins: 0,
      fcFrom: 0, fcUntil: 0
    };
  });

  var aircraft = TAILS.map(function (tail, i) {
    return {
      tail: tail,
      seats: CFG.SEATS,
      location: HUB,
      status: "idle",
      hoursSinceCheck: START_HOURS_SINCE_CHECK[i],
      maintenanceDue: CFG.MAINTENANCE_DUE_HOURS,
      deferredCount: 0,
      reliability: 1.0,
      groundedUntil: null,     // minute the repair finishes
      outOfServiceDay: 0,      // day this tail is in the hangar
      rotation: i
    };
  });

  // Eight crews for six rotations. The two spares are what stop a single sick
  // call from writing off a whole rotation — and they are finite, which is the
  // entire decision.
  var crews = [];
  for (var c = 0; c < 8; c++) {
    crews.push({
      id: "C" + (c + 1),
      location: HUB,
      reportTime: 0,
      dutyLimit: CFG.DUTY_LIMIT,
      flightMinsToday: 0,
      flightLimit: CFG.FLIGHT_LIMIT,
      assignedTo: null,        // rotation index
      status: "reserve",       // active | resting | reserve | timedout
      availableFrom: 0,        // earliest report time today, from last night's rest
      lastArrival: 0
    });
  }

  state = {
    seed: seed,
    seedStr: seedStr || String(seed),
    day: 1,
    clock: CFG.DAY_START,
    speed: 2,
    paused: true,
    phase: "title",            // title | day | report | maintenance | over
    cash: CFG.START_CASH,
    reputation: CFG.START_REP,
    negativeDays: 0,
    airports: airports,
    aircraft: aircraft,
    crews: crews,
    flights: [],
    passengers: [],
    procedures: [],            // stage 7, deliberately unused
    events: [],
    reservesLeft: CFG.RESERVES_PER_DAY,
    groundStops: [],           // { to, until }
    // Reputation is computed at the end of a day but not applied until the
    // next morning's report. You can fix the operation and still watch the
    // story break tomorrow.
    pendingPress: null,
    lastReport: null,
    history: [],
    rng: rng,
    dayRng: rng,
    cascadeQueue: [],
    ontimeStreak: 0
  };

  buildRoutes();
  rollWeatherFor(state, 1, true);
  buildDay(state);
  return state;
}

function airport(code) {
  for (var i = 0; i < state.airports.length; i++) {
    if (state.airports[i].code === code) return state.airports[i];
  }
  return null;
}

// The fixed season schedule: for each rotation, four legs out and back to two
// spokes, with the turn times from ROTATION_DEFS.
var ROUTES = null;

function buildRoutes() {
  ROUTES = ROTATION_DEFS.map(function (def, idx) {
    var hub = airport(HUB);
    var legs = [];
    var t = def.firstDep;
    var order = [def.spokes[0], def.spokes[0], def.spokes[1], def.spokes[1]];
    for (var i = 0; i < 4; i++) {
      var outbound = (i % 2 === 0);
      var spoke = airport(order[i]);
      var from = outbound ? HUB : spoke.code;
      var to = outbound ? spoke.code : HUB;
      var block = blockMinutes(hub, spoke);
      legs.push({
        num: def.prefix * 100 + (i + 1) * 2,   // GS102, GS104, ...
        from: from, to: to,
        schedDep: t, schedArr: t + block,
        block: block,
        turnBefore: i === 0 ? 0 : def.turns[i - 1]
      });
      t = t + block + (i < 3 ? def.turns[i] : 0);
    }
    var blockTotal = legs.reduce(function (s, l) { return s + l.block; }, 0);
    var span = legs[3].schedArr - legs[0].schedDep;
    return {
      index: idx,
      tail: TAILS[idx],
      legs: legs,
      blockTotal: blockTotal,
      span: span,
      reportTime: def.firstDep - CFG.REPORT_BEFORE,
      // How much of the 14-hour duty clock is left over once the rotation runs
      // exactly to schedule. This is the number that decides whether a delay
      // becomes a cancellation.
      dutySlack: CFG.DUTY_LIMIT - (span + CFG.REPORT_BEFORE + CFG.DEBRIEF_AFTER)
    };
  });
}

// How rough the season is allowed to get. The first two days are clear on
// purpose: a player learning the board should not lose to a hub storm on day
// one, and the run needs somewhere to fall from.
function severityFor(day) {
  if (day <= CFG.CALM_DAYS) return 0;
  var ramp = Math.min(1, (day - CFG.CALM_DAYS) / 16);
  // Winter pushes severity past 1.0, which is what makes the last ten days a
  // different game rather than more of the same one.
  var winter = day >= CFG.WINTER_FROM ? Math.min(1.2, (day - CFG.WINTER_FROM + 1) * 0.12) : 0;
  return ramp + winter;
}

// A front tends to persist or decay rather than vanish, so bad weather reads as
// something moving across the network over several days.
function rollWeatherFor(st, day, immediate) {
  var rng = makeRng(st.seed ^ (day * 7919));
  var sev = severityFor(day);

  st.airports.forEach(function (ap) {
    var prev = immediate ? "clear" : ap.forecast;
    var next = "clear";
    if (sev > 0) {
      var r = rng();
      if (prev === "storm")      next = r < 0.30 ? "storm" : (r < 0.70 ? "snow" : (r < 0.9 ? "rain" : "clear"));
      else if (prev === "snow")  next = r < 0.14 * sev ? "storm" : (r < 0.45 ? "snow" : (r < 0.75 ? "rain" : "clear"));
      else if (prev === "rain")  next = r < 0.08 * sev ? "snow" : (r < 0.35 ? "rain" : "clear");
      else {
        var pBad = (0.16 + (ap.isHub ? 0.04 : 0)) * sev;
        next = r < pBad * 0.22 ? "storm" : (r < pBad * 0.55 ? "snow" : (r < pBad ? "rain" : "clear"));
      }
    }

    var w = WEATHER[next];
    var mins = 0, from = 0, until = 0;
    if (w.max > 0) {
      // Magnitude scales with the season too, so the same storm is worse in
      // week four than in week one.
      mins = Math.round(randInt(rng, w.min, w.max) * (0.55 + 0.45 * Math.min(2.2, sev)));
      var span = randInt(rng, w.spanMin, w.spanMax);
      from = randInt(rng, CFG.DAY_START, Math.max(CFG.DAY_START, CFG.AUTO_CANCEL_AT - span));
      until = from + span;
    }

    if (immediate) {
      ap.weather = next; ap.weatherDelayMins = mins; ap.wxFrom = from; ap.wxUntil = until;
    }
    ap.forecast = next; ap.forecastDelayMins = mins; ap.fcFrom = from; ap.fcUntil = until;
  });
}

function applyForecast(st) {
  st.airports.forEach(function (ap) {
    ap.weather = ap.forecast;
    ap.weatherDelayMins = ap.forecastDelayMins;
    ap.wxFrom = ap.fcFrom;
    ap.wxUntil = ap.fcUntil;
  });
}

// Minutes added to a departure leaving `code` at minute `at`, or zero if the
// front has not arrived yet or has already moved on.
function weatherDelayAt(st, code, at) {
  var ap = airport(code);
  if (!ap || ap.weatherDelayMins <= 0) return 0;
  return (at >= ap.wxFrom && at < ap.wxUntil) ? ap.weatherDelayMins : 0;
}

function weatherActive(ap, clock) {
  return ap.weatherDelayMins > 0 && clock >= ap.wxFrom && clock < ap.wxUntil;
}

// Load factor is the whole reason reputation matters. Lose the public and you
// fly empty aeroplanes at the same cost.
function loadFactor(st) {
  return 0.5 + (st.reputation / 100) * 0.45;
}

function buildDay(st) {
  var rng = makeRng(st.seed ^ (st.day * 104729));
  st.dayRng = rng;
  st.clock = CFG.DAY_START;
  st.flights = [];
  st.passengers = [];
  st.events = [];
  st.groundStops = [];
  st.cascadeQueue = [];
  st.reservesLeft = CFG.RESERVES_PER_DAY;
  st.dayStats = null;

  // --- Crews: who is rested enough to work, and from when ---
  st.crews.forEach(function (cr) {
    cr.assignedTo = null;
    cr.flightMinsToday = 0;
    cr.status = "reserve";
    cr.reportTime = 0;
  });

  // --- Aircraft: anything in the hangar today flies nothing ---
  st.aircraft.forEach(function (ac) {
    ac.groundedUntil = null;
    ac.location = HUB;
    ac.status = ac.outOfServiceDay === st.day ? "maintenance" : "idle";
  });

  var lf = loadFactor(st);

  ROUTES.forEach(function (rot) {
    var ac = st.aircraft[rot.index];
    if (ac.status === "maintenance") return;   // no flights at all for this tail

    // Find the crew that can report earliest, preferring one who can make the
    // scheduled report time. Burning your crews late on day 8 is exactly how
    // day 9 starts an hour behind.
    var best = null;
    st.crews.forEach(function (cr) {
      if (cr.assignedTo !== null) return;
      if (best === null || cr.availableFrom < best.availableFrom) best = cr;
    });
    if (!best) return;

    var report = Math.max(rot.reportTime, best.availableFrom);
    var push = report - rot.reportTime;    // yesterday's overrun, arriving today
    best.assignedTo = rot.index;
    best.reportTime = report;
    best.status = "active";
    best.location = HUB;

    if (push > 0) {
      st.events.push({
        t: CFG.DAY_START, type: "crew", sev: 2,
        text: "CREW " + best.id + " RESTED LATE — ROTATION " + rot.tail + " PUSHED " + push + "M"
      });
    }

    rot.legs.forEach(function (leg, i) {
      st.flights.push({
        id: "GS" + leg.num,
        rotation: rot.index,
        legIndex: i,
        from: leg.from, to: leg.to,
        schedDep: leg.schedDep, schedArr: leg.schedArr,
        block: leg.block,
        turnBefore: leg.turnBefore,
        plannedDep: leg.schedDep + push,
        plannedArr: leg.schedArr + push,
        actualDep: null, actualArr: null,
        aircraft: ac.tail,
        crew: best.id,
        status: "scheduled",
        delayMins: push,
        delayReason: push > 0 ? "crew" : null,
        holdUntil: 0,          // mechanical / ground-stop / gate hold
        paxCount: 0,
        seats: ac.seats,
        cancelled: false,
        cancelCost: 0,
        revealAt: 0            // board reveal time, for the cascade animation
      });
    });
  });

  st.flights.sort(function (a, b) { return a.schedDep - b.schedDep || (a.id < b.id ? -1 : 1); });

  generatePassengers(st, rng, lf);
  st.aircraft.forEach(function (ac) { recomputeChain(st, ac.tail); });

  // --- Sick call: rolled now, lands later ---
  var sev = Math.min(2.2, severityFor(st.day));
  if (rng() < CFG.SICK_CHANCE_PER_DAY + CFG.SICK_SEASON * sev) {
    var actives = st.crews.filter(function (c) { return c.status === "active"; });
    if (actives.length) {
      var victim = pick(rng, actives);
      // Sometime after the first leg lands, so the player has a real choice
      // rather than a morning fait accompli.
      st.sickCall = { crew: victim.id, at: randInt(rng, 540, 1050), fired: false };
    }
  } else {
    st.sickCall = null;
  }

  // --- Ground stop: the one the game is named after ---
  if (rng() < CFG.GROUNDSTOP_CHANCE_PER_DAY + CFG.GROUNDSTOP_SEASON * sev) {
    var target = pick(rng, st.airports);
    st.pendingGroundStop = {
      to: target.code,
      at: randInt(rng, 480, 1140),
      mins: randInt(rng, CFG.GROUNDSTOP_MIN, CFG.GROUNDSTOP_MAX),
      fired: false
    };
  } else {
    st.pendingGroundStop = null;
  }
}

// Passenger groups, not individuals. A group either flies one leg or connects
// through the hub, and the connecting ones are what turn a delay into a
// second, separate kind of damage.
function generatePassengers(st, rng, lf) {
  var pid = 1;
  var byId = {};
  st.flights.forEach(function (f) { byId[f.id] = f; f.paxCount = 0; });

  st.flights.forEach(function (f) {
    var target = Math.round(f.seats * lf * (0.88 + rng() * 0.24));
    target = clamp(target, 20, f.seats);
    var remaining = target - f.paxCount;

    while (remaining > 12) {
      var size = clamp(randInt(rng, 8, 34), 1, remaining);
      var itinerary = [f.id];
      var fare = size * CFG.REVENUE_PER_PAX_LEG;

      // Inbound flights to the hub can feed an onward departure.
      //
      // These are banked TIGHT on purpose. A hub exists to connect people in
      // forty-five minutes, not three hours — and if the buffers are generous
      // then an inbound delay is nobody's problem and the whole passenger
      // system may as well not exist. Most groups take one of the first two
      // viable departures; the rest are spread out.
      if (f.to === HUB && rng() < CFG.CONNECT_SHARE) {
        var onward = st.flights.filter(function (g) {
          return g.from === HUB && g.id !== f.id &&
                 g.schedDep >= f.schedArr + CFG.MISCONNECT_MINS &&
                 g.schedDep <= f.schedArr + 240 &&
                 g.paxCount + size <= g.seats;
        }).sort(function (a, b) { return a.schedDep - b.schedDep; });

        if (onward.length) {
          var idx = rng() < 0.75
            ? randInt(rng, 0, Math.min(1, onward.length - 1))
            : randInt(rng, 0, onward.length - 1);
          var leg2 = onward[idx];
          itinerary.push(leg2.id);
          leg2.paxCount += size;
          fare += size * CFG.REVENUE_PER_PAX_LEG;
        }
      }

      st.passengers.push({
        id: "P" + (pid++),
        size: size,
        itinerary: itinerary,
        leg: 0,
        status: "booked",
        fareTotal: fare,
        rebooked: false
      });
      f.paxCount += size;
      remaining -= size;
    }
  });
}

// ---------------------------------------------------------------------------
// 5. SIMULATION
// ---------------------------------------------------------------------------

function flightById(st, id) {
  for (var i = 0; i < st.flights.length; i++) if (st.flights[i].id === id) return st.flights[i];
  return null;
}
function crewById(st, id) {
  for (var i = 0; i < st.crews.length; i++) if (st.crews[i].id === id) return st.crews[i];
  return null;
}
function aircraftByTail(st, tail) {
  for (var i = 0; i < st.aircraft.length; i++) if (st.aircraft[i].tail === tail) return st.aircraft[i];
  return null;
}
// The chain is keyed on the aircraft rather than the rotation, so swapping a
// tail is a single reassignment and the cascade picks it up for free.
function tailFlights(st, tail) {
  return st.flights.filter(function (f) { return f.aircraft === tail; })
                   .sort(function (a, b) { return a.schedDep - b.schedDep; });
}
function crewFlights(st, crewId) {
  return st.flights.filter(function (f) { return f.crew === crewId; })
                   .sort(function (a, b) { return a.schedDep - b.schedDep; });
}
function groundStopUntil(st, code) {
  var until = 0;
  st.groundStops.forEach(function (g) { if (g.to === code && g.until > until) until = g.until; });
  return until;
}
function gatesInUse(st, code) {
  var n = 0;
  st.aircraft.forEach(function (ac) {
    if (ac.location === code && ac.status !== "flying") n++;
  });
  return n;
}

// --- THE CASCADE ------------------------------------------------------------
//
// Everything the game is built around lives in this function. A flight's
// earliest possible departure is the latest of: its schedule, the aircraft
// getting back and turned, the aircraft being repaired, and any hold on it.
// Recomputing the whole tail chain from that rule means delays propagate
// automatically and can never get out of step with the model.
//
// Slack is what absorbs them. A 40-minute delay into a 70-minute turn simply
// disappears. Into a 30-minute turn it lands, whole, on the next flight — and
// on the one after that.
function recomputeChain(st, tail, animateFromID) {
  var legs = tailFlights(st, tail);
  var ac = aircraftByTail(st, tail);
  var animateFrom = -2;
  if (animateFromID !== undefined) {
    animateFrom = -1;
    for (var ai = 0; ai < legs.length; ai++) if (legs[ai].id === animateFromID) animateFrom = ai;
  }
  var prevArr = null;
  var moved = 0;
  var nowMs = HEADLESS ? 0 : perfNow();

  for (var i = 0; i < legs.length; i++) {
    var f = legs[i];
    if (f.status === "cancelled") continue;

    if (f.status === "arrived") { prevArr = f.actualArr; continue; }
    if (f.status === "departed") { prevArr = f.actualDep + f.block; continue; }

    var base = f.schedDep;
    if (prevArr !== null) base = Math.max(base, prevArr + f.turnBefore);
    if (ac && ac.groundedUntil) base = Math.max(base, ac.groundedUntil);
    if (f.holdUntil) base = Math.max(base, f.holdUntil);

    // Departure weather is additive, but only while the front is actually over
    // the field. Push a flight past the back edge of the window and it goes.
    base += weatherDelayAt(st, f.from, base);

    // A ground stop holds everything bound for one airport.
    var gs = groundStopUntil(st, f.to);
    if (gs > base) base = gs;

    var before = f.plannedDep;
    f.plannedDep = base;
    f.plannedArr = base + f.block;
    f.delayMins = Math.max(0, base - f.schedDep);

    if (f.delayMins > 0 && !f.delayReason) f.delayReason = "knock-on";
    if (f.delayMins === 0) f.delayReason = null;

    // Reveal downstream rows one beat at a time. The model is already correct;
    // this only staggers when the board is allowed to show it, so the player
    // watches the infection spread instead of being handed the result.
    if (animateFrom > -2 && i > animateFrom && before !== f.plannedDep) {
      moved++;
      f.revealAt = nowMs + moved * CFG.CASCADE_STEP_MS;
    }

    prevArr = f.plannedArr;
  }
  return moved;
}

function crewLegality(st, f, at) {
  var cr = crewById(st, f.crew);
  if (!cr) return { ok: false, why: "no crew" };
  if (cr.status === "timedout") return { ok: false, why: "crew unavailable" };
  var projArr = at + f.block;
  if (projArr > cr.reportTime + cr.dutyLimit) {
    return { ok: false, why: "duty limit " + hhmmColon(cr.reportTime + cr.dutyLimit) };
  }
  if (cr.flightMinsToday + f.block > cr.flightLimit) {
    return { ok: false, why: "flight time limit" };
  }
  return { ok: true };
}

function logEvent(st, type, sev, text, cost) {
  st.events.push({ t: st.clock, type: type, sev: sev, text: text, cost: cost || 0 });
  if (st.events.length > 400) st.events.shift();
  if (sev >= 3) { st.alert = { text: text, at: HEADLESS ? 0 : perfNow(), sev: sev }; audioAlarm(); }
  else if (sev >= 2) { st.alert = { text: text, at: HEADLESS ? 0 : perfNow(), sev: sev }; }
}

// One in-game minute.
function simTick(st) {
  st.clock += 1;

  fireTimedDisruptions(st);
  expireGroundStops(st);

  // Flights are processed in departure order so that a knock-on computed this
  // minute is visible to the flight behind it in the same minute.
  var list = st.flights.slice().sort(function (a, b) { return a.plannedDep - b.plannedDep; });
  for (var i = 0; i < list.length; i++) stepFlight(st, list[i]);

  if (st.clock >= CFG.AUTO_CANCEL_AT) sweepStragglers(st);
  if (st.clock >= CFG.DAY_END) { landStragglers(st); endOfDay(st); }
}

function stepFlight(st, f) {
  if (f.status === "cancelled" || f.status === "arrived") return;
  var ac = aircraftByTail(st, f.aircraft);

  if (f.status === "scheduled" || f.status === "boarding" || f.status === "delayed") {
    // Boarding starts 30 minutes out, but only if the aeroplane is actually
    // sitting there.
    if (f.status === "scheduled" && st.clock >= f.plannedDep - 30 &&
        ac && ac.location === f.from && ac.status === "idle") {
      f.status = "boarding";
      ac.status = "boarding";
    }

    if (st.clock >= f.plannedDep) {
      attemptDeparture(st, f, ac);
    } else if (f.delayMins > 0 && f.status !== "boarding") {
      f.status = "delayed";
    }
    return;
  }

  if (f.status === "departed") {
    if (st.clock >= f.actualDep + f.block + (f.gateHold || 0)) attemptArrival(st, f, ac);
  }
}

function attemptDeparture(st, f, ac) {
  if (!ac || ac.status === "maintenance") { return; }

  // The aeroplane has to be here.
  if (ac.location !== f.from || ac.status === "flying") return;

  if (ac.status === "grounded") {
    f.status = "delayed";
    f.delayReason = "mechanical";
    return;
  }

  // Mechanical failures surface at the moment of departure, which is when they
  // hurt most and when the player can still do something about it.
  if (!f.mechRolled) {
    f.mechRolled = true;
    var p = CFG.MECH_BASE + CFG.MECH_SEASON * Math.min(2.2, severityFor(st.day)) +
            CFG.MECH_PER_UNRELIABILITY * (1 - ac.reliability);
    if (st.dayRng() < p) {
      var repair = randInt(st.dayRng, CFG.MECH_REPAIR_MIN, CFG.MECH_REPAIR_MAX);
      ac.status = "grounded";
      ac.groundedUntil = st.clock + repair;
      f.delayReason = "mechanical";
      f.status = "delayed";
      logEvent(st, "mech", 3,
        ac.tail + " GROUNDED AT " + f.from + " — " + durStr(repair) + " REPAIR");
      recomputeChain(st, ac.tail, f.id);
      return;
    }
  }

  // Ground stop.
  var gs = groundStopUntil(st, f.to);
  if (gs > st.clock) {
    f.status = "delayed";
    f.delayReason = "atc";
    return;
  }

  // Crew legality. This is where a delay stops being a delay.
  var legal = crewLegality(st, f, st.clock);
  if (!legal.ok) {
    if (!f.crewBlocked) {
      f.crewBlocked = true;
      f.crewBlockReason = legal.why;
      st.crewBlocks = (st.crewBlocks || 0) + 1;
      logEvent(st, "crew", 3,
        f.id + " " + f.from + "-" + f.to + " CREW OUT OF HOURS — " + legal.why.toUpperCase());
    }
    f.status = "delayed";
    f.delayReason = "crew";
    return;
  }
  f.crewBlocked = false;

  // Departure gate must exist for the arrival end too — but a full destination
  // is handled on arrival as a taxiway hold, which is the honest behaviour.
  f.status = "departed";
  f.actualDep = st.clock;
  f.plannedArr = st.clock + f.block;
  ac.status = "flying";
  ac.location = "AIR";

  var cr = crewById(st, f.crew);
  if (cr) cr.flightMinsToday += f.block;

  st.passengers.forEach(function (p) {
    if (p.status === "booked" && p.itinerary[p.leg] === f.id) p.status = "flying";
  });

  if (f.delayMins >= CFG.ONTIME_THRESHOLD_MINS) {
    logEvent(st, "dep", 1, f.id + " OFF " + f.from + " " + f.delayMins + "M LATE");
  }
  boardFlip(f.id);
}

function attemptArrival(st, f, ac) {
  // Finite gates. A grounded aeroplane at a two-gate spoke is how one
  // mechanical becomes everybody's problem — but a flight can hold for an hour
  // and then park on a remote stand, because an aeroplane that can never land
  // is a bug, not a mechanic.
  if (gatesInUse(st, f.to) >= airport(f.to).gates && (f.gateHold || 0) < CFG.GATE_HOLD_MAX) {
    f.gateHold = (f.gateHold || 0) + CFG.GATE_HOLD_STEP;
    if (f.delayReason !== "gate") {
      f.delayReason = "gate";
      logEvent(st, "gate", 2, f.id + " HOLDING — NO GATE AT " + f.to);
    }
    return;
  }

  f.status = "arrived";
  f.actualArr = st.clock;
  f.delayMins = Math.max(0, f.actualArr - f.schedArr);
  ac.status = "idle";
  ac.location = f.to;
  ac.hoursSinceCheck += f.block / 60;

  var cr = crewById(st, f.crew);
  if (cr) cr.lastArrival = st.clock;

  settleConnections(st, f);
  var moved = recomputeChain(st, ac.tail, f.id);
  if (moved > 0 && f.delayMins >= CFG.ONTIME_THRESHOLD_MINS) {
    logEvent(st, "cascade", 2,
      f.id + " IN " + f.delayMins + "M LATE — " + moved + " DOWNSTREAM FLIGHT" + (moved === 1 ? "" : "S") + " SLIP");
  }
  boardFlip(f.id);
}

// Passengers whose journey continues. Under 45 minutes to the next gate and
// they do not make it.
function settleConnections(st, f) {
  var missed = 0, stranded = 0;
  st.passengers.forEach(function (p) {
    if (p.status !== "flying") return;
    if (p.itinerary[p.leg] !== f.id) return;

    if (p.leg >= p.itinerary.length - 1) { p.status = "arrived"; return; }

    var next = flightById(st, p.itinerary[p.leg + 1]);
    var connectMins = next ? (next.plannedDep - f.actualArr) : -1;
    if (next && next.status !== "cancelled" && connectMins >= CFG.MISCONNECT_MINS) {
      p.leg++;
      p.status = "booked";
      return;
    }

    missed += p.size;
    if (next) next.paxCount = Math.max(0, next.paxCount - p.size);
    var rebooked = rebook(st, p, next ? next.from : f.to, next ? next.to : null);
    if (!rebooked) { p.status = "stranded"; stranded += p.size; }
    else { p.status = "booked"; p.rebooked = true; }
  });

  if (missed > 0) {
    logEvent(st, "pax", stranded > 0 ? 3 : 2,
      missed + " PAX MISCONNECTED OFF " + f.id + (stranded > 0 ? " — " + stranded + " STRANDED" : ""));
  }
}

// Find a later flight with the same origin and destination and open seats.
function rebook(st, p, from, to) {
  if (!to) return false;
  var options = st.flights.filter(function (g) {
    return g.from === from && g.to === to && g.status !== "cancelled" &&
           g.status !== "departed" && g.status !== "arrived" &&
           g.plannedDep >= st.clock + CFG.MISCONNECT_MINS &&
           g.paxCount + p.size <= g.seats;
  }).sort(function (a, b) { return a.plannedDep - b.plannedDep; });

  if (!options.length) return false;
  var g = options[0];
  g.paxCount += p.size;
  p.itinerary[p.leg + 1] = g.id;
  p.leg++;
  return true;
}

// --- Timed disruption -------------------------------------------------------

function fireTimedDisruptions(st) {
  if (st.sickCall && !st.sickCall.fired && st.clock >= st.sickCall.at) {
    st.sickCall.fired = true;
    var cr = crewById(st, st.sickCall.crew);
    if (cr && cr.status === "active") {
      cr.status = "timedout";
      logEvent(st, "crew", 3, "CREW " + cr.id + " CALLED OUT SICK — ROTATION EXPOSED");
      st.flights.forEach(function (f) {
        if (f.crew === cr.id && (f.status === "scheduled" || f.status === "delayed" || f.status === "boarding")) {
          f.crewBlocked = true;
          f.crewBlockReason = "crew sick";
          f.delayReason = "crew";
          f.status = "delayed";
          boardFlip(f.id);
        }
      });
    }
  }

  var gsp = st.pendingGroundStop;
  if (gsp && !gsp.fired && st.clock >= gsp.at) {
    gsp.fired = true;
    st.groundStops.push({ to: gsp.to, until: st.clock + gsp.mins });
    logEvent(st, "atc", 3,
      "GROUND STOP " + gsp.to + " — DEPARTURES HELD " + gsp.mins + "M");
    st.aircraft.forEach(function (a) { recomputeChain(st, a.tail, null); });
  }
}

function expireGroundStops(st) {
  var before = st.groundStops.length;
  st.groundStops = st.groundStops.filter(function (g) { return g.until > st.clock; });
  if (st.groundStops.length !== before) {
    st.aircraft.forEach(function (a) { recomputeChain(st, a.tail, null); });
  }
  // Repairs finish.
  st.aircraft.forEach(function (ac) {
    if (ac.status === "grounded" && ac.groundedUntil !== null && st.clock >= ac.groundedUntil) {
      ac.status = "idle";
      ac.groundedUntil = null;
      logEvent(st, "mech", 1, ac.tail + " RETURNED TO SERVICE AT " + ac.location);
      recomputeChain(st, ac.tail, null);
    }
  });
}

// Anything still sitting on the board at 23:00 is not going tonight.
function sweepStragglers(st) {
  st.flights.forEach(function (f) {
    if (f.status === "scheduled" || f.status === "boarding" || f.status === "delayed") {
      cancelFlight(st, f, "curfew");
    }
  });
}

// Midnight. Anything still airborne lands now, so no flight can fall out of the
// day's accounting by being in the wrong state when the clock runs out.
function landStragglers(st) {
  st.flights.forEach(function (f) {
    if (f.status !== "departed") return;
    var ac = aircraftByTail(st, f.aircraft);
    f.status = "arrived";
    f.actualArr = Math.max(st.clock, f.actualDep + f.block);
    f.delayMins = Math.max(0, f.actualArr - f.schedArr);
    if (ac) { ac.status = "idle"; ac.location = f.to; ac.hoursSinceCheck += f.block / 60; }
    var cr = crewById(st, f.crew);
    if (cr) cr.lastArrival = f.actualArr;
    settleConnections(st, f);
  });
}

// ---------------------------------------------------------------------------
// 7. ACTIONS
//
// Four levers, each of which costs something. There is no button here that is
// simply good.
// ---------------------------------------------------------------------------

function notStarted(f) {
  return f.status === "scheduled" || f.status === "boarding" || f.status === "delayed";
}

// Cancelling early is cheaper than cancelling late: it frees the aeroplane and
// the crew in time to protect what is behind it. Late, it protects nothing.
function cancelFlight(st, f, reason) {
  if (!notStarted(f)) return false;
  f.status = "cancelled";
  f.cancelled = true;
  f.cancelReason = reason || "player";
  f.delayReason = null;

  var ac = aircraftByTail(st, f.aircraft);
  if (ac && ac.status === "boarding" && ac.location === f.from) ac.status = "idle";

  var stranded = 0, moved = 0;
  st.passengers.forEach(function (p) {
    if (p.status !== "booked" && p.status !== "flying") return;
    if (p.itinerary[p.leg] !== f.id) return;
    if (rebook(st, p, f.from, f.to)) {
      p.rebooked = true;
      p.status = "booked";
      moved += p.size;
    } else {
      p.status = "stranded";
      stranded += p.size;
    }
  });

  st.cancelledPax = (st.cancelledPax || 0) + f.paxCount;
  logEvent(st, "cancel", 3,
    f.id + " " + f.from + "-" + f.to + " CANCELLED" +
    (stranded > 0 ? " — " + stranded + " STRANDED" : (moved > 0 ? " — " + moved + " REBOOKED" : "")),
    f.paxCount * CFG.CANCEL_REBOOK_PER_PAX + stranded * CFG.STRAND_PER_PAX);

  if (ac) recomputeChain(st, ac.tail, f.id);
  boardFlip(f.id);
  return true;
}

// Which healthy aeroplanes are parked where this one is. Both have to be on the
// same apron: you cannot teleport a tail.
function swapCandidates(st, f) {
  return st.aircraft.filter(function (d) {
    return d.tail !== f.aircraft &&
           d.location === f.from &&
           d.status !== "flying" &&
           d.status !== "maintenance" &&
           d.status !== "grounded";
  });
}

// A true tail swap: this aeroplane's remaining trips and the donor's remaining
// trips change places. It fixes this flight and hands the donor's schedule
// whatever was wrong with this one.
function swapAircraft(st, f, donorTail) {
  var ac = aircraftByTail(st, f.aircraft);
  var donor = aircraftByTail(st, donorTail);
  if (!ac || !donor || donor.location !== f.from) return false;

  var mine = st.flights.filter(function (g) {
    return g.aircraft === ac.tail && notStarted(g) && g.schedDep >= f.schedDep;
  });
  var theirs = st.flights.filter(function (g) {
    return g.aircraft === donor.tail && notStarted(g) && g.schedDep >= f.schedDep;
  });

  mine.forEach(function (g) { g.aircraft = donor.tail; g.mechRolled = false; });
  theirs.forEach(function (g) { g.aircraft = ac.tail; g.mechRolled = false; });

  logEvent(st, "swap", 2,
    "TAIL SWAP AT " + f.from + " — " + donor.tail + " TAKES " + f.id +
    (theirs.length ? ", " + ac.tail + " TAKES " + theirs.length + " TRIP" + (theirs.length === 1 ? "" : "S") : ""));

  recomputeChain(st, ac.tail, null);
  recomputeChain(st, donor.tail, null);
  st.flights.forEach(function (g) { boardFlip(g.id); });
  return true;
}

// Hold a departure deliberately, usually to wait for a connection. Costs you
// duty clock and hands the delay to everything behind it.
function holdFlight(st, f, mins) {
  if (!notStarted(f)) return false;
  f.holdUntil = Math.max(f.holdUntil || 0, Math.max(st.clock, f.plannedDep) + mins);
  f.delayReason = "hold";
  logEvent(st, "hold", 1, f.id + " HELD " + mins + "M BY OPS");
  var ac = aircraftByTail(st, f.aircraft);
  if (ac) recomputeChain(st, ac.tail, f.id);
  return true;
}

// A fresh crew, instantly. Finite for the day and expensive, so the question is
// never whether it works — it is whether you will want it more later.
function callReserve(st, f) {
  if (st.reservesLeft <= 0) return false;
  var spare = null;
  for (var i = 0; i < st.crews.length; i++) {
    var c = st.crews[i];
    if (c.assignedTo === null && c.status !== "timedout" && c.availableFrom <= st.clock) { spare = c; break; }
  }
  if (!spare) return false;

  var old = crewById(st, f.crew);
  var chain = crewFlights(st, f.crew).filter(notStarted);
  spare.assignedTo = old ? old.assignedTo : null;
  spare.status = "active";
  spare.reportTime = st.clock - CFG.REPORT_BEFORE;
  spare.flightMinsToday = 0;
  spare.location = f.from;

  chain.forEach(function (g) {
    g.crew = spare.id;
    g.crewBlocked = false;
    g.crewBlockReason = null;
    if (g.delayReason === "crew") g.delayReason = null;
    boardFlip(g.id);
  });

  st.reservesLeft--;
  st.reserveUses = (st.reserveUses || 0) + 1;
  logEvent(st, "crew", 2,
    "RESERVE CREW " + spare.id + " ACTIVATED FOR " + f.id + " — " + money(CFG.RESERVE_ACTIVATION),
    CFG.RESERVE_ACTIVATION);

  var ac = aircraftByTail(st, f.aircraft);
  if (ac) recomputeChain(st, ac.tail, null);
  return true;
}

// ---------------------------------------------------------------------------
// 6. ECONOMY, REPUTATION, THE WIRE REPORT
// ---------------------------------------------------------------------------

function computeDayStats(st) {
  var operated = 0, cancelled = 0, onTime = 0, paxCarried = 0;
  var misconnected = 0, stranded = 0, totalDelay = 0, delayed = 0;
  var chargeableDelay = 0;

  st.flights.forEach(function (f) {
    if (f.status === "cancelled") { cancelled++; return; }
    if (f.status === "arrived") {
      operated++;
      paxCarried += f.paxCount;
      var late = f.actualArr - f.schedArr;
      if (late < CFG.ONTIME_THRESHOLD_MINS) onTime++;
      else {
        delayed++;
        totalDelay += late;
        chargeableDelay += late - CFG.ONTIME_THRESHOLD_MINS;
      }
    }
  });

  st.passengers.forEach(function (p) {
    if (p.status === "stranded") stranded += p.size;
    if (p.rebooked) misconnected += p.size;
  });

  return {
    day: st.day,
    operated: operated,
    cancelled: cancelled,
    onTime: onTime,
    otp: operated > 0 ? onTime / operated : 1,
    paxCarried: paxCarried,
    misconnected: misconnected,
    stranded: stranded,
    delayed: delayed,
    chargeableDelay: chargeableDelay,
    avgDelay: delayed > 0 ? totalDelay / delayed : 0
  };
}

function computeMoney(st, stats) {
  var revenue = stats.paxCarried * CFG.REVENUE_PER_PAX_LEG;
  var fuel = stats.operated * CFG.FUEL_PER_FLIGHT;
  var crew = stats.operated * CFG.CREW_PER_FLIGHT;
  var gates = st.airports.length * CFG.GATE_LEASE_PER_AIRPORT;
  var lease = st.aircraft.length * CFG.AIRCRAFT_LEASE_PER_DAY;
  // Every passenger who had to be put on a different aeroplane costs money to
  // move, whether their flight was cancelled or they simply missed the
  // connection. Charging only for cancellations made delays free, which made
  // the second half of the season more profitable than the first.
  var rebook = stats.misconnected * CFG.CANCEL_REBOOK_PER_PAX;
  var strandCost = stats.stranded * CFG.STRAND_PER_PAX;
  var reserves = (st.reserveUses || 0) * CFG.RESERVE_ACTIVATION;
  var maint = st.maintenanceSpentToday || 0;
  var delay = stats.chargeableDelay * CFG.DELAY_COST_PER_MIN;
  var costs = fuel + crew + gates + lease + rebook + strandCost + reserves + maint + delay;
  return {
    revenue: revenue, fuel: fuel, crew: crew, gates: gates, lease: lease,
    rebook: rebook, strand: strandCost, reserves: reserves, maintenance: maint,
    delay: delay,
    costs: costs, net: revenue - costs
  };
}

// Reputation is computed tonight and printed tomorrow. The lag is the point:
// you can fix the operation and still watch the story break.
function computePress(st, stats) {
  var drift = CFG.REP_DRIFT + Math.max(0, st.reputation - CFG.START_REP) * CFG.REP_DRIFT_ABOVE;
  drift = Math.round(drift * 10) / 10;
  var delta = drift;
  var lines = [["THE PUBLIC FORGETS", String(drift)]];
  if (stats.otp >= CFG.REP_ONTIME_THRESHOLD) {
    delta += CFG.REP_ONTIME_BONUS;
    lines.push(["ON-TIME " + Math.round(stats.otp * 100) + "%", "+" + CFG.REP_ONTIME_BONUS]);
  }
  if (stats.cancelled === 0 && stats.stranded === 0) {
    delta += CFG.REP_CLEAN_DAY;
    lines.push(["NOBODY LEFT BEHIND", "+" + CFG.REP_CLEAN_DAY]);
  } else if (stats.cancelled === 0) {
    lines.push(["NO CANCELLATIONS", "0"]);
  } else {
    var c = stats.cancelled * CFG.REP_PER_CANCELLATION;
    delta += c;
    lines.push([stats.cancelled + " CANCELLATION" + (stats.cancelled === 1 ? "" : "S"), String(c)]);
  }
  if (stats.misconnected >= 100) {
    var m = Math.floor(stats.misconnected / 100) * CFG.REP_PER_100_MISCONNECT;
    delta += m;
    lines.push([stats.misconnected + " MISCONNECTED", String(m)]);
  }
  if (stats.stranded >= 100) {
    var s = Math.floor(stats.stranded / 100) * CFG.REP_PER_100_STRANDED;
    delta += s;
    lines.push([stats.stranded + " STRANDED OVERNIGHT", String(s)]);
  } else if (stats.stranded > 0) {
    lines.push([stats.stranded + " STRANDED OVERNIGHT", "0"]);
  }
  return { day: stats.day, delta: Math.round(delta * 10) / 10, lines: lines, headline: headlineFor(st, stats) };
}

var HEADLINES_BAD = [
  "MELTDOWN AT THE HUB",
  "\"WE SLEPT ON THE FLOOR\"",
  "AIRLINE CANCELS ITS WAY THROUGH THE DAY",
  "PASSENGERS LEFT WITH NOTHING BUT A NUMBER",
  "A DAY THE OPERATION NEVER RECOVERED FROM"
];
var HEADLINES_MID = [
  "DELAYS RIPPLE THROUGH NETWORK",
  "A ROUGH AFTERNOON AT THE GATES",
  "CARRIER LIMPS TO MIDNIGHT",
  "SCHEDULE HOLDS, JUST"
];
var HEADLINES_GOOD = [
  "QUIET DAY, FULL AIRCRAFT",
  "CARRIER RUNS CLEAN",
  "NOTHING TO REPORT, AND THAT IS THE STORY",
  "ON TIME, ON PLAN"
];

function headlineFor(st, stats) {
  var rng = makeRng(st.seed ^ (stats.day * 31337));
  if (stats.stranded >= 150 || stats.cancelled >= 4) return pick(rng, HEADLINES_BAD);
  if (stats.cancelled >= 1 || stats.otp < 0.75) return pick(rng, HEADLINES_MID);
  return pick(rng, HEADLINES_GOOD);
}

// The single most expensive thing that happened, named. It is the line players
// screenshot and argue with.
function worstOfDay(st) {
  var worst = null;
  st.events.forEach(function (e) {
    if (!e.cost) return;
    if (!worst || e.cost > worst.cost) worst = e;
  });
  if (worst) return worst.text;
  var late = st.flights.filter(function (f) { return f.status === "arrived" && f.delayMins > 0; })
                       .sort(function (a, b) { return b.delayMins - a.delayMins; })[0];
  if (late) return late.id + " ARRIVED " + late.delayMins + "M LATE";
  return "NOTHING WENT WRONG";
}

function endOfDay(st) {
  if (st.phase !== "day") return;
  var stats = computeDayStats(st);
  var cash = computeMoney(st, stats);
  var incoming = st.pendingPress;

  if (incoming) st.reputation = clamp(st.reputation + incoming.delta, 0, 100);
  st.cash += cash.net;

  st.lastReport = {
    day: st.day,
    stats: stats,
    cash: cash,
    balance: st.cash,
    reputation: st.reputation,
    press: incoming,
    worst: worstOfDay(st),
    forecastNote: null
  };
  st.pendingPress = computePress(st, stats);
  st.maintenanceSpentToday = 0;

  st.history.push({
    day: st.day, otp: stats.otp, cancelled: stats.cancelled,
    misconnected: stats.misconnected, stranded: stats.stranded,
    crewBlocks: st.crewBlocks || 0, reserveUses: st.reserveUses || 0,
    avgDelay: stats.avgDelay, delayed: stats.delayed,
    net: cash.net, balance: st.cash, rep: st.reputation
  });

  st.negativeDays = st.cash < 0 ? st.negativeDays + 1 : 0;
  st.phase = "report";
  st.paused = true;
  audioReportChime();
}

// Aircraft whose check has come due. Authorise it and the aeroplane sits out a
// whole day; defer it and you are quietly borrowing against a worse afternoon.
function maintenanceDueList(st) {
  return st.aircraft.filter(function (ac) { return ac.hoursSinceCheck >= ac.maintenanceDue; });
}

function authorizeCheck(st, ac) {
  // Charged on tomorrow's books, where the player will see the line item next
  // to the revenue the grounded aeroplane did not earn.
  st.maintenanceSpentToday = (st.maintenanceSpentToday || 0) + CFG.MAINTENANCE_CHECK;
  ac.hoursSinceCheck = 0;
  ac.reliability = 1.0;
  ac.deferredCount = 0;
  ac.outOfServiceDay = st.day + 1;
  ac.decided = true;
}

function deferCheck(st, ac) {
  ac.deferredCount++;
  ac.reliability = Math.max(0.4, ac.reliability - CFG.RELIABILITY_PER_DEFERRAL);
  // Buy a little more runway before it asks again, so deferral is a delay and
  // not a permanent escape.
  ac.maintenanceDue += 60;
  ac.decided = true;
}

function advanceDay(st) {
  st.aircraft.forEach(function (ac) { ac.decided = false; });
  st.cancelledPax = 0;
  st.reserveUses = 0;
  st.crewBlocks = 0;

  // Rest. A crew that landed at 22:40 cannot report at 06:10 tomorrow, and
  // that is how one bad evening becomes a slow morning.
  st.crews.forEach(function (cr) {
    var restEnd = (cr.status === "active" && cr.lastArrival > 0)
      ? cr.lastArrival + CFG.DEBRIEF_AFTER + CFG.REST_MINS
      : 0;
    cr.availableFrom = Math.max(0, restEnd - 1440);
    cr.lastArrival = 0;
    cr.status = "reserve";
  });

  st.day++;
  if (st.day > CFG.SEASON_DAYS) { finishRun(st, "season"); return; }
  if (st.negativeDays >= CFG.BANKRUPT_DAYS) { finishRun(st, "bankrupt"); return; }

  applyForecast(st);
  rollWeatherFor(st, st.day + 1, false);
  buildDay(st);
  st.phase = "day";
  st.paused = true;
  st.alert = null;
}

function finishRun(st, why) {
  st.phase = "over";
  st.overReason = why;
  st.paused = true;
  saveRun(st, why);
}

function saveRun(st, why) {
  if (HEADLESS || typeof localStorage === "undefined") return;
  try {
    var raw = localStorage.getItem("groundstop.history");
    var list = raw ? JSON.parse(raw) : [];
    list.unshift({
      at: Date.now(),
      seed: st.seedStr,
      days: st.day - (why === "season" ? 1 : 0),
      cash: Math.round(st.cash),
      rep: Math.round(st.reputation),
      result: why
    });
    localStorage.setItem("groundstop.history", JSON.stringify(list.slice(0, 20)));
  } catch (e) { /* private browsing, quota, whatever — the run still ended */ }
}

function loadHistory() {
  if (HEADLESS || typeof localStorage === "undefined") return [];
  try {
    var raw = localStorage.getItem("groundstop.history");
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

// ---------------------------------------------------------------------------
// 8. AUDIO
//
// All synthesized. iOS will not let an AudioContext make a sound until it has
// been resumed inside a real user gesture, so nothing is created until the
// first tap on the title screen.
// ---------------------------------------------------------------------------

var AC = null;
var master = null;
var noiseBuf = null;
var humNode = null, humGain = null, humFilter = null;
var muted = false;
var clickBudget = 0;
var lastClickAt = 0;

function audioInit() {
  if (AC || HEADLESS) return;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  master = AC.createGain();
  master.gain.value = 0.9;
  master.connect(AC.destination);

  // One second of noise, reused for every flap click. Allocating a buffer per
  // click would be the single most expensive thing in the frame.
  var len = Math.floor(AC.sampleRate * 0.5);
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  // Terminal hum. Always running, gain driven by how many people are stuck.
  humGain = AC.createGain();
  humGain.gain.value = 0;
  humFilter = AC.createBiquadFilter();
  humFilter.type = "lowpass";
  humFilter.frequency.value = 220;
  humNode = AC.createBufferSource();
  humNode.buffer = noiseBuf;
  humNode.loop = true;
  humNode.connect(humFilter);
  humFilter.connect(humGain);
  humGain.connect(master);
  try { humNode.start(); } catch (e) {}
}

function audioResume() {
  if (!AC) audioInit();
  if (AC && AC.state === "suspended") AC.resume();
}

function audioReady() { return AC && !muted && AC.state === "running"; }

// The split-flap click: a very short band-passed noise burst. Fifteen
// milliseconds, and it is the entire identity of the game's sound.
function audioClick(detune) {
  if (!audioReady()) return;
  var now = AC.currentTime;
  if (now - lastClickAt < 0.006) return;   // never stack more than ~160/s
  lastClickAt = now;

  var src = AC.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.value = 1 + (detune || 0);

  var bp = AC.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 1900 + (detune || 0) * 900;
  bp.Q.value = 3.2;

  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.16, now + 0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.016);

  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(now);
  src.stop(now + 0.03);
}

// Soft sine pulse on the hour. The clock you feel rather than read.
function audioTick() {
  if (!audioReady()) return;
  var now = AC.currentTime;
  var o = AC.createOscillator();
  var g = AC.createGain();
  o.type = "sine";
  o.frequency.value = 620;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.05, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);
  o.connect(g); g.connect(master);
  o.start(now); o.stop(now + 0.12);
}

// Two-tone descending. Cancellations only — it has to stay rare to land.
function audioAlarm() {
  if (!audioReady()) return;
  var now = AC.currentTime;
  [[760, 0], [560, 0.16]].forEach(function (pair) {
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = "triangle";
    o.frequency.value = pair[0];
    var t = now + pair[1];
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.18);
  });
}

function audioReportChime() {
  if (!audioReady()) return;
  var now = AC.currentTime;
  [520, 660, 784].forEach(function (f, i) {
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = "sine";
    o.frequency.value = f;
    var t = now + i * 0.09;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.4);
  });
}

function audioTap() {
  if (!audioReady()) return;
  var now = AC.currentTime;
  var o = AC.createOscillator();
  var g = AC.createGain();
  o.type = "square";
  o.frequency.value = 1180;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.035, now + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
  o.connect(g); g.connect(master);
  o.start(now); o.stop(now + 0.06);
}

// The terminal gets louder as the gate area fills with people who are not
// going anywhere tonight.
function audioSetHum(strandedPax) {
  if (!AC || !humGain) return;
  var target = muted ? 0 : clamp(strandedPax / 500, 0, 1) * 0.09;
  humGain.gain.setTargetAtTime(target, AC.currentTime, 1.2);
}

function toggleMute() {
  muted = !muted;
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, AC.currentTime, 0.05);
}

// ---------------------------------------------------------------------------
// 9. THE BOARD
//
// A split-flap cell is a row of character wheels. When the target text changes
// each wheel spins FORWARD through the alphabet until it reaches its new
// letter — which is what a real board does, and why a change from A to B is
// instant while a change from Z to B takes a moment. Characters that did not
// change do not move at all.
// ---------------------------------------------------------------------------

function perfNow() {
  return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
}

function makeCell(w) {
  var chars = [];
  for (var i = 0; i < w; i++) chars.push({ cur: " ", idx: 0, target: 0, done: true, nextAt: 0, stepMs: 30 });
  return { w: w, tgt: " ".repeat(w), chars: chars };
}

function setCell(cell, text, nowMs) {
  text = padRight(String(text).toUpperCase(), cell.w).slice(0, cell.w);
  if (text === cell.tgt) return;
  cell.tgt = text;
  for (var i = 0; i < cell.w; i++) {
    var c = cell.chars[i];
    var to = text[i];
    if (c.cur === to) { c.done = true; continue; }
    var fi = FLAP_INDEX[c.cur];
    var ti = FLAP_INDEX[to];
    if (fi === undefined) fi = 0;
    if (ti === undefined) { c.cur = to; c.done = true; continue; }
    var steps = (ti - fi + FLAP.length) % FLAP.length;
    if (steps === 0) { c.cur = to; c.idx = ti; c.done = true; continue; }
    // Later characters get a slightly larger budget, so the row resolves left
    // to right instead of all at once.
    var budget = CFG.FLAP_CHAR_MS + i * CFG.FLAP_STAGGER_MS;
    c.idx = fi;
    c.target = ti;
    c.stepMs = budget / steps;
    c.nextAt = nowMs + c.stepMs;
    c.done = false;
  }
}

// Advances every wheel and reports how many flaps happened, which is what the
// click track is built from.
function tickCell(cell, nowMs) {
  var flips = 0;
  for (var i = 0; i < cell.w; i++) {
    var c = cell.chars[i];
    var guard = 0;
    while (!c.done && nowMs >= c.nextAt && guard++ < 48) {
      c.idx = (c.idx + 1) % FLAP.length;
      c.cur = FLAP[c.idx];
      flips++;
      if (c.idx === c.target) { c.done = true; }
      else { c.nextAt += c.stepMs; }
    }
    // If the tab was hidden for a while, snap rather than grind.
    if (!c.done && guard >= 48) { c.idx = c.target; c.cur = FLAP[c.target]; c.done = true; }
  }
  return flips;
}

function cellIsSettled(cell) {
  for (var i = 0; i < cell.w; i++) if (!cell.chars[i].done) return false;
  return true;
}

// One board row per flight, created lazily and reused so the wheels keep their
// positions between frames.
var boardRows = {};

function boardRowFor(id) {
  if (!boardRows[id]) {
    boardRows[id] = {
      flt: makeCell(5),
      dest: makeCell(3),
      time: makeCell(5),
      status: makeCell(9)
    };
  }
  return boardRows[id];
}

function boardReset() { boardRows = {}; }

// Called by the simulation when a flight's own state changed, as opposed to it
// being dragged along by something upstream. Its row updates immediately;
// downstream rows wait for their turn in the cascade.
function boardFlip(id) {
  if (!state) return;
  var f = flightById(state, id);
  if (f) f.revealAt = 0;
}

function statusTextFor(f) {
  switch (f.status) {
    case "cancelled": return "CANCELLED";
    case "arrived":   return (f.delayMins >= CFG.ONTIME_THRESHOLD_MINS) ? "IN " + f.delayMins + "M" : "ARRIVED";
    case "departed":  return f.delayReason === "gate" ? "NO GATE" : "DEPARTED";
    case "boarding":  return "BOARDING";
    default:
      if (f.crewBlocked) return "CREW OUT";
      if (f.delayMins < CFG.ONTIME_THRESHOLD_MINS) return "ON TIME";
      switch (f.delayReason) {
        case "mechanical": return "MECH " + f.delayMins + "M";
        case "atc":        return "ATC HOLD";
        case "gate":       return "NO GATE";
        case "weather":    return "WX " + f.delayMins + "M";
        default:           return "DLY " + f.delayMins + "M";
      }
  }
}

function statusColorFor(f) {
  if (f.status === "cancelled") return COLORS.red;
  if (f.crewBlocked) return COLORS.red;
  if (f.status === "arrived") return f.delayMins >= CFG.ONTIME_THRESHOLD_MINS ? COLORS.amber : COLORS.green;
  if (f.status === "departed") return COLORS.green;
  if (f.delayReason === "mechanical" || f.delayReason === "atc" || f.delayReason === "gate") return COLORS.red;
  if (f.delayMins >= CFG.ONTIME_THRESHOLD_MINS) return COLORS.amber;
  return COLORS.green;
}

// The order the board is read in: by the time the flight is actually expected
// to go, which is the only ordering that stays useful once things slip.
function boardOrder(st) {
  return st.flights.slice().sort(function (a, b) {
    var ka = a.status === "arrived" ? a.actualArr : a.plannedDep;
    var kb = b.status === "arrived" ? b.actualArr : b.plannedDep;
    return ka - kb || (a.id < b.id ? -1 : 1);
  });
}

// ---------------------------------------------------------------------------
// LAYOUT
// ---------------------------------------------------------------------------
// One font stack for the whole game. Declared before layout() because that is
// the first thing to use it.
var MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace';
var cv = null, ctx = null;
var L = {
  W: 390, H: 780, dpr: 1,
  safeTop: 0, safeBottom: 0,
  pad: 14, font: 18, charW: 11, rowH: 34,
  headerH: 96, colHeadH: 20, alertH: 32, footerH: 62,
  boardY: 0, boardH: 400, rowsVisible: 12
};

// Character columns, in characters from the left edge of the board.
var COL = { flt: 0, dest: 6, time: 10, status: 16, total: 25 };

function readInsets() {
  if (HEADLESS) return { t: 0, b: 0 };
  var probe = document.getElementById("insets");
  if (!probe) return { t: 0, b: 0 };
  var cs = getComputedStyle(probe);
  return { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
}

function layout() {
  if (HEADLESS) return;
  var w = window.innerWidth, h = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var ins = readInsets();

  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  L.W = w; L.H = h; L.dpr = dpr;
  L.safeTop = ins.t; L.safeBottom = ins.b;
  L.pad = Math.max(12, Math.round(w * 0.035));

  // Largest monospace size whose 25 columns still fit the width.
  var avail = w - L.pad * 2;
  var size = 26;
  for (; size >= 12; size--) {
    ctx.font = "600 " + size + "px " + MONO;
    if (ctx.measureText("M").width * COL.total <= avail) break;
  }
  L.font = size;
  ctx.font = "600 " + size + "px " + MONO;
  L.charW = ctx.measureText("M").width;
  L.rowH = Math.max(30, Math.round(size * 1.9));

  L.headerH = Math.round(L.font * 5.8);
  L.colHeadH = Math.round(L.font * 1.5);
  L.alertH = Math.round(L.font * 1.9);
  L.footerH = 62;

  L.boardY = L.safeTop + L.headerH + L.colHeadH;
  L.boardH = h - L.boardY - L.alertH - L.footerH - L.safeBottom;
  L.rowsVisible = Math.max(4, Math.floor(L.boardH / L.rowH));
}

// ---------------------------------------------------------------------------
// 10. RENDER
// ---------------------------------------------------------------------------

var hits = [];
var boardScroll = 0, boardScrollMax = 0, userScrolledAt = -99999;
var sheetScroll = 0, sheetScrollMax = 0;
var reportScroll = 0, reportScrollMax = 0;
var selectedFlight = null;
var sheetMode = null;          // null | "swap"
var frameFlips = 0;

function hit(x, y, w, h, id, data) { hits.push({ x: x, y: y, w: w, h: h, id: id, data: data }); }

function text(s, x, y, size, color, weight, align) {
  ctx.font = (weight || "500") + " " + size + "px " + MONO;
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(s, x, y);
  ctx.textAlign = "left";
}

function tracked(s, x, y, size, color, weight, spacing) {
  ctx.font = (weight || "700") + " " + size + "px " + MONO;
  ctx.fillStyle = color;
  ctx.textBaseline = "alphabetic";
  var cw = ctx.measureText("M").width + (spacing || 2);
  for (var i = 0; i < s.length; i++) ctx.fillText(s[i], x + i * cw, y);
  return s.length * cw;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Minimum 44pt, always.
function button(x, y, w, h, label, id, opts) {
  opts = opts || {};
  h = Math.max(h, 44);
  var enabled = opts.enabled !== false;
  ctx.save();
  rrect(x, y, w, h, 8);
  ctx.fillStyle = opts.fill || (enabled ? COLORS.panel : "#0c1015");
  ctx.fill();
  ctx.strokeStyle = opts.stroke || (enabled ? (opts.accent || COLORS.panelEdge) : "#161a20");
  ctx.lineWidth = opts.active ? 2 : 1;
  ctx.stroke();
  ctx.restore();
  var fs = opts.size || Math.min(15, Math.max(11, Math.round(h * 0.30)));
  text(label, x + w / 2, y + h / 2 + fs * 0.36, fs,
       enabled ? (opts.color || COLORS.bone) : COLORS.dimmer, "700", "center");
  if (enabled) hit(x, y, w, h, id, opts.data);
  return y + h;
}

function drawFrame(nowMs) {
  hits = [];
  frameFlips = 0;
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, L.W, L.H);

  if (state.phase === "title") { drawTitle(nowMs); return; }
  if (state.phase === "over") { drawGameOver(nowMs); return; }

  drawHeader(nowMs);
  drawColHead();
  drawBoard(nowMs);
  drawAlert(nowMs);
  drawFooter();

  if (selectedFlight) drawFlightSheet(nowMs);
  if (state.phase === "report") drawReport(nowMs);
  if (state.phase === "maintenance") drawMaintenance(nowMs);

  if (frameFlips > 0) {
    var n = Math.min(frameFlips, CFG.MAX_CLICKS_PER_FRAME);
    for (var i = 0; i < n; i++) audioClick((Math.random() - 0.5) * 0.35);
  }
}

// --- Header -----------------------------------------------------------------

function drawHeader(nowMs) {
  var st = state;
  var x = L.pad, y = L.safeTop;
  var f = L.font;

  ctx.fillStyle = COLORS.board;
  ctx.fillRect(0, 0, L.W, L.safeTop + L.headerH);

  tracked("GROUND STOP", x, y + f * 1.1, Math.round(f * 0.62), COLORS.head, "700", 3);
  text("DAY " + padLeft(st.day, 2) + "/" + CFG.SEASON_DAYS, L.W - L.pad, y + f * 1.1,
       Math.round(f * 0.62), COLORS.dim, "700", "right");

  // Clock, big. Everything else on this screen is downstream of it.
  text(hhmmColon(st.clock), x, y + f * 3.0, Math.round(f * 1.75), COLORS.bone, "700");

  var cashColor = st.cash < 0 ? COLORS.red : (st.cash < 60000 ? COLORS.amber : COLORS.bone);
  text(moneyShort(st.cash), L.W - L.pad, y + f * 2.4, Math.round(f * 1.05), cashColor, "700", "right");

  // Reputation, with a bar — the number that quietly decides how full the
  // aeroplanes are tomorrow. On its own line: it used to share one with the
  // cash figure and the bar drew straight through it.
  var repY = y + f * 3.55;
  var repCol = st.reputation >= 60 ? COLORS.green : (st.reputation >= 35 ? COLORS.amber : COLORS.red);
  var numW = Math.round(f * 1.5);
  var barW = Math.round(L.W * 0.20);
  var numX = L.W - L.pad;
  var barX = numX - numW - barW;
  text(String(Math.round(st.reputation)), numX, repY, Math.round(f * 0.72), repCol, "700", "right");
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(barX, repY - f * 0.42, barW, 5);
  ctx.fillStyle = repCol;
  ctx.fillRect(barX, repY - f * 0.42, barW * (st.reputation / 100), 5);
  text("REP", barX - 7, repY, Math.round(f * 0.6), COLORS.dim, "700", "right");

  // Weather strip: today's worst fields, and tomorrow if it is going to be bad.
  var active = st.airports.filter(function (a) { return weatherActive(a, st.clock); })
                          .sort(function (a, b) { return b.weatherDelayMins - a.weatherDelayMins; });
  var coming = st.airports.filter(function (a) {
    return a.weatherDelayMins > 0 && st.clock < a.wxFrom;
  }).sort(function (a, b) { return a.wxFrom - b.wxFrom; });

  var wy = y + f * 4.85;
  var wx = x;
  if (active.length) {
    text("WX", wx, wy, Math.round(f * 0.62), COLORS.dim, "700");
    wx += L.charW * 3;
    active.slice(0, 3).forEach(function (a) {
      var col = a.weather === "storm" ? COLORS.red : COLORS.amber;
      var s = a.code + " +" + a.weatherDelayMins + "M TO " + hhmmColon(a.wxUntil);
      text(s, wx, wy, Math.round(f * 0.62), col, "700");
      wx += L.charW * (s.length + 1.4);
    });
  } else if (coming.length) {
    var c0 = coming[0];
    text("WX  " + c0.code + " " + WEATHER[c0.forecast === c0.weather ? c0.weather : c0.weather].label +
         " FROM " + hhmmColon(c0.wxFrom), wx, wy, Math.round(f * 0.62), COLORS.blue, "700");
  } else {
    text("WX  ALL FIELDS CLEAR", wx, wy, Math.round(f * 0.62), COLORS.dim, "500");
  }

  var stranded = strandedNow(st);
  if (stranded > 0) {
    text(stranded + " STRANDED", L.W - L.pad, wy, Math.round(f * 0.62), COLORS.red, "700", "right");
  } else {
    var storm = st.airports.filter(function (a) { return a.forecast === "storm" || a.forecast === "snow"; });
    if (storm.length) {
      text("TMRW " + storm[0].code + " " + WEATHER[storm[0].forecast].label,
           L.W - L.pad, wy, Math.round(f * 0.62), COLORS.blue, "700", "right");
    }
  }

  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(0, L.safeTop + L.headerH - 1, L.W, 1);
}

function strandedNow(st) {
  var n = 0;
  st.passengers.forEach(function (p) { if (p.status === "stranded") n += p.size; });
  return n;
}

function drawColHead() {
  var y = L.safeTop + L.headerH;
  ctx.fillStyle = "#0d1218";
  ctx.fillRect(0, y, L.W, L.colHeadH);
  var ty = y + L.colHeadH * 0.72;
  var s = Math.round(L.font * 0.62);
  text("FLIGHT", L.pad + COL.flt * L.charW, ty, s, COLORS.dim, "700");
  text("TO", L.pad + COL.dest * L.charW, ty, s, COLORS.dim, "700");
  text("DEPART", L.pad + COL.time * L.charW, ty, s, COLORS.dim, "700");
  text("STATUS", L.pad + COL.status * L.charW, ty, s, COLORS.dim, "700");
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(0, y + L.colHeadH - 1, L.W, 1);
}

// --- The board ---------------------------------------------------------------

function drawBoard(nowMs) {
  var st = state;
  var list = boardOrder(st);
  var rowH = L.rowH;

  boardScrollMax = Math.max(0, list.length * rowH - L.boardH);

  // Follow the operation unless the player has taken the wheel recently.
  if (nowMs - userScrolledAt > 6000) {
    var idx = 0;
    for (var i = 0; i < list.length; i++) {
      if (list[i].status !== "arrived" && list[i].status !== "cancelled") { idx = i; break; }
      idx = i;
    }
    var want = clamp(idx * rowH - rowH * 2, 0, boardScrollMax);
    boardScroll += (want - boardScroll) * 0.08;
  }
  boardScroll = clamp(boardScroll, 0, boardScrollMax);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, L.boardY, L.W, L.boardH);
  ctx.clip();
  ctx.fillStyle = COLORS.board;
  ctx.fillRect(0, L.boardY, L.W, L.boardH);

  var first = Math.max(0, Math.floor(boardScroll / rowH) - 1);
  var last = Math.min(list.length, first + L.rowsVisible + 3);

  for (var r = first; r < last; r++) {
    var f = list[r];
    var y = L.boardY + r * rowH - boardScroll;
    drawBoardRow(f, y, rowH, nowMs, r);
    hit(0, Math.max(L.boardY, y), L.W, Math.min(rowH, L.boardY + L.boardH - y), "flight", f.id);
  }
  ctx.restore();

  // Scroll affordance, only while there is more below.
  if (boardScroll < boardScrollMax - 2) {
    var g = ctx.createLinearGradient(0, L.boardY + L.boardH - 26, 0, L.boardY + L.boardH);
    g.addColorStop(0, "rgba(10,14,19,0)");
    g.addColorStop(1, "rgba(10,14,19,0.95)");
    ctx.fillStyle = g;
    ctx.fillRect(0, L.boardY + L.boardH - 26, L.W, 26);
  }
}

function drawBoardRow(f, y, rowH, nowMs, index) {
  if (y + rowH < L.boardY || y > L.boardY + L.boardH) return;

  var row = boardRowFor(f.id);
  // A row waits its turn during a cascade. The model already knows the answer;
  // this is the only thing standing between the player and being told it all at
  // once, and it is why watching a cascade spread feels like anything.
  if (nowMs >= (f.revealAt || 0)) {
    setCell(row.flt, f.id, nowMs);
    setCell(row.dest, f.to, nowMs);
    setCell(row.time, hhmmColon(f.status === "arrived" ? f.actualDep : f.plannedDep), nowMs);
    setCell(row.status, statusTextFor(f), nowMs);
  }

  frameFlips += tickCell(row.flt, nowMs);
  frameFlips += tickCell(row.dest, nowMs);
  frameFlips += tickCell(row.time, nowMs);
  frameFlips += tickCell(row.status, nowMs);

  if (index % 2 === 1) {
    ctx.fillStyle = COLORS.rowAlt;
    ctx.fillRect(0, y, L.W, rowH);
  }
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(L.pad, y + rowH - 1, L.W - L.pad * 2, 1);

  var done = (f.status === "arrived" || f.status === "cancelled");
  var alpha = done ? 0.42 : 1;
  var baseline = y + rowH * 0.68;
  var fs = L.font;

  ctx.globalAlpha = alpha;
  drawCell(row.flt, L.pad + COL.flt * L.charW, baseline, fs, COLORS.bone);
  drawCell(row.dest, L.pad + COL.dest * L.charW, baseline, fs, COLORS.bone);
  drawCell(row.time, L.pad + COL.time * L.charW, baseline, fs,
           f.delayMins >= CFG.ONTIME_THRESHOLD_MINS && !done ? COLORS.amber : COLORS.bone);
  drawCell(row.status, L.pad + COL.status * L.charW, baseline, fs, statusColorFor(f));
  ctx.globalAlpha = 1;

  // A hairline in the status colour on the left edge: the board reads as a
  // block of colour from arm's length, which is how a real one reads.
  if (!done) {
    ctx.fillStyle = statusColorFor(f);
    ctx.fillRect(0, y + 3, 3, rowH - 7);
  }

  if (selectedFlight === f.id) {
    ctx.strokeStyle = COLORS.bone;
    ctx.lineWidth = 1;
    ctx.strokeRect(2.5, y + 1.5, L.W - 5, rowH - 3);
  }
}

// A settled wheel gets its glyph; a moving one gets whatever it is passing,
// drawn slightly dimmer so the row reads as "in motion" and not as garbage.
function drawCell(cell, x, y, size, color) {
  ctx.font = "700 " + size + "px " + MONO;
  ctx.textBaseline = "alphabetic";
  for (var i = 0; i < cell.w; i++) {
    var c = cell.chars[i];
    if (c.cur === " ") continue;
    ctx.fillStyle = c.done ? color : COLORS.dim;
    ctx.fillText(c.cur, x + i * L.charW, y);
  }
}

// --- Alert strip -------------------------------------------------------------

function drawAlert(nowMs) {
  var y = L.boardY + L.boardH;
  ctx.fillStyle = "#0d1218";
  ctx.fillRect(0, y, L.W, L.alertH);
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(0, y, L.W, 1);

  var a = state.alert;
  var fs = Math.round(L.font * 0.66);
  if (!a) {
    text("OPERATION NORMAL", L.pad, y + L.alertH * 0.68, fs, COLORS.dimmer, "500");
    return;
  }
  var age = nowMs - a.at;
  var col = a.sev >= 3 ? COLORS.red : COLORS.amber;
  if (age < 900 && a.sev >= 3 && Math.floor(age / 150) % 2 === 0) col = COLORS.bone;

  ctx.fillStyle = col;
  ctx.fillRect(L.pad, y + L.alertH / 2 - 3, 6, 6);
  var s = a.text;
  var maxChars = Math.floor((L.W - L.pad * 2 - 14) / (L.charW * 0.66));
  if (s.length > maxChars) s = s.slice(0, maxChars - 1) + "…";
  text(s, L.pad + 14, y + L.alertH * 0.68, fs, col, "700");
}

// --- Footer ------------------------------------------------------------------

function drawFooter() {
  var st = state;
  var h = L.footerH;
  var y = L.H - L.safeBottom - h;
  ctx.fillStyle = COLORS.board;
  ctx.fillRect(0, y, L.W, h + L.safeBottom);
  ctx.fillStyle = COLORS.rule;
  ctx.fillRect(0, y, L.W, 1);

  var bh = 46, by = y + (h - bh) / 2;
  var x = L.pad;
  var gap = 7;
  var wPlay = 54, wSpeed = 46, wMute = 46;

  button(x, by, wPlay, bh, st.paused ? "▶" : "‖", "playpause",
