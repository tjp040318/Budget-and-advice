# Regenerates Pantheon.xcodeproj from scratch: `xcodegen generate`
#
# The checked-in .xcodeproj is the source of truth for day-to-day work. This
# file exists so the project can be rebuilt if it is ever corrupted by a merge,
# and so CI can generate it without a checked-in binary-ish artefact.
name: Pantheon
options:
  bundleIdPrefix: com.pantheon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pantheon:
    type: application
    platform: iOS
    sources:
      - path: Pantheon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantheon.game
        # iCloud container + CloudKit for the social layer and the save's
        # cloud copy (Docs/SOCIAL.md), and Sign in with Apple for accounts
        # (com.apple.developer.applesignin = Default; the capability must
        # also be ticked on the App ID and in Xcode's Signing & Capabilities,
        # Docs/SOCIAL.md *Sign in with Apple*, or the button fails with
        # error 1000). The file carries no aps-environment, so an unsigned
        # CI build is fine.
        CODE_SIGN_ENTITLEMENTS: Pantheon/Pantheon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pantheon
        # Export compliance (Docs/SETTINGS.md §4): the only encryption is
        # Apple's own (HTTPS through URLSession, CloudKit, Sign in with Apple)
        # and SHA-256 hashing, which is exempt, so App Store Connect stops
        # asking at every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Landscape only, the way the genre is played. The battle camera, the
        # HUD and the island painting are all solved for a wide frame.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  PantheonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PantheonTests
    dependencies:
      - target: Pantheon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantheon.game.tests
        GENERATE_INFOPLIST_FILE: YES
