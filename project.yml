# Regenerates Pantheon.xcodeproj from scratch: `xcodegen generate`
#
# The checked-in .xcodeproj is the source of truth for day-to-day work. This
# file exists so the project can be rebuilt if it is ever corrupted by a merge,
# and so CI can generate it without a checked-in binary-ish artefact.
name: Pantheon
options:
  bundleIdPrefix: com.pantheon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pantheon:
    type: application
    platform: iOS
    sources:
      - path: Pantheon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantheon.game
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pantheon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  PantheonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PantheonTests
    dependencies:
      - target: Pantheon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantheon.game.tests
        GENERATE_INFOPLIST_FILE: YES
